app_id: terraza_vidasabor_app
metadata: {title: VidaSabor Terraza}
name: La Terraza de Vida & Sabor
native_deps: |
  <meta name="theme-color" content="#090d16">
  <script>
    // Ejecución síncrona: pinta el fondo antes de que el navegador dibuje
    // el primer frame (evita el flash blanco del runner de Anvil).
    (function () {
      try {
        var s = document.documentElement.style;
        s.setProperty('background-color', '#090d16', 'important');
        s.setProperty('color', '#f8fafc', 'important');
      } catch (e) {}
    })();
    // Shim global no reconfigurable de window.navMenu: cualquier form que
    // intente definir su propio window.navMenu (con fallback a alert) es
    // silenciosamente ignorado. Delega siempre en window.anvilAppNav que
    // cada form Python expone en su __init__.
    (function () {
      try {
        var _fn = function (modulo) {
          if (typeof window.anvilAppNav === 'function') {
            window.anvilAppNav(modulo);
          } else {
            console.warn('[navMenu] anvilAppNav aún no disponible; módulo:', modulo);
          }
        };
        Object.defineProperty(window, 'navMenu', {
          value: _fn,
          writable: false,
          configurable: false,
          enumerable: true
        });
      } catch (e) {
        window.navMenu = function (m) {
          if (window.anvilAppNav) window.anvilAppNav(m);
        };
      }
    })();
  </script>
  <style>
    html, body {
      background: #090d16 !important;
      color: #f8fafc !important;
      margin: 0 !important;
      /* Asegurar scroll vertical natural — evita headers cortados */
      overflow-x: hidden !important;
      overflow-y: auto !important;
      min-height: 100vh !important;
      -webkit-overflow-scrolling: touch !important;
    }
    .anvil-container, .anvil-panel, .anvil-panel-section {
      background: #090d16 !important;
      color: #f8fafc !important;
      /* Estos contenedores no deben limitar el scroll del body */
      overflow: visible !important;
      max-height: none !important;
    }
    /* SPLASH DESDE CSS PURO (aplica antes que cualquier JS).
       Usa body::before para cubrir la app apenas el CSSOM procesa este bloque.
       Se retira cuando body recibe la clase .vs-app-ready (la pone JS). */
    body::before {
      content: 'V&S';
      position: fixed; inset: 0; z-index: 2147483647;
      display: flex; align-items: center; justify-content: center;
      background: #090d16;
      color: transparent;
      font-family: system-ui, sans-serif;
    }
    body::after {
      content: '';
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 72px; height: 72px;
      background: linear-gradient(135deg, #10b981 0%, #0f766e 100%);
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(16,185,129,0.4);
      z-index: 2147483647;
      animation: vs-boot-pulse 1.2s ease-in-out infinite;
    }
    body.vs-app-ready::before,
    body.vs-app-ready::after {
      opacity: 0; pointer-events: none;
      transition: opacity 0.35s ease;
    }
    @keyframes vs-boot-pulse {
      0%,100% { transform: translate(-50%, -50%) scale(1); opacity: 0.95; }
      50% { transform: translate(-50%, -50%) scale(1.06); opacity: 1; }
    }
    /* Logo V&S encima del cuadrado */
    body:not(.vs-app-ready)::before { color: transparent; }
  </style>
  <script>
    // Retira el splash CSS (body::before + body::after) cuando la app está lista.
    (function () {
      var marcarListo = function () {
        var b = document.body;
        if (!b) return false;
        // Verifica que haya contenido real de un form dentro del body.
        var contentEls = document.querySelectorAll('.anvil-form-container, .anvil-panel, .runner-app');
        for (var i = 0; i < contentEls.length; i++) {
          if (contentEls[i].textContent && contentEls[i].textContent.trim().length > 30) {
            b.classList.add('vs-app-ready');
            return true;
          }
        }
        return false;
      };
      var t = 0;
      var iv = setInterval(function () {
        t += 200;
        if (marcarListo() || t > 10000) clearInterval(iv);
      }, 200);
    })();
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="_/theme/theme.css">
  <script src="_/theme/pos_mesero.js"></script>
package_name: VidaSabor
runtime_options:
  client_version: '3'
  server_spec: {}
  server_version: python3-sandbox
  version: 2
services:
- client_config: {enable_v2: true}
  server_config: {}
  source: /runtime/services/tables.yml
startup: {module: AdminMenu, type: form}
startup_form: AdminMenu
