<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Estilos críticos inline: evitan flash blanco antes de que carguen CDN. -->
  <style>
    html, body {
      background-color: #090d16 !important;
      color: #f8fafc !important;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    #vs-splash {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: #090d16;
      z-index: 9999;
      transition: opacity 0.35s ease;
    }
    #vs-splash.hide { opacity: 0; pointer-events: none; }
    #vs-splash .logo {
      width: 72px; height: 72px; border-radius: 20px;
      background: linear-gradient(135deg, #10b981 0%, #0f766e 100%);
      display: flex; align-items: center; justify-content: center;
      color: white; font-weight: 900; font-size: 26px;
      box-shadow: 0 8px 30px rgba(16,185,129,0.3);
      animation: vs-pulse 1.2s ease-in-out infinite;
    }
    @keyframes vs-pulse {
      0%,100% { transform: scale(1); opacity: 0.95; }
      50%     { transform: scale(1.05); opacity: 1; }
    }
  </style>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="_/theme/theme.css">
  <script src="_/theme/pos_mesero.js"></script>
  <style>
    body, .anvil-container, html {
      font-family: 'Inter', system-ui, sans-serif !important;
    }
  </style>
</head>
<body class="bg-[#090d16] text-slate-100">
  <div id="vs-splash">
    <div class="logo">V&amp;S</div>
  </div>
  <div anvil-slot="default"></div>
  <script>
    // Oculta el splash cuando el DOM del anvil-slot tenga contenido real.
    (function () {
      var splash = document.getElementById('vs-splash');
      if (!splash) return;
      var hide = function () {
        splash.classList.add('hide');
        setTimeout(function () { splash.remove(); }, 400);
      };
      // Espera un poco a que Anvil monte el primer form
      var t = 0;
      var check = setInterval(function () {
        t += 200;
        var slot = document.querySelector('[anvil-slot="default"]');
        var hasContent = slot && slot.children.length > 0
                             && slot.textContent.trim().length > 0;
        if (hasContent || t > 6000) {
          clearInterval(check);
          hide();
        }
      }, 200);
    })();
  </script>
</body>
</html>
