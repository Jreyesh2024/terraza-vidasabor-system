<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="_/theme/pos_mesero.js"></script>
  <script>
    window.navMenu = function(modulo) {
      if (typeof window.anvilAppNav === 'function') {
        window.anvilAppNav(modulo);
      } else if (typeof window.navMenuPy === 'function') {
        window.navMenuPy(modulo);
      } else {
        console.log("Navegando a:", modulo);
      }
    };

    window.runFormScripts = function(node) {
      if (!node) node = document.body;
      var root = (node && node.nodeType === 1) ? node : document;
      var scripts = (root.tagName === 'SCRIPT') ? [root] : root.querySelectorAll('script');
      scripts.forEach(function(s) {
        if (!s.dataset.executed) {
          s.dataset.executed = 'true';
          try {
            var newScript = document.createElement('script');
            Array.from(s.attributes).forEach(function(attr) {
              newScript.setAttribute(attr.name, attr.value);
            });
            newScript.textContent = s.textContent;
            document.body.appendChild(newScript);
            newScript.remove();
          } catch(e) {
            console.warn("Error ejecutando script de formulario:", e);
          }
        }
      });
    };

    window.clickSilla = function(m, s) {
      if (typeof window.handleSillaClick !== 'function') {
        window.runFormScripts();
      }
      if (typeof window.handleSillaClick === 'function') {
        window.handleSillaClick(m, s);
      } else {
        console.warn('handleSillaClick aún no está disponible para Mesa', m, 'Silla', s);
      }
    };

    window.clickMesa = function(m) {
      if (typeof window.handleMesaClick !== 'function' && typeof window.abrirPopMenuMesa !== 'function') {
        window.runFormScripts();
      }
      if (typeof window.handleMesaClick === 'function') {
        window.handleMesaClick(m);
      } else if (typeof window.abrirPopMenuMesa === 'function') {
        window.abrirPopMenuMesa(m);
      } else {
        console.warn('handleMesaClick aún no está disponible para Mesa', m);
      }
    };

    try {
      var formObserver = new MutationObserver(function(mutations) {
        mutations.forEach(function(m) {
          m.addedNodes.forEach(function(n) {
            if (n && n.nodeType === 1) {
              window.runFormScripts(n);
            }
          });
        });
      });
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function() {
          formObserver.observe(document.body, { childList: true, subtree: true });
          window.runFormScripts(document.body);
        });
      } else {
        formObserver.observe(document.body, { childList: true, subtree: true });
        window.runFormScripts(document.body);
      }
    } catch(e) {
      console.warn("Observer error:", e);
    }
  </script>
  <style>
    body, .anvil-container, html {
      font-family: 'Inter', sans-serif;
      background-color: #090d16 !important;
      color: #f8fafc !important;
      margin: 0;
      padding: 0;
    }
  </style>
</head>
<body class="bg-[#090d16] text-slate-100">
  <div anvil-slot="default"></div>
</body>
</html>
