        <div class=&quot;p-4 bg-[#0b0e14] rounded-xl border border-[#2b3548]&quot;>
          <span class=&quot;text-[10px] uppercase font-bold text-slate-400 block mb-1&quot;>Ingresos Efectivo Hoy</span>
          <span class=&quot;text-xl font-black text-emerald-400&quot;>$3,900.00</span>
        </div>
        <div class=&quot;p-4 bg-[#0b0e14] rounded-xl border border-[#2b3548]&quot;>
          <span class=&quot;text-[10px] uppercase font-bold text-slate-400 block mb-1&quot;>Pozo de Propinas Acumuladas</span>
          <span class=&quot;text-xl font-black text-purple-400&quot;>$850.00</span>
        </div>
        <div class=&quot;p-4 bg-[#0b0e14] rounded-xl border border-[#2b3548]&quot;>
          <span class=&quot;text-[10px] uppercase font-bold text-slate-400 block mb-1&quot;>Saldo en Cajón</span>
          <span class=&quot;text-xl font-black text-amber-400&quot;>$5,400.00</span>
        </div>
      </div>

      <div class=&quot;flex justify-end gap-3 pt-3&quot;>
        <button onclick=&quot;window.cerrarModalCajaChica()&quot; class=&quot;px-5 py-2 bg-emerald-600 hover:bg-emerald-500 text-xs font-bold rounded-xl text-white&quot;>Aceptar</button>
      </div>
    </div>
  </div>
</div>

<script>
  (function () {
    // 1. ESTADO GLOBAL DEL DASHBOARD
    window.adminState = {
      kpis: {},
      productos: [],
      categorias: [],
      mesas: []
    };

    // 2. ACTUALIZAR FECHA REAL EN ESPAÑOL
    function actualizarFecha() {
      const fechaEl = document.getElementById('ui_fecha_hoy');
      if (fechaEl) {
        const opciones = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        const fechaStr = new Date().toLocaleDateString('es-MX', opciones);
        fechaEl.innerText = fechaStr.charAt(0).toUpperCase() + fechaStr.slice(1);
      }
    }
    actualizarFecha();

    // 3. PUENTE DE NAVEGACIÓN
    window.navMenu = function (modulo) {
      if (modulo === 'salir') {
        window.navMenu('pos_mesero');
        return;
      }
      if (typeof window.anvilAppNav === 'function') {
        window.anvilAppNav(modulo);
      } else {
        console.log(&quot;Navegando a:&quot;, modulo);
      }
    };

    // 4. RENDER DEL DASHBOARD COMPLETO DESDE POSTGRESQL
    window.renderAdminDashboard = function (kpisJson, prodsJson, catsJson, mesasJson) {
      try {
        window.adminState.kpis = (typeof kpisJson === 'string') ? JSON.parse(kpisJson) : kpisJson;
      } catch (e) { console.error('Error parseando KPIs:', e); }

      try {
        window.adminState.productos = (typeof prodsJson === 'string') ? JSON.parse(prodsJson) : prodsJson;
      } catch (e) { console.error('Error parseando productos:', e); }

      try {
        window.adminState.categorias = (typeof catsJson === 'string') ? JSON.parse(catsJson) : catsJson;
      } catch (e) { console.error('Error parseando categorias:', e); }

      try {
        window.adminState.mesas = (typeof mesasJson === 'string') ? JSON.parse(mesasJson) : mesasJson;
      } catch (e) { console.error('Error parseando mesas:', e); }

      const k = window.adminState.kpis;

      // Actualizar 4 KPIs Superiores con comprobación segura
      if (k.ventas) {
        const elVS = document.getElementById('kpi_ventas_semana');
        if (elVS) elVS.innerText = Number(k.ventas.total_semana || 14850).toLocaleString('es-MX', { minimumFractionDigits: 2 });
        const elCS = document.getElementById('kpi_comandas_semana');
        if (elCS) elCS.innerText = k.ventas.comandas_semana || 38;
      }
      if (k.platillo_estrella) {
        const elPN = document.getElementById('kpi_platillo_nombre');
        if (elPN) elPN.innerText = (k.platillo_estrella.icono || '🍳') + ' ' + (k.platillo_estrella.nombre || 'Chilaquiles');
        const elPO = document.getElementById('kpi_platillo_ordenes');
        if (elPO) elPO.innerText = k.platillo_estrella.ordenes_semana || 42;
      }
      if (k.flujo_caja) {
        const elEC = document.getElementById('kpi_efectivo_caja');
        if (elEC) elEC.innerText = Number(k.flujo_caja.efectivo || 5400).toLocaleString('es-MX');
        const elBC = document.getElementById('kpi_bancos');
        if (elBC) elBC.innerText = '$' + Number(k.flujo_caja.bancarizado || 9450).toLocaleString('es-MX', { minimumFractionDigits: 2 });
      }
      if (k.mesas) {
        const elMO = document.getElementById('kpi_mesas_ocupadas');
        if (elMO) elMO.innerText = (k.mesas.ocupadas || 6) + ' mesas activas';
        const elCA = document.getElementById('kpi_comensales_activos');
        if (elCA) elCA.innerText = k.mesas.comensales_activos || 24;
      }

      // Render Comandas Activas (Widget 1)
      const listCmd = document.getElementById('list_comandas_activas');
      const badgeCmd = document.getElementById('ui_badge_comandas');
      if (listCmd) {
        listCmd.innerHTML = '';
        const cmds = k.comandas_recientes || [];
        if (badgeCmd) badgeCmd.innerText = `${cmds.length} activas`;

        cmds.forEach(cmd => {
          const row = document.createElement('div');
          row.className = 'flex items-center justify-between p-3 bg-[#0b0e14] rounded-xl border border-[#2b3548] hover:border-slate-600 transition cursor-pointer';
          row.onclick = function() { window.navMenu('pos_mesero'); };
          row.innerHTML = `
            <div class=&quot;flex items-center gap-3&quot;>
              <div class=&quot;w-8 h-8 rounded-lg bg-emerald-500/10 text-emerald-400 font-bold flex items-center justify-center text-xs&quot;>
                ${cmd.mesa.includes('Centro') ? '⭐' : '🍽️'}
              </div>
              <div>
                <span class=&quot;text-xs font-bold text-white block&quot;>${cmd.mesa} • <span class=&quot;text-slate-400 font-normal&quot;>${cmd.comensal}</span></span>
                <span class=&quot;text-[10px] text-slate-500&quot;>${cmd.hora} • ${cmd.items_count} platillo(s)</span>
              </div>
            </div>
            <div class=&quot;text-right&quot;>
              <span class=&quot;text-xs font-black text-emerald-400 block&quot;>$${Number(cmd.monto).toFixed(2)}</span>
              <span class=&quot;text-[9px] font-bold px-2 py-0.5 rounded-full bg-emerald-950 text-emerald-300 border border-emerald-800&quot;>${cmd.estado}</span>
            </div>
          `;
          listCmd.appendChild(row);
        });
      }

      // Render Alertas de Compras (Widget 2)
      const listIns = document.getElementById('list_alertas_compras');
      const badgeIns = document.getElementById('ui_badge_insumos');
      if (listIns) {
        listIns.innerHTML = '';
        const alertas = k.alertas_insumos || [];
        if (badgeIns) badgeIns.innerText = `${alertas.length} insumos críticos`;

        alertas.forEach(a => {
          const row = document.createElement('div');
          row.className = 'flex items-center justify-between p-3 bg-[#0b0e14] rounded-xl border border-[#2b3548]';
          row.innerHTML = `
            <div class=&quot;flex items-center gap-3&quot;>
              <span class=&quot;w-2.5 h-2.5 rounded-full&quot; style=&quot;background: ${a.color};&quot;></span>
              <div>
                <span class=&quot;text-xs font-bold text-white block&quot;>${a.insumo}</span>
                <span class=&quot;text-[10px] text-slate-400&quot;>Stock actual: ${a.cant_actual} • Consumo: ${a.consumo_semanal}</span>
              </div>
            </div>
            <span class=&quot;px-2.5 py-1 rounded-lg text-[10px] font-bold&quot; style=&quot;background: ${a.color}22; color: ${a.color}; border: 1px solid ${a.color}44;&quot;>
              ${a.urgencia} (${a.dias_restantes})
            </span>
          `;
          listIns.appendChild(row);
        });
      }

      // Llenar select de categorías en el modal
      renderCategoriasSelect();
      renderListaPlatillosModal();
    };

    // 5. FUNCIONALIDAD MODAL GESTIÓN MENÚ
    window.abrirModalAdminMenu = function () {
      const modal = document.getElementById('modalAdminMenu');
      if (modal) {
        modal.classList.remove('hidden');
        modal.classList.add('flex');
        renderListaPlatillosModal();
      }
    };

    window.cerrarModalAdminMenu = function () {
      const modal = document.getElementById('modalAdminMenu');
      if (modal) {
        modal.classList.add('hidden');
        modal.classList.remove('flex');
      }
    };

    function renderCategoriasSelect() {
      const sel = document.getElementById('formCategoriaId');
      if (!sel) return;
      sel.innerHTML = '';
      (window.adminState.categorias || []).forEach(cat => {
        const opt = document.createElement('option');
        opt.value = cat.id;
        opt.innerText = (cat.icono || '🍽️') + ' ' + cat.nombre;
        sel.appendChild(opt);
      });
    }

    function renderListaPlatillosModal() {
      const container = document.getElementById('listaPlatillosAdmin');
      if (!container) return;
      container.innerHTML = '';

      const query = (document.getElementById('filtroPlatilloInput')?.value || '').toLowerCase().trim();
      const prods = window.adminState.productos || [];

      const filtrados = prods.filter(p => {
        return (p.nombre || '').toLowerCase().includes(query) || (p.categoria_nombre || '').toLowerCase().includes(query);
      });

      if (filtrados.length === 0) {
        container.innerHTML = '<div class=&quot;text-xs text-slate-500 text-center py-6&quot;>No se encontraron platillos</div>';
        return;
      }

      filtrados.forEach(p => {
        const item = document.createElement('div');
        item.className = 'p-3 bg-[#0b0e14] rounded-xl border border-[#2b3548] hover:border-amber-500/50 transition cursor-pointer flex items-center justify-between group';
        item.onclick = function () { window.cargarPlatilloEnForm(p.id); };
        item.innerHTML = `
          <div class=&quot;flex items-center gap-2.5 truncate&quot;>
            <span class=&quot;text-lg&quot;>${p.icono || '🍽️'}</span>
            <div class=&quot;truncate&quot;>
              <span class=&quot;text-xs font-bold text-white block truncate group-hover:text-amber-400 transition&quot;>${p.nombre}</span>
              <span class=&quot;text-[10px] text-slate-400 block truncate&quot;>${p.categoria_nombre || 'General'} • $${Number(p.precio_unitario || p.precio || 0).toFixed(2)}</span>
            </div>
          </div>
          <span class=&quot;text-[10px] font-bold px-2 py-0.5 rounded-md ${p.disponible ? 'bg-emerald-950 text-emerald-400 border border-emerald-800' : 'bg-red-950 text-red-400 border border-red-800'}&quot;>
            ${p.disponible ? 'Activo' : 'Pausado'}
          </span>
        `;
        container.appendChild(item);
      });

      if (filtrados.length > 0 &amp;&amp; !document.getElementById('formPlatilloId').value) {
        window.cargarPlatilloEnForm(filtrados[0].id);
      }
    }

    window.filtrarListaPlatillos = function () {
      renderListaPlatillosModal();
    };

    window.nuevoPlatilloForm = function () {
      document.getElementById('formPlatilloTitulo').innerText = '➕ Nuevo Platillo en Menú';
      document.getElementById('formPlatilloIdBadge').innerText = 'Nuevo registro';
      document.getElementById('formPlatilloId').value = '';
      document.getElementById('formNombre').value = '';
      document.getElementById('formPrecio').value = '120.00';
      document.getElementById('formIcono').value = '🍳';
      document.getElementById('formTiempo').value = '8-10 min';
      document.getElementById('formDescripcion').value = '';
      document.getElementById('formTerminos').value = 'Yema tierna, Yema bien cocida, Volteados';
      document.getElementById('formExclusiones').value = 'Sin cebolla, Sin crema, Salsa aparte';
      document.getElementById('formExtras').value = 'Aguacate extra +$25.00, Queso gratinado +$20.00';
      document.getElementById('formIngredientes').value = 'Ingrediente 1 (gramaje)\nIngrediente 2 (gramaje)';
      document.getElementById('formPasos').value = '1. Preparación previa de insumos\n2. Cocción al momento\n3. Emplatado y pase térmico';
      document.getElementById('formNotasReceta').value = 'Vajilla estándar de La Terraza.';
      document.getElementById('formDisponible').checked = true;
    };

    window.cargarPlatilloEnForm = function (prodId) {
      const prod = (window.adminState.productos || []).find(p => p.id === prodId);
      if (!prod) return;

      document.getElementById('formPlatilloTitulo').innerText = `✏️ Editando: ${prod.nombre}`;
      document.getElementById('formPlatilloIdBadge').innerText = `ID #${prod.id} (${prod.codigo_sku || 'SKU'})`;
      document.getElementById('formPlatilloId').value = prod.id;
      document.getElementById('formNombre').value = prod.nombre || '';
      document.getElementById('formCategoriaId').value = prod.categoria_id || 1;
      document.getElementById('formPrecio').value = prod.precio_unitario || prod.precio || 0;
      document.getElementById('formEstacion').value = prod.estacion_preparacion || 'Cocina Caliente';
      document.getElementById('formIcono').value = prod.icono || '🍳';
      document.getElementById('formTiempo').value = prod.tiempo_estimado || '8-10 min';
      document.getElementById('formDescripcion').value = prod.descripcion || '';

      // Opciones comensal
      const terminos = Array.isArray(prod.opciones_termino) ? prod.opciones_termino.join(', ') : (prod.opciones_termino || '');
      document.getElementById('formTerminos').value = terminos;

      const exclusiones = Array.isArray(prod.preferencias_exclusion) ? prod.preferencias_exclusion.join(', ') : (prod.preferencias_exclusion || '');
      document.getElementById('formExclusiones').value = exclusiones;

      let extrasStr = '';
      if (Array.isArray(prod.extras_disponibles)) {
        extrasStr = prod.extras_disponibles.map(e => (typeof e === 'object' ? `${e.nombre} +$${e.precio}` : e)).join(', ');
      }
      document.getElementById('formExtras').value = extrasStr;

      // Ficha técnica
      let ingStr = '';
      if (Array.isArray(prod.ingredientes)) {
        ingStr = prod.ingredientes.map(i => (typeof i === 'object' ? `${i.cant || ''} ${i.item || i.nombre || ''}`.trim() : i)).join('\n');
      }
      document.getElementById('formIngredientes').value = ingStr;

      let pasosStr = '';
      if (Array.isArray(prod.pasos)) {
        pasosStr = prod.pasos.join('\n');
      }
      document.getElementById('formPasos').value = pasosStr;

      document.getElementById('formNotasReceta').value = prod.notas_receta || '';
      document.getElementById('formDisponible').checked = (prod.disponible !== false);
    };

    window.guardarPlatilloDB = function () {
      const idVal = document.getElementById('formPlatilloId').value;
      const nombre = document.getElementById('formNombre').value.trim();
      if (!nombre) {
        alert('Por favor especifique el nombre del platillo');
        return;
      }

      const terminosRaw = document.getElementById('formTerminos').value.split(',').map(s => s.trim()).filter(Boolean);
      const exclusionesRaw = document.getElementById('formExclusiones').value.split(',').map(s => s.trim()).filter(Boolean);
      const extrasRaw = document.getElementById('formExtras').value.split(',').map(s => {
        const parts = s.trim().split('+$');
        return { nombre: parts[0]?.trim() || s.trim(), precio: parseFloat(parts[1]) || 20.00 };
      }).filter(e => e.nombre);

      const ingredientesRaw = document.getElementById('formIngredientes').value.split('\n').map(s => s.trim()).filter(Boolean);
      const pasosRaw = document.getElementById('formPasos').value.split('\n').map(s => s.trim()).filter(Boolean);

      const prodPayload = {
        id: idVal ? parseInt(idVal) : null,
        nombre: nombre,
        categoria_id: parseInt(document.getElementById('formCategoriaId').value),
        precio_unitario: parseFloat(document.getElementById('formPrecio').value) || 0.00,
        estacion_preparacion: document.getElementById('formEstacion').value,
        icono: document.getElementById('formIcono').value || '🍽️',
        tiempo_estimado: document.getElementById('formTiempo').value || '10 min',
        descripcion: document.getElementById('formDescripcion').value,
        opciones_termino: terminosRaw,
        preferencias_exclusion: exclusionesRaw,
        extras_disponibles: extrasRaw,
        ingredientes: ingredientesRaw,
        pasos: pasosRaw,
        notas_receta: document.getElementById('formNotasReceta').value,
        disponible: document.getElementById('formDisponible').checked
      };

      if (typeof window.anvilGuardarProducto === 'function') {
        const resStr = window.anvilGuardarProducto(JSON.stringify(prodPayload));
        alert('✅ ¡Platillo y Ficha Técnica guardados exitosamente en PostgreSQL!');
        window.cerrarModalAdminMenu();
      } else {
        console.log(&quot;Guardando:&quot;, prodPayload);
        alert('✅ Guardado en memoria de prueba.');
        window.cerrarModalAdminMenu();
      }
    };

    // 6. MODALES ADICIONALES
    window.abrirModalPersonal = function () {
      const m = document.getElementById('modalPersonal');
      if (m) { m.classList.remove('hidden'); m.classList.add('flex'); }
    };
    window.cerrarModalPersonal = function () {
      const m = document.getElementById('modalPersonal');
      if (m) { m.classList.add('hidden'); m.classList.remove('flex'); }
    };

    window.abrirModalInventario = function () {
      const m = document.getElementById('modalInventario');
      if (m) { m.classList.remove('hidden'); m.classList.add('flex'); }
    };
    window.cerrarModalInventario = function () {
      const m = document.getElementById('modalInventario');
      if (m) { m.classList.add('hidden'); m.classList.remove('flex'); }
    };

    window.abrirModalCajaChica = function () {
      const m = document.getElementById('modalCajaChica');
      if (m) { m.classList.remove('hidden'); m.classList.add('flex'); }
    };
    window.cerrarModalCajaChica = function () {
      const m = document.getElementById('modalCajaChica');
      if (m) { m.classList.add('hidden'); m.classList.remove('flex'); }
    };

  })();
</script>"></anvil-form>
