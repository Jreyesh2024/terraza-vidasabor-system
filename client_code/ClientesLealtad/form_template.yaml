container:
  type: HtmlTemplate
  properties:
    html: |
      <anvil-form container="HtmlTemplate">
        <script src="https://cdn.tailwindcss.com"></script>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
      
        <div class="min-h-screen bg-[#090d16] text-slate-100 p-6 font-sans">
          <div class="flex justify-between items-center pb-4 border-b border-slate-800 mb-6">
            <div class="flex items-center gap-3">
              <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-purple-500 to-indigo-700 flex items-center justify-center text-xl text-white font-black shadow-lg">
                <i class="fa-solid fa-award"></i>
              </div>
              <div>
                <h1 class="text-lg font-bold text-white">Programa de Lealtad (V&S Rewards)</h1>
                <p class="text-xs text-slate-400">Gestión de clientes frecuentes y puntos de consumo</p>
              </div>
            </div>
            <button onclick="window.navMenu('menu')" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-xs font-bold rounded-xl border border-slate-700 transition flex items-center gap-2">
              <i class="fa-solid fa-arrow-left"></i> Volver al Menú
            </button>
          </div>
      
          <div class="bg-slate-900/80 border border-slate-800 p-6 rounded-2xl max-w-2xl mx-auto space-y-4">
            <h2 class="text-sm font-bold text-white flex items-center gap-2"><i class="fa-solid fa-user-check text-purple-400"></i> Buscar Cliente Frecuente</h2>
            <div class="flex gap-2">
              <input type="text" placeholder="Teléfono o Código de Membresía..." class="flex-1 px-4 py-2.5 bg-slate-800 border border-slate-700 rounded-xl text-sm text-slate-100 placeholder-slate-500 focus:outline-none">
              <button class="px-4 py-2.5 bg-purple-600 hover:bg-purple-500 text-white font-bold text-xs rounded-xl shadow-md transition">
                Buscar / Registrar
              </button>
            </div>
          </div>
        </div>
      </anvil-form>
components: []
is_package: true
