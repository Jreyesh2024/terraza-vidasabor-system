<script>
  (function () {
    window.catalogProducts = [
      { id: 1, categoria_nombre: &quot;Barra de Café &amp; Infusiones&quot;, nombre: &quot;Capuchino Especial V&amp;S&quot;, precio: 68.00, icono: &quot;☕&quot; },

      { id: 5, categoria_nombre: &quot;Desayunos &amp; Brunch Gourmet&quot;, nombre: &quot;Omelette Supremo&quot;, precio: 155.00, icono: &quot;🍳&quot; },

      { id: 7, categoria_nombre: &quot;Especialidades Fuertes&quot;, nombre: &quot;Rib Eye Grill V&amp;S&quot;, precio: 385.00, icono: &quot;🥩&quot; },
      { id: 8, categoria_nombre: &quot;Especialidades Fuertes&quot;, nombre: &quot;Pasta Fettuccine Trufado&quot;, precio: 265.00, icono: &quot;🍝&quot; },
      { id: 9, categoria_nombre: &quot;Repostería &amp; Postres de Autor&quot;, nombre: &quot;Pastel Chocolate Valrhona&quot;, precio: 105.00, icono: &quot;🍰&quot; },
      { id: 10, categoria_nombre: &quot;Bebidas &amp; Coctelería de Autor&quot;, nombre: &quot;Limonada Botánica&quot;, precio: 60.00, icono: &quot;🍋&quot; }
    ];

    var DEFAULT_CUENTAS = {
      '3-1': {
        estado: 'ocupada',
        qrId: 'PV-031',
        comensalNombre: 'Comensal Portavasos #31',
        items: [
          { id: 4, nombre: 'Chilaquiles Verdes Pollo', notas: 'Sin cebolla • Salsa aparte', precio: 148.00, cantidad: 1, mesaId: 3, sillaNum: 1, hora: '12:15 PM' }
        ],
        historialUbicaciones: [
          { mesaId: 3, sillaNum: 1, hora: '12:10 PM' }
        ]
      },
      '3-2': {
        estado: 'ocupada',
        qrId: 'PV-032',
        comensalNombre: 'Comensal Portavasos #32',
        items: [
          { id: 1, nombre: 'Capuchino Especial V&amp;S', notas: 'Leche de almendras', precio: 68.00, cantidad: 1, mesaId: 3, sillaNum: 2, hora: '12:20 PM' }
        ],
        historialUbicaciones: [
          { mesaId: 3, sillaNum: 2, hora: '12:20 PM' }
        ]
      }
    };

    function saveStateToStorage() {
      try {
        localStorage.setItem('palapa_cuentas_v1', JSON.stringify(window.palapaState.cuentas));
      } catch (e) {}
    }

    function loadStateFromStorage() {
      try {
        var saved = localStorage.getItem('palapa_cuentas_v1');
        if (saved) {
          var parsed = JSON.parse(saved);
          if (parsed &amp;&amp; typeof parsed === 'object' &amp;&amp; Object.keys(parsed).length > 0) {
            return parsed;
          }
        }
      } catch (e) {}
      return JSON.parse(JSON.stringify(DEFAULT_CUENTAS));
    }

    window.palapaState = {
      mesaSeleccionadaId: 3,
      sillaSeleccionadaNum: 1,
      categoriaFiltro: &quot;Todos&quot;,
      modoMoverActivo: false,
      sillaOrigenMover: null,
      cuentas: loadStateFromStorage()
    };

    function resetDemoState() {
      window.palapaState.cuentas = JSON.parse(JSON.stringify(DEFAULT_CUENTAS));
      window.palapaState.mesaSeleccionadaId = 3;
      window.palapaState.sillaSeleccionadaNum = 1;
      saveStateToStorage();
      cancelarModoMover();
      cerrarModalComanda();
      renderStateUI();
      showDragToast('🔄 Estado reiniciado a demo inicial (Mesa 3 S1 y S2)', 'ok');
    }

    // ── Toast de notificación (reemplaza alert()) ──
    var _toastTimer = null;
    function showDragToast(msg, tipo) {
      // tipo: 'ok' | 'warn' | 'err'
      var t = document.getElementById('dragToast');
      if (!t) return;
      t.textContent = msg;
      t.className = 'show toast-' + (tipo || 'ok');
      if (_toastTimer) clearTimeout(_toastTimer);
      _toastTimer = setTimeout(function () {
        t.className = t.className.replace(' show', '').replace('show', '');
      }, 3200);
    }

    // ── Mini-modal confirmación (reemplaza confirm()) ──
    var _combineCallback = null;
    function showCombineConfirm(srcMesa, srcSilla, tgtMesa, tgtSilla, onYes) {
      var backdrop = document.getElementById('combineConfirmBackdrop');
      var title = document.getElementById('combineConfirmTitle');
      var msg = document.getElementById('combineConfirmMsg');
      var detail = document.getElementById('combineConfirmDetail');
      if (!backdrop) { onYes(); return; }

      if (title) title.textContent = 'Combinar Cuentas';
      if (msg) msg.textContent = 'Ambas sillas ya tienen consumos.';
      if (detail) detail.innerHTML =
        '<b style=&quot;color:#f59e0b;&quot;>Origen:</b> Mesa ' + srcMesa + ' Silla ' + srcSilla +
        '<br><b style=&quot;color:#38bdf8;&quot;>Destino:</b> Mesa ' + tgtMesa + ' Silla ' + tgtSilla +
        '<br><span style=&quot;color:#64748b;font-size:11px;&quot;>Los consumos del origen se agregarán a la silla destino.</span>';

      _combineCallback = onYes;
      backdrop.classList.add('show');

      document.getElementById('combineConfirmYes').onclick = function () {
        backdrop.classList.remove('show');
        if (_combineCallback) _combineCallback();
        _combineCallback = null;
      };
      document.getElementById('combineConfirmNo').onclick = function () {
        backdrop.classList.remove('show');
        _combineCallback = null;
        cancelarModoMover();
      };
    }

    // ════════════════════════════════════════════════════════════
    //  DRAG DE SILLAS — patrón mousedown/mousemove/mouseup
    //  Igual al resize de VidaSpa: eventos en document para que
    //  z-index y pointer-events de elementos hijos NO interfieran.
    //  document.elementFromPoint() en mouseup detecta la silla destino.
    // ════════════════════════════════════════════════════════════

    var _ms = {
      active: false,   // mousedown activo esperando movimiento
      dragging: false,   // ya pasó el umbral → modo drag visual
      srcMesa: null,
      srcSilla: null,
      startX: 0,
      startY: 0,
      ghost: null
    };
    var _wasDrag = false; // bloquea el click que dispara el browser post-mouseup
    var DRAG_THRESHOLD = 6; // píxeles mínimos para activar drag

    function _limpiarDragVisual() {
      document.querySelectorAll('.chair-btn-fixed').forEach(function (c) {
        c.classList.remove('chair-dragging', 'chair-drag-target-valid', 'chair-drag-target-combine');
      });
      if (_ms.ghost &amp;&amp; _ms.ghost.parentNode) {
        _ms.ghost.parentNode.removeChild(_ms.ghost);
      }
      _ms.ghost = null;
    }

    function getClosestChair(mesaId, clientX, clientY, srcM, srcS) {
      var minDist = Infinity;
      var closest = null;
      for (var s = 1; s <= 4; s++) {
        if (mesaId === srcM &amp;&amp; s === srcS) continue;
        var el = document.getElementById('chair-' + mesaId + '-' + s);
        if (!el) continue;
        var rect = el.getBoundingClientRect();
        var cx = rect.left + rect.width / 2;
        var cy = rect.top + rect.height / 2;
        var dist = Math.hypot(clientX - cx, clientY - cy);
        if (dist < minDist) { minDist = dist; closest = { mesa: mesaId, silla: s }; }
      }
      return closest;
    }

    function _resolveTargetChair(clientX, clientY, srcM, srcS) {
      var elem = document.elementFromPoint(clientX, clientY);

      // 1. Direct hit on chair
      if (elem) {
        var chairEl = elem.closest ? elem.closest('.chair-btn-fixed') : null;
        if (chairEl) {
          var p = chairEl.id.split('-');
          var tM = parseInt(p[1]);
          var tS = parseInt(p[2]);
          if (!(tM === srcM &amp;&amp; tS === srcS)) {
            return { mesaId: tM, sillaNum: tS, el: chairEl };
          }
        }

        // 2. Hit on table box or table circle
        var tableBox = elem.closest ? elem.closest('.table-box-220') : null;
        var tableCircle = elem.closest ? elem.closest('.table-circle-fixed') : null;
        var mesaId = null;
        if (tableBox &amp;&amp; tableBox.id) {
          mesaId = parseInt(tableBox.id.replace('table-box-', ''));
        } else if (tableCircle &amp;&amp; tableCircle.id) {
          mesaId = parseInt(tableCircle.id.replace('table-circle-', ''));
        }

        if (mesaId) {
          var closest = getClosestChair(mesaId, clientX, clientY, srcM, srcS);
          if (closest) {
            var cel = document.getElementById('chair-' + closest.mesa + '-' + closest.silla);
            return { mesaId: closest.mesa, sillaNum: closest.silla, el: cel };
          }
        }
      }

      // 3. Proximity fallback: find closest chair within 150px
      var globalMinDist = Infinity;
      var globalClosest = null;
      for (var m = 1; m <= 3; m++) {
        for (var s = 1; s <= 4; s++) {
          if (m === srcM &amp;&amp; s === srcS) continue;
          var cel = document.getElementById('chair-' + m + '-' + s);
          if (!cel) continue;
          var rect = cel.getBoundingClientRect();
          var cx = rect.left + rect.width / 2;
          var cy = rect.top + rect.height / 2;
          var dist = Math.hypot(clientX - cx, clientY - cy);
          if (dist < globalMinDist &amp;&amp; dist < 150) {
            globalMinDist = dist;
            globalClosest = { mesaId: m, sillaNum: s, el: cel };
          }
        }
      }

      return globalClosest;
    }

    function _chairMousedown(e, mesaId, sillaNum) {
      // Solo button izquierdo y solo sillas con cuenta
      if (e.button !== 0) return;
      var key = mesaId + '-' + sillaNum;
      var cuenta = window.palapaState.cuentas[key];
      if (!cuenta || !cuenta.items || cuenta.items.length === 0) return;

      _ms.active = true;
      _ms.dragging = false;
      _ms.srcMesa = mesaId;
      _ms.srcSilla = sillaNum;
      _ms.startX = e.clientX;
      _ms.startY = e.clientY;

      document.addEventListener('mousemove', _chairMousemove);
      document.addEventListener('mouseup', _chairMouseup);
    }

    function _chairMousemove(e) {
      if (!_ms.active) return;

      var dx = Math.abs(e.clientX - _ms.startX);
      var dy = Math.abs(e.clientY - _ms.startY);

      // ── Activar modo drag si pasó el umbral ──
      if (!_ms.dragging &amp;&amp; (dx > DRAG_THRESHOLD || dy > DRAG_THRESHOLD)) {
        _ms.dragging = true;
        cerrarModalComanda();
        window.palapaState.modoMoverActivo = true;
        window.palapaState.sillaOrigenMover = { mesaId: _ms.srcMesa, sillaNum: _ms.srcSilla };

        // Marcar silla origen
        var srcEl = document.getElementById('chair-' + _ms.srcMesa + '-' + _ms.srcSilla);
        if (srcEl) srcEl.classList.add('chair-dragging');

        // Ghost que sigue al cursor (pointer-events:none → no bloquea elementFromPoint)
        var ghost = document.createElement('div');
        ghost.style.cssText = [
          'position:fixed', 'z-index:99999', 'pointer-events:none',
          'padding:8px 18px', 'background:#0f172a', 'color:#38bdf8',
          'font-size:13px', 'font-weight:800', 'border-radius:12px',
          'border:2px solid #38bdf8', 'white-space:nowrap',
          'box-shadow:0 8px 28px rgba(0,0,0,0.85)',
          'transform:translate(-50%,-130%)',
          'left:' + e.clientX + 'px', 'top:' + e.clientY + 'px'
        ].join(';') + ';';
        var key = _ms.srcMesa + '-' + _ms.srcSilla;
        var cuenta = window.palapaState.cuentas[key] || { items: [] };
        var total = 0;
        cuenta.items.forEach(function (i) { total += i.precio * i.cantidad; });
        ghost.textContent = '\uD83E\uDE91 M' + _ms.srcMesa + ' \u00b7 S' + _ms.srcSilla + '  $' + total.toFixed(2);
        document.body.appendChild(ghost);
        _ms.ghost = ghost;

        // Banner
        var bt = document.getElementById('bannerText');
        var bc = document.getElementById('btnCancelMove');
        if (bt) bt.innerHTML = '\uD83E\uDE91 <b style=&quot;color:#38bdf8;&quot;>ARRASTRANDO</b> Mesa ' + _ms.srcMesa + ' Silla ' + _ms.srcSilla + ' \u2014 Suelta sobre la silla destino (misma o diferente mesa).';
        if (bc) bc.style.setProperty('display', 'block', 'important');
      }

      if (!_ms.dragging) return;

      // ── Mover ghost ──
      if (_ms.ghost) {
        _ms.ghost.style.left = e.clientX + 'px';
        _ms.ghost.style.top = e.clientY + 'px';
      }

      // ── Highlight silla destino detectada ──
      document.querySelectorAll('.chair-btn-fixed').forEach(function (c) {
        c.classList.remove('chair-drag-target-valid', 'chair-drag-target-combine');
      });

      var target = _resolveTargetChair(e.clientX, e.clientY, _ms.srcMesa, _ms.srcSilla);
      if (target &amp;&amp; target.el) {
        var tgt = window.palapaState.cuentas[target.mesaId + '-' + target.sillaNum];
        var busy = tgt &amp;&amp; tgt.items &amp;&amp; tgt.items.length > 0;
        target.el.classList.add(busy ? 'chair-drag-target-combine' : 'chair-drag-target-valid');
      }
    }

    function _chairMouseup(e) {
      document.removeEventListener('mousemove', _chairMousemove);
      document.removeEventListener('mouseup', _chairMouseup);

      var wasRealDrag = _ms.dragging;
      var srcM = _ms.srcMesa;
      var srcS = _ms.srcSilla;

      _limpiarDragVisual();
      _ms.active = false;
      _ms.dragging = false;
      _ms.srcMesa = null;
      _ms.srcSilla = null;

      if (!wasRealDrag) {
        return;
      }

      // ── Es un drag real: bloquear el click post-mouseup ──
      _wasDrag = true;
      setTimeout(function () { _wasDrag = false; }, 80);

      // Resolver la silla destino
      var target = _resolveTargetChair(e.clientX, e.clientY, srcM, srcS);
      if (target) {
        completarMovimiento(target.mesaId, target.sillaNum, srcM, srcS);
      } else {
        cancelarModoMover();
        showDragToast('\u26a0 Suelta sobre una silla o mesa para mover la cuenta', 'warn');
      }
    }

    function setupDragListeners() {
      // Asignar mousedown a TODAS las sillas (no solo ocupadas).
      // _chairMousedown ya verifica si tiene cuenta antes de activar.
      for (var m = 1; m <= 3; m++) {
        for (var s = 1; s <= 4; s++) {
          (function (mesaId, sillaNum) {
            var el = document.getElementById('chair-' + mesaId + '-' + sillaNum);
            if (!el) return;
            el.addEventListener('mousedown', function (e) {
              _chairMousedown(e, mesaId, sillaNum);
            });
          })(m, s);
        }
      }
    }

    // Global Event Delegation for all Clicks
    document.addEventListener('click', function (e) {
      // Ignorar click que el browser dispara tras un drag con mouse
      if (_wasDrag) return;
      // 1. Chair clicked
      const chairNode = e.target.closest('.chair-btn-fixed');
      if (chairNode) {
        const id = chairNode.id; // e.g. &quot;chair-3-1&quot;
        const parts = id.split('-');
        if (parts.length === 3) {
          const mesaId = parseInt(parts[1]);
          const sillaNum = parseInt(parts[2]);
          handleSillaClick(mesaId, sillaNum);
          return;
        }
      }

      // 2. Table circle clicked
      const tableNode = e.target.closest('.table-circle-fixed');
      if (tableNode) {
        const id = tableNode.id; // e.g. &quot;table-circle-3&quot;
        const parts = id.split('-');
        if (parts.length === 3) {
          const mesaId = parseInt(parts[2]);
          handleMesaClick(mesaId);
          return;
        }
      }

      // 3. Category chip clicked
      const chipNode = e.target.closest('[data-cat]');
      if (chipNode) {
        const cat = chipNode.getAttribute('data-cat');
        filtrarCategoria(cat);
        return;
      }

      // 4. Action buttons
      if (e.target.closest('#btnResetDemo')) { resetDemoState(); return; }
      if (e.target.closest('#btnVerComandaActiva')) { abrirModalComandaActual(); return; }
      if (e.target.closest('#btnMoverComensalMain')) { iniciarModoMover(); return; }
      if (e.target.closest('#btnMoverDesdeModal')) { cerrarModalComanda(); iniciarModoMover(); return; }
      if (e.target.closest('#btnCloseModal') || e.target.closest('#btnCerrarModalBottom')) { cerrarModalComanda(); return; }
      if (e.target.closest('#btnCancelMove')) { cancelarModoMover(); return; }
      if (e.target.closest('#btnEnviarCocina')) { alert(`Comanda enviada a Cocina (KDS)`); cerrarModalComanda(); return; }
      if (e.target.closest('#btnPrecuenta')) { alert(`Imprimiendo precuenta`); cerrarModalComanda(); return; }

                                                     // 5. Click outside modal content (on backdrop) closes modal
                                                     if (e.target.id === 'modalComandaBackdrop') {
                                                     cerrarModalComanda();
                                                     return;
                                                     }
                                                     });

                                                     // Escape key closes modals and cancels move mode
                                                     document.addEventListener('keydown', function (e) {
                                                     if (e.key === 'Escape') {
                                                     cerrarModalComanda();
                                                     cancelarModoMover();
                                                     var cb = document.getElementById('combineConfirmBackdrop');
                                                     if (cb) cb.classList.remove('show');
                                                     }
                                                     });

                                                     function handleSillaClick(mesaId, sillaNum) {
                                                     if (window.palapaState.modoMoverActivo) {
                                                     completarMovimiento(mesaId, sillaNum);
                                                     return;
                                                     }
                                                     window.palapaState.mesaSeleccionadaId = mesaId;
                                                     window.palapaState.sillaSeleccionadaNum = sillaNum;
                                                     renderStateUI();
                                                     abrirModalComandaActual();
                                                     }

                                                     function handleMesaClick(mesaId) {
                                                     if (window.palapaState.modoMoverActivo) {
                                                     alert(&quot;Selecciona una silla específica a donde deseas mover la cuenta.&quot;);
                                                     return;
                                                     }
                                                     window.palapaState.mesaSeleccionadaId = mesaId;
                                                     window.palapaState.sillaSeleccionadaNum = null;
                                                     renderStateUI();
                                                     abrirModalComandaActual();
                                                     }

                                                     function iniciarModoMover() {
                                                     const mesaId = window.palapaState.mesaSeleccionadaId;
                                                     const sillaNum = window.palapaState.sillaSeleccionadaNum;

                                                     if (sillaNum === null) {
                                                     alert(&quot;Por favor selecciona una silla específica para mover.&quot;);
                                                     return;
                                                     }

                                                     const key = `${mesaId}-${sillaNum}`;
                                                     const cuenta = window.palapaState.cuentas[key];

                                                     if (!cuenta || !cuenta.items || cuenta.items.length === 0) {
                                                     alert(`La Silla ${sillaNum} de Mesa ${mesaId} está vacía. Selecciona una silla ocupada para mover.`);
                                                     return;
                                                     }

                                                     window.palapaState.modoMoverActivo = true;
                                                     window.palapaState.sillaOrigenMover = { mesaId, sillaNum };

                                                     const bannerText = document.getElementById('bannerText');
                                                     const btnCancel = document.getElementById('btnCancelMove');

                                                     if (bannerText &amp;&amp; btnCancel) {
                                                     bannerText.innerHTML = `<b style=&quot;color: #38bdf8;&quot;>MOVIENDO COMENSAL:</b> Silla origen: <b>Mesa ${mesaId} Silla ${sillaNum}</b>. Haz clic en la <b>Silla Destino</b> a donde deseas transferir la cuenta.`;
                                                     btnCancel.style.display = 'block';
                                                     }

                                                     renderStateUI();
                                                     }

                                                     function limpiarDragState() {
                                                     _limpiarDragVisual();
                                                     }

                                                     function cancelarModoMover() {
                                                     window.palapaState.modoMoverActivo = false;
                                                     window.palapaState.sillaOrigenMover = null;
                                                     if (typeof _ms !== 'undefined') {
                                                     _ms.active   = false;
                                                     _ms.dragging = false;
                                                     _ms.srcMesa  = null;
                                                     _ms.srcSilla = null;
                                                     }
                                                     _limpiarDragVisual();

                                                     const bannerText = document.getElementById('bannerText');
                                                     const btnCancel = document.getElementById('btnCancelMove');

                                                     if (bannerText &amp;&amp; btnCancel) {

                                                     function completarMovimiento(targetMesaId, targetSillaNum, overrideSrcMesa, overrideSrcSilla) {
                                                     // Soporte dual: modo click (sillaOrigenMover) y drag &amp; drop (override params)
                                                     var srcMesa = overrideSrcMesa !== undefined ? overrideSrcMesa : (window.palapaState.sillaOrigenMover ? window.palapaState.sillaOrigenMover.mesaId : null);
                                                     var srcSilla = overrideSrcSilla !== undefined ? overrideSrcSilla : (window.palapaState.sillaOrigenMover ? window.palapaState.sillaOrigenMover.sillaNum : null);

                                                     if (srcMesa === null || srcSilla === null) return;
                                                     if (srcMesa === targetMesaId &amp;&amp; srcSilla === targetSillaNum) {
                                                     cancelarModoMover(); return;

                                                     // Sincronizar estado por si viene de drag (sillaOrigenMover puede ser null)
                                                     if (!window.palapaState.sillaOrigenMover) {

                                                     var sourceKey = srcMesa + '-' + srcSilla;

                                                     if (sourceCuenta.items) {

                                                     sourceCuenta.historialUbicaciones = sourceCuenta.historialUbicaciones || [{ mesaId: srcMesa, sillaNum: srcSilla, hora: nowStr }];
                                                     var yaExiste = sourceCuenta.historialUbicaciones.some(function (u) { return u.mesaId === targetMesaId &amp;&amp; u.sillaNum === targetSillaNum; });
                                                     if (!yaExiste) {

                                                     window.palapaState.mesaSeleccionadaId = targetMesaId;

                                                     saveStateToStorage();

                                                     function abrirModalComandaActual() {
                                                     const mesaId = window.palapaState.mesaSeleccionadaId;
                                                     const sillaNum = window.palapaState.sillaSeleccionadaNum;

                                                     const modal = document.getElementById('modalComandaBackdrop');

                                                     if (!container || !modal) return;

                                                     const qrId = cuenta.qrId || ('PV-' + mesaId + sillaNum);

                                                     if (title) title.innerHTML = `<i class=&quot;fa-solid fa-receipt&quot; style=&quot;color: #34d399;&quot;></i> Ticket Silla ${sillaNum} <span style=&quot;font-size: 11px; background: #1e293b; color: #38bdf8; padding: 2px 8px; border-radius: 6px; border: 1px solid #334155; margin-left: 6px;&quot;>🏷️ QR ${qrId}</span>`;
                                                     if (subtitle) subtitle.innerText = `Mesa ${mesaId} • Ubicación Actual`;

                                                     if (subtotalMontoEl) subtotalMontoEl.innerText = '$0.00';

                                                     var tramoKeys = Object.keys(tramosMap);
                                                     var totalNeto = 0;

                                                     // Configurar contenedor en 2 columnas verticales si hay más de 1 tramo
                                                     if (tramoKeys.length > 1) {
                                                     container.style.cssText = 'display: grid !important; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)) !important; gap: 12px !important; max-height: 280px !important; overflow-y: auto !important;';

                                                     tramoKeys.forEach((tKey, tIdx) => {
                                                     var tramo = tramosMap[tKey];
                                                     totalNeto += tramo.subtotal;
                                                     var isCurrent = (tramo.mesaId === mesaId &amp;&amp; tramo.sillaNum === sillaNum);

                                                     var tramoCard = document.createElement('div');
                                                     tramoCard.style.cssText = 'background: #020617 !important; border: 1px solid ' + (isCurrent ? '#059669' : '#334155') + ' !important; border-radius: 14px !important; padding: 12px !important; display: flex !important; flex-direction: column !important; justify-content: space-between !important; gap: 8px !important; box-shadow: inset 0 0 15px rgba(0,0,0,0.5) !important;';

                                                     var tramoHeader = document.createElement('div');

                                                     tramoHeader.innerHTML = `

                                                     <span style=&quot;font-weight: 900; color: ${isCurrent ? '#34d399' : '#fbbf24'}; font-size: 12px;&quot;>
                                                     <i class=&quot;fa-solid fa-receipt&quot; style=&quot;margin-right: 4px;&quot;></i> Ticket Tramo ${tIdx + 1}
                                                     </span>
                                                     <span style=&quot;font-size: 10px; color: #94a3b8; font-weight: bold;&quot;>Mesa ${tramo.mesaId} • Silla ${tramo.sillaNum}</span>
                                                     </div>
                                                     <span style=&quot;background: ${isCurrent ? 'rgba(16,185,129,0.2)' : 'rgba(245,158,11,0.2)'}; color: ${isCurrent ? '#34d399' : '#fbbf24'}; font-size: 9px; font-weight: 800; padding: 2px 6px; border-radius: 6px; text-transform: uppercase;&quot;>
                                                     ${isCurrent ? 'Actual' : 'Histórico'}
                                                     </span>
                                                     `;
                                                     tramoCard.appendChild(tramoHeader);

                                                     var itemsWrapper = document.createElement('div');
                                                     itemsWrapper.style.cssText = 'display: flex !important; flex-direction: column !important; gap: 6px !important; flex: 1 !important;';

                                                     tramo.items.forEach(obj => {
                                                     var it = obj.item;
                                                     var sub = it.precio * it.cantidad;
                                                     var row = document.createElement('div');
                                                     row.style.cssText = 'display: flex !important; justify-content: space-between !important; align-items: center !important; background: #0f172a !important; padding: 6px 8px !important; border-radius: 8px !important; border: 1px solid #1e293b !important; font-size: 11px !important;';
                                                     row.innerHTML = `
                                                     <div style=&quot;flex: 1; padding-right: 6px;&quot;>
                                                     <span style=&quot;font-weight: 700; color: #ffffff; display: block; line-height: 1.2;&quot;>${it.cantidad}x ${it.nombre}</span>
                                                     <span style=&quot;font-size: 9px; color: #94a3b8; font-style: italic;&quot;>${it.notas ? it.notas + ' • ' : ''}${it.hora || ''}</span>
                                                     </div>
                                                     <div style=&quot;display: flex; align-items: center; gap: 6px;&quot;>
                                                     <span style=&quot;font-weight: 900; color: #34d399; font-size: 11px;&quot;>$${sub.toFixed(2)}</span>
                                                     <button onclick=&quot;window.eliminarItemModal('${key}', ${obj.originalIdx})&quot; style=&quot;background: transparent; border: none; color: #f87171; cursor: pointer; padding: 2px;&quot;><i class=&quot;fa-solid fa-trash-can&quot; style=&quot;font-size: 10px;&quot;></i></button>
                                                     </div>
                                                     `;
                                                     itemsWrapper.appendChild(row);
                                                     });
                                                     tramoCard.appendChild(itemsWrapper);

                                                     var tramoFooter = document.createElement('div');
                                                     tramoFooter.style.cssText = 'display: flex !important; justify-content: space-between !important; align-items: center !important; padding-top: 6px !important; border-top: 1px dashed #334155 !important; font-size: 11px !important; margin-top: 4px !important;';
                                                     tramoFooter.innerHTML = `
                                                     <span style=&quot;color: #94a3b8; font-weight: 600;&quot;>Subtotal Tramo ${tIdx + 1}:</span>
                                                     <span style=&quot;color: #ffffff; font-weight: 900;&quot;>$${tramo.subtotal.toFixed(2)}</span>
                                                     `;
                                                     tramoCard.appendChild(tramoFooter);

                                                     container.appendChild(tramoCard);
                                                     });

                                                     // Cálculos fiscales y consolidados
                                                     var ivaVal = totalNeto * 0.16;
                                                     var propinaVal = totalNeto * 0.10;
                                                     var totalFinal = totalNeto + ivaVal;

                                                     if (subtotalMontoEl) subtotalMontoEl.innerText = `$${totalNeto.toFixed(2)}`;
                                                     if (ivaMontoEl) ivaMontoEl.innerText = `$${ivaVal.toFixed(2)}`;
                                                     if (propinaMontoEl) propinaMontoEl.innerText = `$${propinaVal.toFixed(2)}`;
                                                     if (totalMontoEl) totalMontoEl.innerText = `$${totalFinal.toFixed(2)}`;
                                                     if (totalLabelEl) totalLabelEl.innerText = `Total a Pagar:`;
                                                     }

                                                     } else {
                                                     if (title) title.innerHTML = `<i class=&quot;fa-solid fa-border-all&quot; style=&quot;color: #38bdf8;&quot;></i> Resumen Mesa ${mesaId}`;
                                                     if (subtitle) subtitle.innerText = `Acumulado consolidado de 4 Sillas`;
                                                     if (header) header.innerText = `Todos los consumos en Mesa ${mesaId}:`;

                                                     let totalMesa = 0;
                                                     let countItems = 0;

                                                     for (let s = 1; s <= 4; s++) {
                                                     const key = `${mesaId}-${s}`;
                                                     const cuenta = window.palapaState.cuentas[key];
                                                     if (cuenta &amp;&amp; cuenta.items &amp;&amp; cuenta.items.length > 0) {
                                                     cuenta.items.forEach(item => {
                                                     countItems++;
                                                     const sub = item.precio * item.cantidad;
                                                     totalMesa += sub;
                                                     const row = document.createElement('div');
                                                     row.style.cssText = 'display: flex !important; justify-content: space-between !important; align-items: center !important; background: #0f172a !important; padding: 10px 12px !important; border-radius: 10px !important; border: 1px solid #1e293b !important;';
                                                     row.innerHTML = `
                                                     <div>
                                                     <span style=&quot;font-size: 12px; font-weight: 700; color: #ffffff; display: block;&quot;>${item.cantidad}x ${item.nombre}</span>
                                                     <span style=&quot;font-size: 10px; color: #f59e0b; font-weight: bold;&quot;>Silla ${s}</span>
                                                     </div>
                                                     <span style=&quot;font-size: 13px; font-weight: 900; color: #34d399;&quot;>$${sub.toFixed(2)}</span>
                                                     `;
                                                     container.appendChild(row);
                                                     });
                                                     }
                                                     }

                                                     if (countItems === 0) {
                                                     container.innerHTML = `<div style=&quot;text-align: center; padding: 20px; color: #64748b; font-size: 12px;&quot;>No hay consumos en ninguna silla de la Mesa ${mesaId}.</div>`;
                                                     }

                                                     var ivaValMesa = totalMesa * 0.16;
                                                     var propinaValMesa = totalMesa * 0.10;
                                                     var totalFinalMesa = totalMesa + ivaValMesa;

                                                     if (subtotalMontoEl) subtotalMontoEl.innerText = `$${totalMesa.toFixed(2)}`;
                                                     if (ivaMontoEl) ivaMontoEl.innerText = `$${ivaValMesa.toFixed(2)}`;
                                                     if (propinaMontoEl) propinaMontoEl.innerText = `$${propinaValMesa.toFixed(2)}`;
                                                     if (totalMontoEl) totalMontoEl.innerText = `$${totalFinalMesa.toFixed(2)}`;
                                                     if (totalLabelEl) totalLabelEl.innerText = `Total Acumulado Mesa ${mesaId}:`;
                                                     }

                                                     if (modal) {
                                                     modal.classList.add('show');
                                                     modal.style.setProperty('display', 'flex', 'important');
                                                     }
                                                     }

                                                     function abrirPrecuenta() {
                                                     const mesaId = window.palapaState.mesaSeleccionadaId;
                                                     const sillaNum = window.palapaState.sillaSeleccionadaNum;
                                                     const modalP = document.getElementById('modalPrecuentaBackdrop');
                                                     const listContainer = document.getElementById('precuentaTramosList');
                                                     const subtotalEl = document.getElementById('precuentaSubtotal');
                                                     const ivaEl = document.getElementById('precuentaIva');
                                                     const propinaEl = document.getElementById('precuentaPropina');
                                                     const totalEl = document.getElementById('precuentaTotal');
                                                     const headerTag = document.getElementById('precuentaHeaderTag');
                                                     const fechaEl = document.getElementById('precuentaFecha');

                                                     if (!modalP || !listContainer) return;
                                                     listContainer.innerHTML = '';

                                                     if (fechaEl) fechaEl.innerText = 'Fecha: ' + (new Date()).toLocaleDateString() + ' ' + (new Date()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                                                     if (sillaNum !== null) {
                                                     const key = `${mesaId}-${sillaNum}`;
                                                     const cuenta = window.palapaState.cuentas[key] || { items: [] };
                                                     const qrId = cuenta.qrId || ('PV-' + mesaId + sillaNum);
                                                     if (headerTag) headerTag.innerHTML = `MESA ${mesaId} • SILLA ${sillaNum} <br><span style=&quot;font-size:10px;color:#475569;&quot;>PORTAVASOS QR: #${qrId}</span>`;

                                                     var tramosMap = {};
                                                     cuenta.items.forEach(it => {
                                                     var tMesa = it.mesaId !== undefined ? it.mesaId : mesaId;
                                                     var tSilla = it.sillaNum !== undefined ? it.sillaNum : sillaNum;
                                                     var tKey = tMesa + '-' + tSilla;
                                                     if (!tramosMap[tKey]) tramosMap[tKey] = { mesaId: tMesa, sillaNum: tSilla, items: [], subtotal: 0 };
                                                     tramosMap[tKey].items.push(it);
                                                     tramosMap[tKey].subtotal += (it.precio * it.cantidad);
                                                     });

                                                     var tramoKeys = Object.keys(tramosMap);
                                                     var totalNeto = 0;

                                                     tramoKeys.forEach((tKey, idx) => {
                                                     var tramo = tramosMap[tKey];
                                                     totalNeto += tramo.subtotal;
                                                     var block = document.createElement('div');
                                                     block.style.cssText = 'border-bottom: 1px solid #e2e8f0 !important; padding-bottom: 6px !important;';
                                                     var h = document.createElement('div');
                                                     h.style.cssText = 'font-weight: 900 !important; color: #047857 !important; margin-bottom: 4px !important;';
                                                     h.innerText = `--- TRAMO ${idx + 1}: MESA ${tramo.mesaId} SILLA ${tramo.sillaNum} ---`;
                                                     block.appendChild(h);

                                                     tramo.items.forEach(it => {
                                                     var row = document.createElement('div');
                                                     row.style.cssText = 'display: flex !important; justify-content: space-between !important; margin-bottom: 2px !important;';
                                                     row.innerHTML = `<span>${it.cantidad}x ${it.nombre}</span><span>$${(it.precio * it.cantidad).toFixed(2)}</span>`;
                                                     block.appendChild(row);
                                                     });

                                                     var subRow = document.createElement('div');
                                                     subRow.style.cssText = 'display: flex !important; justify-content: space-between !important; font-weight: bold !important; color: #475569 !important; margin-top: 4px !important; font-size: 10px !important;';
                                                     subRow.innerHTML = `<span>SUBTOTAL TRAMO ${idx + 1}:</span><span>$${tramo.subtotal.toFixed(2)}</span>`;
                                                     block.appendChild(subRow);

                                                     listContainer.appendChild(block);
                                                     });

                                                     var ivaVal = totalNeto * 0.16;
                                                     var propinaVal = totalNeto * 0.10;
                                                     var granTotal = totalNeto + ivaVal;

                                                     if (subtotalEl) subtotalEl.innerText = `$${totalNeto.toFixed(2)}`;
                                                     if (ivaEl) ivaEl.innerText = `$${ivaVal.toFixed(2)}`;
                                                     if (propinaEl) propinaEl.innerText = `$${propinaVal.toFixed(2)}`;
                                                     if (totalEl) totalEl.innerText = `$${granTotal.toFixed(2)}`;
                                                     }

                                                     modalP.classList.add('show');
                                                     modalP.style.setProperty('display', 'flex', 'important');
                                                     }

                                                     function cerrarPrecuenta() {
                                                     const modalP = document.getElementById('modalPrecuentaBackdrop');
                                                     if (modalP) {
                                                     modalP.classList.remove('show');
                                                     modalP.style.setProperty('display', 'none', 'important');
                                                     }
                                                     }

                                                     window.abrirPrecuenta = function () {
                                                     abrirPrecuenta();
                                                     };
                                                     window.cerrarPrecuenta = function () {
                                                     cerrarPrecuenta();
                                                     };

                                                     function cerrarModalComanda() {
                                                     const modal = document.getElementById('modalComandaBackdrop');
                                                     if (modal) {
                                                     modal.classList.remove('show');
                                                     modal.style.setProperty('display', 'none', 'important');
                                                     }
                                                     }

                                                     window.cerrarModalComanda = function () {
                                                     cerrarModalComanda();
                                                     };
                                                     window.abrirModalComandaActual = function () {
                                                     abrirModalComandaActual();
                                                     };

                                                     window.eliminarItemModal = function (key, idx) {
                                                     if (window.palapaState.cuentas[key] &amp;&amp; window.palapaState.cuentas[key].items) {
                                                     window.palapaState.cuentas[key].items.splice(idx, 1);
                                                     if (window.palapaState.cuentas[key].items.length === 0) {
                                                     delete window.palapaState.cuentas[key];
                                                     }
                                                     saveStateToStorage();
                                                     renderStateUI();
                                                     abrirModalComandaActual();
                                                     }
                                                     };

                                                     function renderStateUI() {
                                                     const isMoveMode = window.palapaState.modoMoverActivo;
                                                     const origen = window.palapaState.sillaOrigenMover;

                                                     for (let m = 1; m <= 3; m++) {
                                                     let busyCount = 0;
                                                     for (let s = 1; s <= 4; s++) {
                                                     const key = `${m}-${s}`;
                                                     let chairEl = document.getElementById(`chair-${m}-${s}`);
                                                     const cuenta = window.palapaState.cuentas[key];
                                                     const isOccupied = (cuenta &amp;&amp; cuenta.items &amp;&amp; cuenta.items.length > 0);

                                                     if (isOccupied) busyCount++;

                                                     if (chairEl) {
                                                     const posClass = s === 1 ? 'chair-pos-top' : s === 2 ? 'chair-pos-right' : s === 3 ? 'chair-pos-bottom' : 'chair-pos-left';

                                                     // Update draggable attribute based on current occupied state
                                                     chairEl.setAttribute('draggable', isOccupied ? 'true' : 'false');
                                                     chairEl.setAttribute('title', isOccupied
                                                     ? `Mesa ${m} Silla ${s} (Ocupada) • Arrastra para mover`
                                                     : `Mesa ${m} Silla ${s} (Disponible)`);

                                                     if (isMoveMode &amp;&amp; origen &amp;&amp; origen.mesaId === m &amp;&amp; origen.sillaNum === s) {
                                                     chairEl.className = `chair-btn-fixed ${posClass} chair-moving-source`;
                                                     } else if (isMoveMode) {
                                                     chairEl.className = `chair-btn-fixed ${posClass} chair-moving-target ${isOccupied ? 'chair-state-busy' : 'chair-state-free'}`;
                                                     } else {
                                                     chairEl.className = `chair-btn-fixed ${posClass} ${isOccupied ? 'chair-state-busy' : 'chair-state-free'}`;
                                                     }
                                                     }
                                                     }

                                                     const circle = document.getElementById(`table-circle-${m}`);
                                                     const statusText = document.getElementById(`table-status-${m}`);
                                                     const labelText = document.getElementById(`table-label-${m}`);

                                                     if (circle) {
                                                     if (busyCount > 0) {
                                                     circle.style.background = &quot;#78350f&quot;;
                                                     circle.style.border = &quot;4px solid #f59e0b&quot;;
                                                     if (statusText) statusText.innerText = `${busyCount} Ocupada${busyCount > 1 ? 's' : ''}`;
                                                     if (labelText) {
                                                     labelText.style.color = &quot;#fbbf24&quot;;
                                                     labelText.innerText = `🟡 Ocupada (${busyCount} Comensales)`;
                                                     }
                                                     } else {
                                                     circle.style.background = &quot;#064e3b&quot;;
                                                     circle.style.border = &quot;4px solid #10b981&quot;;
                                                     if (statusText) statusText.innerText = `Libre`;
                                                     if (labelText) {
                                                     labelText.style.color = &quot;#34d399&quot;;
                                                     labelText.innerText = `🟢 Disponible`;
                                                     }
                                                     }
                                                     }
                                                     }

                                                     const badge = document.getElementById('activeTargetBadge');
                                                     if (badge) {
                                                     if (window.palapaState.sillaSeleccionadaNum !== null) {
                                                     badge.innerText = `Mesa ${window.palapaState.mesaSeleccionadaId} • Silla ${window.palapaState.sillaSeleccionadaNum}`;
                                                     } else {
                                                     badge.innerText = `Mesa ${window.palapaState.mesaSeleccionadaId} (Completa)`;
                                                     }
                                                     }

                                                     renderWaiterMenuGrid();
                                                     }

                                                     function renderWaiterMenuGrid() {
                                                     const grid = document.getElementById('waiterMenuGrid');
                                                     if (!grid) return;
                                                     grid.innerHTML = '';

                                                     const catFiltro = window.palapaState.categoriaFiltro || 'Todos';
                                                     const filtrados = window.catalogProducts.filter(p => catFiltro === 'Todos' || p.categoria_nombre === catFiltro);

                                                     filtrados.forEach(prod => {
                                                     const card = document.createElement('div');
                                                     card.style.cssText = 'background: #0f172a !important; border: 1px solid #1e293b !important; border-radius: 12px !important; padding: 12px !important; display: flex !important; justify-content: space-between !important; align-items: center !important; cursor: pointer !important;';
                                                     card.onclick = () => agregarPlatilloDirecto(prod);

                                                     card.innerHTML = `
                                                     <div style=&quot;display: flex; align-items: center; gap: 8px;&quot;>
                                                     <span style=&quot;font-size: 20px;&quot;>${prod.icono}</span>
                                                     <div>
                                                     <span style=&quot;font-size: 11px; font-weight: 700; color: #ffffff; display: block; line-height: 1.2;&quot;>${prod.nombre}</span>
                                                     <span style=&quot;font-size: 11px; font-weight: 900; color: #34d399;&quot;>$${prod.precio.toFixed(2)}</span>
                                                     </div>
                                                     </div>
                                                     <button style=&quot;padding: 6px 12px; background: #059669; color: #ffffff; font-size: 11px; font-weight: 900; border-radius: 8px; border: none; cursor: pointer;&quot;>
                                                     + Agregar
                                                     </button>
                                                     `;
                                                     grid.appendChild(card);
                                                     });
                                                     }

                                                     function agregarPlatilloDirecto(prod) {
                                                     const mesaId = window.palapaState.mesaSeleccionadaId;
                                                     let sillaNum = window.palapaState.sillaSeleccionadaNum;

                                                     if (sillaNum === null) {
                                                     sillaNum = 1;
                                                     window.palapaState.sillaSeleccionadaNum = 1;
                                                     }

                                                     const key = `${mesaId}-${sillaNum}`;
                                                     if (!window.palapaState.cuentas[key]) {
                                                     window.palapaState.cuentas[key] = {
                                                     estado: 'ocupada',
                                                     qrId: 'PV-' + mesaId + sillaNum,
                                                     items: [],
                                                     historialUbicaciones: [{ mesaId: mesaId, sillaNum: sillaNum, hora: (new Date()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) }]
                                                     };
                                                     }

                                                     const nowStr = (new Date()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                                                     const items = window.palapaState.cuentas[key].items;
                                                     const existing = items.find(i => i.id === prod.id &amp;&amp; i.mesaId === mesaId &amp;&amp; i.sillaNum === sillaNum);
                                                     if (existing) {
                                                     existing.cantidad += 1;
                                                     } else {
                                                     items.push({
                                                     id: prod.id,
                                                     nombre: prod.nombre,
                                                     notas: '',
                                                     precio: prod.precio,
                                                     cantidad: 1,
                                                     mesaId: mesaId,
                                                     sillaNum: sillaNum,
                                                     hora: nowStr
                                                     });
                                                     }

                                                     saveStateToStorage();
                                                     renderStateUI();
                                                     }

                                                     function filtrarCategoria(catNombre) {
                                                     window.palapaState.categoriaFiltro = catNombre;

                                                     const chipKeys = ['Todos', 'Cafe', 'Des', 'Car', 'Pos'];
                                                     chipKeys.forEach(k => {
                                                     const el = document.getElementById(`wchip-${k}`);
                                                     if (el) {
                                                     if ((k === 'Todos' &amp;&amp; catNombre === 'Todos') ||
                                                     (k === 'Cafe' &amp;&amp; catNombre === 'Barra de Café &amp; Infusiones') ||
                                                     (k === 'Des' &amp;&amp; catNombre === 'Desayunos &amp; Brunch Gourmet') ||
                                                     (k === 'Car' &amp;&amp; catNombre === 'Especialidades Fuertes') ||
                                                     (k === 'Pos' &amp;&amp; catNombre === 'Repostería &amp; Postres de Autor')) {
                                                     el.style.background = &quot;#059669&quot;;
                                                     el.style.color = &quot;#ffffff&quot;;
                                                     el.style.border = &quot;1px solid #34d399&quot;;
                                                     } else {
                                                     el.style.background = &quot;#1e293b&quot;;
                                                     el.style.color = &quot;#cbd5e1&quot;;
                                                     el.style.border = &quot;1px solid #334155&quot;;
                                                     }
                                                     }
                                                     });

                                                     renderWaiterMenuGrid();
                                                     }

                                                     setTimeout(function () { renderStateUI(); setupDragListeners(); }, 150);
                                                     })();
                                                     </script>"></anvil-form>
