    // ════════════════════════════════════════════════════════════
    //  DRAG DE SILLAS — patrón mousedown/mousemove/mouseup
    //  Igual al resize de VidaSpa: eventos en document para que
    //  z-index y pointer-events de elementos hijos NO interfieran.
    //  document.elementFromPoint() en mouseup detecta la silla destino.
    // ════════════════════════════════════════════════════════════

    var _ms = {
    active: false,   // mousedown activo esperando movimiento
    dragging: false,   // ya pasó el umbral → modo drag visual
    srcMesa: null,
    srcSilla: null,
    startX: 0,
    startY: 0,
    ghost: null
  };
    var _wasDrag = false; // bloquea el click que dispara el browser post-mouseup
    var DRAG_THRESHOLD = 6; // píxeles mínimos para activar drag

    function _limpiarDragVisual() {
    document.querySelectorAll('.chair-btn-fixed').forEach(function (c) {
    c.classList.remove('chair-dragging', 'chair-drag-target-valid', 'chair-drag-target-combine');
  });
    if (_ms.ghost &amp;&amp; _ms.ghost.parentNode) {
    _ms.ghost.parentNode.removeChild(_ms.ghost);
  }
    _ms.ghost = null;
  }

    function getClosestChair(mesaId, clientX, clientY, srcM, srcS) {
    var minDist = Infinity;
    var closest = null;
    for (var s = 1; s <= 4; s++) {
    if (mesaId === srcM &amp;&amp; s === srcS) continue;
    var el = document.getElementById('chair-' + mesaId + '-' + s);
    if (!el) continue;
    var rect = el.getBoundingClientRect();
    var cx = rect.left + rect.width / 2;
    var cy = rect.top + rect.height / 2;
    var dist = Math.hypot(clientX - cx, clientY - cy);
    if (dist < minDist) { minDist = dist; closest = { mesa: mesaId, silla: s }; }
  }
    return closest;
  }

    function _resolveTargetChair(clientX, clientY, srcM, srcS) {
    var elem = document.elementFromPoint(clientX, clientY);

    // 1. Direct hit on chair
    if (elem) {
    var chairEl = elem.closest ? elem.closest('.chair-btn-fixed') : null;
    if (chairEl) {
    var p = chairEl.id.split('-');
    var tM = parseInt(p[1]);
    var tS = parseInt(p[2]);
    if (!(tM === srcM &amp;&amp; tS === srcS)) {
    return { mesaId: tM, sillaNum: tS, el: chairEl };
  }
  }

    // 2. Hit on table box or table circle
    var tableBox = elem.closest ? elem.closest('.table-box-220') : null;
    var tableCircle = elem.closest ? elem.closest('.table-circle-fixed') : null;
    var mesaId = null;
    if (tableBox &amp;&amp; tableBox.id) {
    mesaId = parseInt(tableBox.id.replace('table-box-', ''));
  } else if (tableCircle &amp;&amp; tableCircle.id) {
    mesaId = parseInt(tableCircle.id.replace('table-circle-', ''));
  }

    if (mesaId) {
    var closest = getClosestChair(mesaId, clientX, clientY, srcM, srcS);
    if (closest) {
    var cel = document.getElementById('chair-' + closest.mesa + '-' + closest.silla);
    return { mesaId: closest.mesa, sillaNum: closest.silla, el: cel };
  }
  }
  }

    // 3. Proximity fallback: find closest chair within 150px
    var globalMinDist = Infinity;
    var globalClosest = null;
    for (var m = 1; m <= 3; m++) {
    for (var s = 1; s <= 4; s++) {
    if (m === srcM &amp;&amp; s === srcS) continue;
    var cel = document.getElementById('chair-' + m + '-' + s);
    if (!cel) continue;
    var rect = cel.getBoundingClientRect();
    var cx = rect.left + rect.width / 2;
    var cy = rect.top + rect.height / 2;
    var dist = Math.hypot(clientX - cx, clientY - cy);
    if (dist < globalMinDist &amp;&amp; dist < 150) {
    globalMinDist = dist;
    globalClosest = { mesaId: m, sillaNum: s, el: cel };
  }
  }
  }

    return globalClosest;
  }

    function _chairMousedown(e, mesaId, sillaNum) {
    // Solo button izquierdo y solo sillas con cuenta u ocupadas
    if (e.button !== 0) return;
    var key = mesaId + '-' + sillaNum;
    var cuenta = window.palapaState.cuentas[key];
    var isOccupied = !!(cuenta &amp;&amp; (cuenta.estado === 'ocupada' || (cuenta.items &amp;&amp; cuenta.items.length > 0)));
    if (!cuenta || !isOccupied) return;

    _ms.active = true;
    _ms.dragging = false;
    _ms.srcMesa = mesaId;
    _ms.srcSilla = sillaNum;
    _ms.startX = e.clientX;
    _ms.startY = e.clientY;

    document.addEventListener('mousemove', _chairMousemove);
    document.addEventListener('mouseup', _chairMouseup);
  }

    function _chairMousemove(e) {
    if (!_ms.active) return;

    var dx = Math.abs(e.clientX - _ms.startX);
    var dy = Math.abs(e.clientY - _ms.startY);

    // ── Activar modo drag si pasó el umbral ──
    if (!_ms.dragging &amp;&amp; (dx > DRAG_THRESHOLD || dy > DRAG_THRESHOLD)) {
    _ms.dragging = true;
    cerrarModalComanda();
    window.palapaState.modoMoverActivo = true;
    window.palapaState.sillaOrigenMover = { mesaId: _ms.srcMesa, sillaNum: _ms.srcSilla };

    // Marcar silla origen
    var srcEl = document.getElementById('chair-' + _ms.srcMesa + '-' + _ms.srcSilla);
    if (srcEl) srcEl.classList.add('chair-dragging');

    // Ghost que sigue al cursor (pointer-events:none → no bloquea elementFromPoint)
    var ghost = document.createElement('div');
    ghost.style.cssText = [
    'position:fixed', 'z-index:99999', 'pointer-events:none',
    'padding:8px 18px', 'background:#0f172a', 'color:#38bdf8',
    'font-size:13px', 'font-weight:800', 'border-radius:12px',
    'border:2px solid #38bdf8', 'white-space:nowrap',
    'box-shadow:0 8px 28px rgba(0,0,0,0.85)',
    'transform:translate(-50%,-130%)',
    'left:' + e.clientX + 'px', 'top:' + e.clientY + 'px'
    ].join(';') + ';';
    var key = _ms.srcMesa + '-' + _ms.srcSilla;
    var cuenta = window.palapaState.cuentas[key] || { items: [] };
    var total = 0;
    cuenta.items.forEach(function (i) { total += i.precio * i.cantidad; });
    ghost.textContent = '\uD83E\uDE91 M' + _ms.srcMesa + ' \u00b7 S' + _ms.srcSilla + '  $' + total.toFixed(2);
    document.body.appendChild(ghost);
    _ms.ghost = ghost;

    // Banner
    var bt = document.getElementById('bannerText');
    var bc = document.getElementById('btnCancelMove');
    if (bt) bt.innerHTML = '\uD83E\uDE91 <b style=&quot;color:#38bdf8;&quot;>ARRASTRANDO</b> Mesa ' + _ms.srcMesa + ' Silla ' + _ms.srcSilla + ' \u2014 Suelta sobre la silla destino (misma o diferente mesa).';
    if (bc) bc.style.setProperty('display', 'block', 'important');
  }

    if (!_ms.dragging) return;

    // ── Mover ghost ──
    if (_ms.ghost) {
    _ms.ghost.style.left = e.clientX + 'px';
    _ms.ghost.style.top = e.clientY + 'px';
  }

    // ── Highlight silla destino detectada ──
    document.querySelectorAll('.chair-btn-fixed').forEach(function (c) {
    c.classList.remove('chair-drag-target-valid', 'chair-drag-target-combine');
  });

    var target = _resolveTargetChair(e.clientX, e.clientY, _ms.srcMesa, _ms.srcSilla);
    if (target &amp;&amp; target.el) {
    var tgt = window.palapaState.cuentas[target.mesaId + '-' + target.sillaNum];
    var busy = tgt &amp;&amp; tgt.items &amp;&amp; tgt.items.length > 0;
    target.el.classList.add(busy ? 'chair-drag-target-combine' : 'chair-drag-target-valid');
  }
  }

    function _chairMouseup(e) {
    document.removeEventListener('mousemove', _chairMousemove);
    document.removeEventListener('mouseup', _chairMouseup);

    var wasRealDrag = _ms.dragging;
    var srcM = _ms.srcMesa;
    var srcS = _ms.srcSilla;

    _limpiarDragVisual();
    _ms.active = false;
    _ms.dragging = false;
    _ms.srcMesa = null;
    _ms.srcSilla = null;

    if (!wasRealDrag) {
    return;
  }

    // ── Es un drag real: bloquear el click post-mouseup ──
    _wasDrag = true;
    setTimeout(function () { _wasDrag = false; }, 80);

    // Resolver la silla destino
    var target = _resolveTargetChair(e.clientX, e.clientY, srcM, srcS);
    if (target) {
    completarMovimiento(target.mesaId, target.sillaNum, srcM, srcS);
  } else {
    cancelarModoMover();
    showDragToast('\u26a0 Suelta sobre una silla o mesa para mover la cuenta', 'warn');
  }
  }

    function setupDragListeners() {
    // Asignar mousedown a TODAS las sillas (no solo ocupadas).
    // _chairMousedown ya verifica si tiene cuenta antes de activar.
    for (var m = 1; m <= 3; m++) {
    for (var s = 1; s <= 4; s++) {
    (function (mesaId, sillaNum) {
    var el = document.getElementById('chair-' + mesaId + '-' + sillaNum);
    if (!el) return;
    el.addEventListener('mousedown', function (e) {
    _chairMousedown(e, mesaId, sillaNum);
  });
  })(m, s);
  }
  }
  }

    // Global Event Delegation for all Clicks
    document.addEventListener('click', function (e) {
    // Ignorar click que el browser dispara tras un drag con mouse
    if (_wasDrag) return;
    // 1. Chair clicked
    const chairNode = e.target.closest('.chair-btn-fixed');
    if (chairNode) {
    const id = chairNode.id; // e.g. &quot;chair-3-1&quot;
    const parts = id.split('-');
    if (parts.length === 3) {
    const mesaId = parseInt(parts[1]);
    const sillaNum = parseInt(parts[2]);
    handleSillaClick(mesaId, sillaNum);
    return;
  }
  }

    // 2. Table circle clicked
    const tableNode = e.target.closest('.table-circle-fixed');
    if (tableNode) {
    const id = tableNode.id; // e.g. &quot;table-circle-3&quot;
    const parts = id.split('-');
    if (parts.length === 3) {
    const mesaId = parseInt(parts[2]);
    handleMesaClick(mesaId);
    return;
  }
  }

    // 3. Category chip clicked
    const chipNode = e.target.closest('[data-cat]');
    if (chipNode) {
    const cat = chipNode.getAttribute('data-cat');
    filtrarCategoria(cat);
    return;
  }

    // 4. Action buttons
    if (e.target.closest('#btnResetDemo')) { resetDemoState(); return; }
    if (e.target.closest('#btnVerComandaActiva')) { abrirModalComandaActual(); return; }
    if (e.target.closest('#btnMoverComensalMain')) { iniciarModoMover(); return; }
    if (e.target.closest('#btnMoverDesdeModal')) { cerrarModalComanda(); iniciarModoMover(); return; }
    if (e.target.closest('#btnCloseModal') || e.target.closest('#btnCerrarModalBottom')) { cerrarModalComanda(); return; }
    if (e.target.closest('#btnCancelMove')) { cancelarModoMover(); return; }
    if (e.target.closest('#btnEnviarCocina')) { alert(`Comanda enviada a Cocina (KDS)`); cerrarModalComanda(); return; }
    if (e.target.closest('#btnPrecuenta')) { alert(`Imprimiendo precuenta`); cerrarModalComanda(); return; }

    // 5. Click outside modal content (on backdrop) closes modal
    if (e.target.id === 'modalComandaBackdrop') {
    cerrarModalComanda();
    return;
  }
  });

    // Escape key closes modals and cancels move mode
    document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
    cerrarModalComanda();
    cancelarModoMover();
    var cb = document.getElementById('combineConfirmBackdrop');
    if (cb) cb.classList.remove('show');
  }
  });

    function handleSillaClick(mesaId, sillaNum) {
    if (window.palapaState.modoMoverActivo) {
    completarMovimiento(mesaId, sillaNum);
    return;
  }

    const key = `${mesaId}-${sillaNum}`;

    // Si la silla no tiene cuenta, el mesero la registra de inmediato como OCUPADA (comensal presencial ubicado)
    if (!window.palapaState.cuentas[key]) {
    const nowStr = (new Date()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    window.palapaState.cuentas[key] = {
    estado: 'ocupada',
    qrId: 'PV-0' + mesaId + sillaNum,
    comensalNombre: 'Comensal Silla ' + sillaNum,
    items: [],
    historialUbicaciones: [
    { mesaId: mesaId, sillaNum: sillaNum, hora: nowStr }
    ],
    creadoPor: 'mesero_presencial',
    horaLlegada: nowStr
  };
    saveStateToStorage();
    showDragToast('🪑 Comensal ubicado en Mesa ' + mesaId + ' Silla ' + sillaNum + ' (Silla ocupada)', 'ok');
  }

    window.palapaState.mesaSeleccionadaId = mesaId;
    window.palapaState.sillaSeleccionadaNum = sillaNum;
    renderStateUI();
    abrirModalComandaActual();
  }

    function handleMesaClick(mesaId) {
    if (window.palapaState.modoMoverActivo) {
    alert(&quot;Selecciona una silla específica a donde deseas mover la cuenta.&quot;);
    return;
  }
    window.palapaState.mesaSeleccionadaId = mesaId;
    window.palapaState.sillaSeleccionadaNum = null;
    renderStateUI();
    abrirModalComandaActual();
  }

    function iniciarModoMover() {
    const mesaId = window.palapaState.mesaSeleccionadaId;
    const sillaNum = window.palapaState.sillaSeleccionadaNum;

    if (sillaNum === null) {
    showDragToast(&quot;Por favor selecciona una silla específica para mover.&quot;, &quot;warn&quot;);
    return;

    var sillasOcupadas = [];

    var c = window.palapaState.cuentas[k];
    if (c &amp;&amp; (c.estado === 'ocupada' || (c.items &amp;&amp; c.items.length > 0))) {
    var tot = 0;
    if (c.items) c.items.forEach(function(it) { tot += it.precio * it.cantidad; });
    sillasOcupadas.push({ sillaNum: s, cuenta: c, total: tot });
  }
  }

    // Si se abrió desde una silla específica, seleccionar inicialmente esa silla; si es mesa completa, seleccionar todas
    if (sillaNum !== null) {
    _precuentaSillasSeleccionadas = [sillaNum];

    // Renderizar checklist

  } else {
    sillasOcupadas.forEach(function(obj) {

    var lbl = document.createElement('label');
    lbl.style.cssText = 'display: flex !important; align-items: center !important; gap: 6px !important; background: ' + (isChecked ? '#ecfdf5' : '#ffffff') + ' !important; padding: 6px 8px !important; border-radius: 8px !important; border: 1px solid ' + (isChecked ? '#10b981' : '#cbd5e1') + ' !important; cursor: pointer !important; user-select: none !important;';
    lbl.innerHTML = `
    <input type=&quot;checkbox&quot; value=&quot;${s}&quot; ${isChecked ? 'checked' : ''} onchange=&quot;window.togglePrecuentaSilla(${s})&quot; style=&quot;accent-color: #059669 !important; width: 14px !important; height: 14px !important;&quot;>

  }

    recalcularPrecuenta();

    function recalcularPrecuenta() {
    const mesaId = _precuentaMesaId;
    const listContainer = document.getElementById('precuentaTramosList');
    const subtotalEl = document.getElementById('precuentaSubtotal');
    const ivaEl = document.getElementById('precuentaIva');
    const propinaEl = document.getElementById('precuentaPropina');
    const totalEl = document.getElementById('precuentaTotal');
    const headerTag = document.getElementById('precuentaHeaderTag');
    const btnCobrarMonto = document.getElementById('btnCobrarMonto');

    if (!listContainer) return;
    listContainer.innerHTML = '';

    var sillasList = _precuentaSillasSeleccionadas.slice().sort();

    if (sillasList.length === 0) {
    if (headerTag) headerTag.innerHTML = `MESA ${mesaId} • NINGUNA SILLA SELECCIONADA`;
    listContainer.innerHTML = `<div style=&quot;text-align:center; padding: 15px; color:#94a3b8; font-size:11px;&quot;>Marca al menos una silla para ver su precuenta.</div>`;
    if (subtotalEl) subtotalEl.innerText = '$0.00';
    if (ivaEl) ivaEl.innerText = '$0.00';
    if (propinaEl) propinaEl.innerText = '$0.00';
    if (totalEl) totalEl.innerText = '$0.00';
    if (btnCobrarMonto) btnCobrarMonto.innerText = '$0.00';
    return;
  }

    var sillasStr = sillasList.map(function(s) { return 'Silla ' + s; }).join(', ');
    if (headerTag) {
    headerTag.innerHTML = `MESA ${mesaId} • ${sillasStr.toUpperCase()} <br><span style=&quot;font-size:10px;color:#475569;&quot;>CUENTA AGRUPADA (${sillasList.length} COMENSAL${sillasList.length > 1 ? 'ES' : ''})</span>`;
  }

    var totalNeto = 0;

    sillasList.forEach(function(sNum) {
    var k = mesaId + '-' + sNum;
    var cuenta = window.palapaState.cuentas[k];
    if (!cuenta || !cuenta.items || cuenta.items.length === 0) return;

    var chairBlock = document.createElement('div');
    chairBlock.style.cssText = 'border-bottom: 1px dashed #cbd5e1 !important; padding-bottom: 6px !important; margin-bottom: 4px !important;';

    var chairHeader = document.createElement('div');
    chairHeader.style.cssText = 'display: flex !important; justify-content: space-between !important; font-weight: 900 !important; color: #047857 !important; margin-bottom: 4px !important; font-size: 11px !important;';
    chairHeader.innerHTML = `<span>SILLA ${sNum} ${cuenta.comensalNombre ? '· ' + cuenta.comensalNombre.toUpperCase() : ''}</span><span style=&quot;font-size: 9px; color: #64748b;&quot;>QR: #${cuenta.qrId || 'PV-0'+mesaId+sNum}</span>`;
    chairBlock.appendChild(chairHeader);

    var subChair = 0;
    cuenta.items.forEach(function(it) {
    var row = document.createElement('div');
    var itTotal = it.precio * it.cantidad;
    subChair += itTotal;
    totalNeto += itTotal;
    row.style.cssText = 'display: flex !important; justify-content: space-between !important; margin-bottom: 2px !important; font-size: 11px !important;';
    row.innerHTML = `<span>${it.cantidad}x ${it.nombre}</span><span>$${itTotal.toFixed(2)}</span>`;
    chairBlock.appendChild(row);
  });

    var subChairRow = document.createElement('div');
    subChairRow.style.cssText = 'display: flex !important; justify-content: space-between !important; font-weight: bold !important; color: #475569 !important; margin-top: 3px !important; font-size: 10px !important;';
    subChairRow.innerHTML = `<span>SUBTOTAL SILLA ${sNum}:</span><span>$${subChair.toFixed(2)}</span>`;
    chairBlock.appendChild(subChairRow);

    listContainer.appendChild(chairBlock);
  });

    var ivaVal = totalNeto * 0.16;
    var propinaVal = totalNeto * 0.10;
    var granTotal = totalNeto + ivaVal;

    if (subtotalEl) subtotalEl.innerText = `$${totalNeto.toFixed(2)}`;
    if (ivaEl) ivaEl.innerText = `$${ivaVal.toFixed(2)}`;
    if (propinaEl) propinaEl.innerText = `$${propinaVal.toFixed(2)}`;
    if (totalEl) totalEl.innerText = `$${granTotal.toFixed(2)}`;
    if (btnCobrarMonto) btnCobrarMonto.innerText = `$${granTotal.toFixed(2)}`;
  }

    window.cobrarSillasPrecuenta = function() {

    var sillasStr = sillasList.map(function(s) { return 'Silla ' + s; }).join(', ');

    if (confirm(`¿Confirmar cobro de ${sillasStr} de Mesa ${mesaId} por un total de ${totalText}?\n\nLas sillas seleccionadas serán liquidadas y quedarán libres.`)) {
    sillasList.forEach(function(sNum) {

    function renderStateUI() {
    const isMoveMode = window.palapaState.modoMoverActivo;
    const origen = window.palapaState.sillaOrigenMover;

    for (let m = 1; m <= 3; m++) {
    let busyCount = 0;
    for (let s = 1; s <= 4; s++) {
    const key = `${m}-${s}`;
    let chairEl = document.getElementById(`chair-${m}-${s}`);
    const cuenta = window.palapaState.cuentas[key];
    const isOccupied = !!(cuenta &amp;&amp; (cuenta.estado === 'ocupada' || (cuenta.items &amp;&amp; cuenta.items.length > 0)));

    if (isOccupied) busyCount++;

    if (chairEl) {
    const posClass = s === 1 ? 'chair-pos-top' : s === 2 ? 'chair-pos-right' : s === 3 ? 'chair-pos-bottom' : 'chair-pos-left';

    // Update draggable attribute based on current occupied state
    chairEl.setAttribute('draggable', isOccupied ? 'true' : 'false');
    const numItems = (cuenta &amp;&amp; cuenta.items) ? cuenta.items.length : 0;
    chairEl.setAttribute('title', isOccupied
    ? `Mesa ${m} Silla ${s} (Ocupada${numItems > 0 ? ' · ' + numItems + ' consumos' : ' · Sin consumos'}) • Arrastra para mover`
    : `Mesa ${m} Silla ${s} (Disponible) • Haz clic para ubicar comensal`);

    if (isMoveMode &amp;&amp; origen &amp;&amp; origen.mesaId === m &amp;&amp; origen.sillaNum === s) {
    chairEl.className = `chair-btn-fixed ${posClass} chair-moving-source`;
  } else if (isMoveMode) {
    chairEl.className = `chair-btn-fixed ${posClass} chair-moving-target ${isOccupied ? 'chair-state-busy' : 'chair-state-free'}`;
  } else {
    chairEl.className = `chair-btn-fixed ${posClass} ${isOccupied ? 'chair-state-busy' : 'chair-state-free'}`;
  }
  }
  }

    const circle = document.getElementById(`table-circle-${m}`);
    const statusText = document.getElementById(`table-status-${m}`);
    const labelText = document.getElementById(`table-label-${m}`);

    if (circle) {
    if (busyCount > 0) {
    circle.style.background = &quot;#78350f&quot;;
    circle.style.border = &quot;4px solid #f59e0b&quot;;
    if (statusText) statusText.innerText = `${busyCount} Ocupada${busyCount > 1 ? 's' : ''}`;
    if (labelText) {
    labelText.style.color = &quot;#fbbf24&quot;;
    labelText.innerText = `🟡 Ocupada (${busyCount} Comensal${busyCount > 1 ? 'es' : ''})`;
  }
  } else {
    circle.style.background = &quot;#064e3b&quot;;
    circle.style.border = &quot;4px solid #10b981&quot;;
    if (statusText) statusText.innerText = `Libre`;

    labelText.style.color = &quot;#34d399&quot;;
    labelText.innerText = `🟢 Disponible`;
  }
  }
  }

    const badge = document.getElementById('activeTargetBadge');

    const selCuenta = window.palapaState.cuentas[selKey];

    function renderWaiterMenuGrid() {
    const grid = document.getElementById('waiterMenuGrid');

    </div>
    </div>
    <button style=&quot;padding: 6px 12px; background: #059669; color: #ffffff; font-size: 11px; font-weight: 900; border-radius: 8px; border: none; cursor: pointer;&quot;>
    + Agregar
    </button>
    `;
    grid.appendChild(card);
  });

    function agregarPlatilloDirecto(prod) {
    const mesaId = window.palapaState.mesaSeleccionadaId;
    let sillaNum = window.palapaState.sillaSeleccionadaNum;

    if (sillaNum === null) {
    sillaNum = 1;
    window.palapaState.sillaSeleccionadaNum = 1;
  }

    const key = `${mesaId}-${sillaNum}`;
    if (!window.palapaState.cuentas[key]) {
    window.palapaState.cuentas[key] = {
    estado: 'ocupada',
    qrId: 'PV-0' + mesaId + sillaNum,
    comensalNombre: 'Comensal Silla ' + sillaNum,
    items: [],
    historialUbicaciones: [{ mesaId: mesaId, sillaNum: sillaNum, hora: (new Date()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) }]
  };
  }

    const nowStr = (new Date()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    const items = window.palapaState.cuentas[key].items;
    const existing = items.find(i => i.id === prod.id &amp;&amp; i.mesaId === mesaId &amp;&amp; i.sillaNum === sillaNum);
    if (existing) {
    existing.cantidad += 1;
  } else {
    items.push({
    id: prod.id,
    nombre: prod.nombre,
    notas: '',
    precio: prod.precio,
    cantidad: 1,
    mesaId: mesaId,
    sillaNum: sillaNum,
    hora: nowStr
  });
  }

    saveStateToStorage();
    renderStateUI();
    showDragToast(`➕ ${prod.nombre} agregado a Mesa ${mesaId} Silla ${sillaNum}`, 'ok');
  }

    function filtrarCategoria(catNombre) {

    el.style.background = &quot;#059669&quot;;

  } else {
    el.style.background = &quot;#1e293b&quot;;
    el.style.color = &quot;#cbd5e1&quot;;
    el.style.border = &quot;1px solid #334155&quot;;
  }
  }
  });

    renderWaiterMenuGrid();
  }

    setTimeout(function () { renderStateUI(); setupDragListeners(); }, 150);
  })();
