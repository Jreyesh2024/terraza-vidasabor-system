  // almacena y consulta en la base de datos PostgreSQL en tiempo real.
  // ============================================================================
  window.vsMenuData = [];
  window.vsCategoriasData = [];

  window.categoriaActual = &quot;Al Centro (Para Compartir)&quot;;
  window.simMesaId = 1;
  window.simSillaNum = 1;
  window.sillasAcompanantesSeleccionadas = [];

  window.setMenuDataFromPostgreSQL = function(prodsJson, catsJson) {
    try {
      var prods = typeof prodsJson === 'string' ? JSON.parse(prodsJson) : prodsJson;
      var cats = typeof catsJson === 'string' ? JSON.parse(catsJson) : catsJson;
      if (Array.isArray(prods) &amp;&amp; prods.length > 0) {
        window.vsMenuData = prods;
      }
      if (Array.isArray(cats) &amp;&amp; cats.length > 0) {
        window.vsCategoriasData = cats;
        // Si la categoría actual no existe en el catálogo recibido, usar la primera categoría disponible
        if (!window.vsCategoriasData.some(function(c){ return c.nombre === window.categoriaActual; })) {
          if (window.vsCategoriasData.length > 0) {
            window.categoriaActual = window.vsCategoriasData[0].nombre;
          }
        }
      }
      if (typeof window.renderCategoriasGrid === 'function') window.renderCategoriasGrid();
      if (typeof window.renderCategoriasChips === 'function') window.renderCategoriasChips();
      if (typeof window.renderCategoriasTabs === 'function') window.renderCategoriasTabs();
      if (typeof window.renderMenuGrid === 'function') window.renderMenuGrid();
      if (typeof window.filtrarProductos === 'function') window.filtrarProductos();
      console.log('✅ [POSTGRESQL] Catálogo cargado dinámicamente:', (window.vsMenuData||[]).length, 'platillos,', (window.vsCategoriasData||[]).length, 'categorías');
    } catch(e) {
      console.error('Error cargando catalogo PostgreSQL:', e);
    }
  };

  function getStorageCuentas() {
    try {
      var raw = localStorage.getItem('palapa_cuentas_v1');
      if (raw) return JSON.parse(raw);
    } catch (e) { }
    return {};
  }

  function saveStorageCuentas(cuentas) {
    try {
      localStorage.setItem('palapa_cuentas_v1', JSON.stringify(cuentas));
    } catch (e) { }
  }

  window.solicitarAtencionMesero = function() {
    alert(`🔔 Mesero Notificado: Se ha enviado aviso al equipo de sala para atender la Mesa ${window.simMesaId}, Silla ${window.simSillaNum}. ¡En breve se acercará un mesero a tu lugar!`);
  };

  window.solicitarCuentaComensal = function() {
    var cuentas = getStorageCuentas();
    var key = window.simMesaId + '-' + window.simSillaNum;
    var cuenta = cuentas[key];
    var total = 0;
    if (cuenta &amp;&amp; cuenta.items) {
      cuenta.items.forEach(function(i) { total += (i.precio * i.cantidad); });
    }
    alert(`🧾 Cuenta Solicitada:\nMesa ${window.simMesaId} • Silla ${window.simSillaNum}\nTotal a Liquidar: $${total.toFixed(2)} MXN\n\nEl mesero acudirá con la cuenta y opciones de pago.`);
  };

  window.destinoPedido = 'mi_silla'; // 'mi_silla' | 'centro' | 2 | 3 | 4

  // Helper central para asegurar que NUNCA queden 2 vistas abiertas al mismo tiempo
  window.ocultarTodasLasVistas = function () {
    ['vistaHubMesa', 'vistaComandaMesa', 'vistaComandaLimpia', 'vistaCatalogoPlatillos'].forEach(function (id) {
      var el = document.getElementById(id);
      if (el) {
        el.classList.add('hidden');
        el.style.display = 'none';
      }
    });
  };

  window.abrirCatalogoConDestino = function (dest) {
    window.destinoPedido = dest;

    // 1. Ocultar absolutamente todas las demás vistas (hub, comanda personal, comanda de la mesa)
    window.ocultarTodasLasVistas();

    // 2. Mostrar exclusivamente el contenedor del catálogo
    var cat = document.getElementById('vistaCatalogoPlatillos');
    if (cat) {
      cat.classList.remove('hidden');
      cat.style.display = '';
    }

    // 3. Actualizar badge de destino en la barra superior
    var badge = document.getElementById('lblCatalogoDestinoBadge');
    if (badge) {
      if (dest === 'centro') {
        badge.innerHTML = '🍲 Al Centro (Para Compartir)';
      } else if (dest === 'mi_silla' || dest === window.simSillaNum) {
        badge.innerHTML = `🎯 Silla ${window.simSillaNum} (Tú)`;
      } else {
        badge.innerHTML = `🎯 Silla ${dest}`;
      }
    }

    // 4. Mostrar siempre el grid de categorías de 2 columnas (paso A) y ocultar productos (paso B)
    window.mostrarGridCategorias();
    window.actualizarNavComandaBtn();

    // 5. Posicionar la vista arriba de inmediato sin estorbo de scroll
    window.scrollTo({ top: 0, behavior: 'instant' });
  };

  // Muestra el grid de categorias de 2 columnas (sub-vista A)
  window.mostrarGridCategorias = function () {
    var gCat = document.getElementById('vistaCatCategorias');
    var gProd = document.getElementById('vistaCatProductos');
    if (gCat) { gCat.style.display = ''; gCat.classList.remove('hidden'); }
    if (gProd) { gProd.style.display = 'none'; gProd.classList.add('hidden'); }
    var backBtn = document.getElementById('lblCatalogoBackTxt');
    if (backBtn) backBtn.textContent = 'Volver a Mi Silla';
    window.renderCategoriasGrid();
  };

  // Volver inteligente: si estoy en productos -> vuelvo a categorias; si estoy en categorias -> vuelvo al hub
  window.catalogoVolverAtras = function () {
    var gProd = document.getElementById('vistaCatProductos');
    var estaEnProductos = gProd &amp;&amp; !gProd.classList.contains('hidden') &amp;&amp; gProd.style.display !== 'none';
    if (estaEnProductos) {
      window.mostrarGridCategorias();
    } else {
      window.mostrarVistaHubMesa();
    }
  };

  // Actualiza el boton de comanda en la nav bar con el conteo de items
  window.actualizarNavComandaBtn = function () {
    var cuentas = getStorageCuentas();
    var mesaId = window.simMesaId || 1;
    var key = mesaId + '-' + (window.simSillaNum || 1);
    var items = (cuentas[key] &amp;&amp; cuentas[key].items) ? cuentas[key].items : [];
    var el = document.getElementById('lblCatBtnTotalNav');
    if (el) {
      el.textContent = items.length > 0 ? `Mi Comanda (${items.length})` : 'Mi Comanda';
    }
  };

  // Renderiza el grid de 2 columnas con las categorias disponibles
  window.renderCategoriasGrid = function () {
    var container = document.getElementById('categoriasGridContainer');
    if (!container) return;
    container.innerHTML = '';

    var cats = window.vsCategoriasData || [];
    if (cats.length === 0) {
      // Intentar extraer categorias desde los productos
      var seen = {};
      (window.vsMenuData || []).forEach(function (p) {
        if (p.categoria_nombre &amp;&amp; !seen[p.categoria_nombre]) {
          seen[p.categoria_nombre] = { nombre: p.categoria_nombre, icono: p.icono || '🍽️', count: 0 };
        }
        if (seen[p.categoria_nombre]) seen[p.categoria_nombre].count++;
      });
      cats = Object.values(seen);
    } else {
      // Contar productos por categoria
      cats = cats.map(function (c) {
        var count = (window.vsMenuData || []).filter(function (p) { return p.categoria_nombre === c.nombre; }).length;
        return Object.assign({}, c, { count: count });
      });
    }

    if (cats.length === 0) {
      container.innerHTML = `
        <div class=&quot;col-span-2 text-center py-12 text-slate-400&quot;>
          <div class=&quot;inline-block animate-spin text-3xl mb-3&quot;>⏳</div>
          <p class=&quot;font-bold text-sm text-slate-300&quot;>Cargando menú oficial desde PostgreSQL...</p>
          <p class=&quot;text-xs text-slate-500 mt-1&quot;>Conectando en tiempo real con dbterrazavidasabor</p>
        </div>
      `;
      return;
    }

    // Asegurar que 'Al Centro (Para Compartir)' esté en primer lugar
    var centroCat = cats.find(function(c) { return c.nombre === 'Al Centro (Para Compartir)'; });
    var otrasCats = cats.filter(function(c) { return c.nombre !== 'Al Centro (Para Compartir)'; });
    if (centroCat) {
      cats = [centroCat].concat(otrasCats);
    }

    // Paleta de colores rotativos para las tarjetas estándar
    var colores = [
      { bg: 'from-emerald-900/60 to-emerald-950/80', border: 'border-emerald-500/30', icon: 'bg-emerald-500/20 text-emerald-300', text: 'text-emerald-400' },
      { bg: 'from-amber-900/60 to-amber-950/80', border: 'border-amber-500/30', icon: 'bg-amber-500/20 text-amber-300', text: 'text-amber-400' },
      { bg: 'from-sky-900/60 to-sky-950/80', border: 'border-sky-500/30', icon: 'bg-sky-500/20 text-sky-300', text: 'text-sky-400' },
      { bg: 'from-violet-900/60 to-violet-950/80', border: 'border-violet-500/30', icon: 'bg-violet-500/20 text-violet-300', text: 'text-violet-400' },
      { bg: 'from-rose-900/60 to-rose-950/80', border: 'border-rose-500/30', icon: 'bg-rose-500/20 text-rose-300', text: 'text-rose-400' },
      { bg: 'from-teal-900/60 to-teal-950/80', border: 'border-teal-500/30', icon: 'bg-teal-500/20 text-teal-300', text: 'text-teal-400' },
    ];

    var colorIdx = 0;
    cats.forEach(function (cat) {
      var tile = document.createElement('button');
      tile.type = 'button';
      var esCentro = (cat.nombre === 'Al Centro (Para Compartir)' || cat.destacado);

      if (esCentro) {
        // Cuadrado/Banner que abarca las 2 columnas completo
        tile.className = 'col-span-2 glass-card bg-gradient-to-r from-amber-950/80 via-yellow-950/60 to-amber-900/80 border-2 border-amber-500/60 hover:border-amber-400 rounded-3xl p-5 flex items-center justify-between text-left cursor-pointer hover:scale-[1.01] active:scale-[0.99] transition shadow-xl group';
        tile.innerHTML = `
          <div class=&quot;flex items-center gap-4&quot;>
            <div class=&quot;w-14 h-14 rounded-2xl bg-amber-500/20 border border-amber-500/40 flex items-center justify-center text-3xl text-amber-400 group-hover:scale-110 transition flex-shrink-0&quot;>
              🍲
            </div>
            <div>
              <div class=&quot;flex items-center gap-2&quot;>
                <span class=&quot;text-[10px] font-black text-amber-400 uppercase tracking-wider bg-amber-500/20 px-2.5 py-0.5 rounded-full border border-amber-500/30&quot;>⭐ Para Compartir en la Mesa</span>
                <span class=&quot;text-[11px] text-amber-300 font-bold&quot;>${cat.count || 0} opciones</span>
              </div>
              <h3 class=&quot;text-base font-black text-white mt-1&quot;>Platillos y Botanas Al Centro</h3>
              <p class=&quot;text-xs text-amber-200/80 mt-0.5 line-clamp-1&quot;>Guacamole con chicharrón, taquitos de camarón y carne, jarras y botanas para la mesa.</p>
            </div>
          </div>
          <i class=&quot;fa-solid fa-chevron-right text-amber-400 text-sm ml-2 group-hover:translate-x-1 transition flex-shrink-0&quot;></i>
        `;
      } else {
        var c = colores[colorIdx % colores.length];
        colorIdx++;
        tile.className = `glass-card bg-gradient-to-br ${c.bg} border ${c.border} rounded-2xl p-5 flex flex-col items-center justify-center gap-3 text-center cursor-pointer hover:scale-105 active:scale-95 transition-transform shadow-lg`;
        tile.innerHTML = `
          <div class=&quot;w-14 h-14 rounded-2xl ${c.icon} flex items-center justify-center text-3xl border ${c.border}&quot;>${cat.icono || '🍽️'}</div>
          <div>
            <div class=&quot;text-sm font-black text-white leading-tight&quot;>${cat.nombre}</div>
            <div class=&quot;text-[11px] ${c.text} font-bold mt-0.5&quot;>${cat.count || 0} opciones</div>
          </div>
        `;
      }

      tile.onclick = (function (catData) {
        return function () { window.seleccionarCategoria(catData.nombre, catData.icono); };
      })(cat);
      container.appendChild(tile);
    });
  };

  window.mostrarVistaHubMesa = function () {
    window.ocultarTodasLasVistas();
    var hub = document.getElementById('vistaHubMesa');
    if (hub) {
      hub.classList.remove('hidden');
      hub.style.display = '';
    }
    window.sincronizarCuentaDesdeStorage();
    window.scrollTo({ top: 0, behavior: 'instant' });
  };

  window.mostrarVistaComanda = function () {
    window.ocultarTodasLasVistas();
    var comanda = document.getElementById('vistaComandaLimpia');
    if (comanda) {
      comanda.classList.remove('hidden');
      comanda.style.display = '';

      comandaMesa.classList.remove('hidden');

  // Renderiza la vista limpia de comanda PERSONAL (exclusivamente items de MI silla)
  window.renderComandaLimpia = function () {
    var mesaId = window.simMesaId || 1;
    var sillaNum = window.simSillaNum || 1;
    var qrId = 'PV-0' + mesaId + sillaNum;
    var cuentas = getStorageCuentas();
    var keySilla = mesaId + '-' + sillaNum;
    var itemsSilla = (cuentas[keySilla] &amp;&amp; cuentas[keySilla].items) ? cuentas[keySilla].items : [];

    // Platillos al Centro para checar si la mesa tiene consumos
    var keyCentro = mesaId + '-centro';
    var keyCentro0 = mesaId + '-0';
    var ctaCentro = cuentas[keyCentro] || cuentas[keyCentro0] || { items: [] };
    var itemsCentro = ctaCentro.items || [];

    // Actualizar títulos
    var tit = document.getElementById('lblComandaLimpiaTitulo');
    var ubi = document.getElementById('lblComandaLimpiaUbicacion');
    var sub = document.getElementById('lblComandaLimpiaSub');
    if (tit) tit.textContent = 'Mi Comanda (Personal) — Silla ' + sillaNum;
    if (ubi) ubi.textContent = 'Mesa ' + mesaId + ' · Silla ' + sillaNum;
    if (sub) sub.textContent = 'Portavasos #' + qrId;

    // Renderizar items personales
    var container = document.getElementById('comandaLimpiaItems');
    if (!container) return;
    container.innerHTML = '';

    var pendientes = 0;
    var subtotal = 0;

    if (itemsSilla.length === 0) {
      container.innerHTML = '<div class=&quot;text-center py-10 text-slate-500 text-sm&quot;>No tienes consumos personales en tu silla aún. Toca <b class=&quot;text-emerald-400&quot;>Agregar</b> para pedir algo.</div>';
    } else {
      itemsSilla.forEach(function (it) {
        var monto = it.precio * it.cantidad;
        subtotal += monto;
        if (!it.enviadoCocina) pendientes++;

        var row = document.createElement('div');
        row.className = 'flex items-center justify-between py-2.5 border-b border-slate-800/60 last:border-0';
        var estadoBadge = it.enviadoCocina
          ? '<span class=&quot;text-[9px] font-black bg-emerald-950/60 text-emerald-300 border border-emerald-500/40 px-1.5 py-0.5 rounded flex items-center gap-1&quot;><i class=&quot;fa-solid fa-fire text-[8px]&quot;></i> En Cocina</span>'
          : '<span class=&quot;text-[9px] font-black bg-amber-950/60 text-amber-300 border border-amber-500/40 px-1.5 py-0.5 rounded flex items-center gap-1&quot;><i class=&quot;fa-solid fa-clock text-[8px]&quot;></i> Pendiente</span>';
        row.innerHTML = `
          <div class=&quot;flex-1 pr-2&quot;>
            <div class=&quot;text-sm font-bold text-white&quot;>${it.nombre} <span class=&quot;text-slate-400 font-normal text-xs&quot;>x${it.cantidad}</span></div>
            <div class=&quot;flex items-center gap-2 mt-0.5&quot;>${estadoBadge}${it.notas ? '<span class=&quot;text-[10px] text-slate-500&quot;>' + it.notas + '</span>' : ''}</div>
          </div>
          <span class=&quot;text-sm font-black text-emerald-400 ml-2&quot;>$${monto.toFixed(2)}</span>
        `;
        container.appendChild(row);
      });
    }

    // Banner si hay platillos al centro en la mesa (para que sepa que existen sin cargárselos)
    if (itemsCentro.length > 0) {
      var totCentro = 0;
      itemsCentro.forEach(function(i) { totCentro += i.precio * i.cantidad; });
      var bannerMesa = document.createElement('div');
      bannerMesa.className = 'mt-3 p-3 rounded-2xl bg-amber-950/30 border border-amber-500/30 flex items-center justify-between text-xs cursor-pointer hover:bg-amber-950/50 transition';
      bannerMesa.onclick = function() { window.mostrarVistaComandaMesa(); };
      bannerMesa.innerHTML = `
        <div class=&quot;flex items-center gap-2.5&quot;>
          <span class=&quot;text-lg&quot;>🍲</span>
          <div>
            <div class=&quot;font-bold text-amber-200&quot;>Hay ${itemsCentro.length} platillo(s) al centro en tu mesa</div>
            <div class=&quot;text-[10px] text-amber-400/80&quot;>Total al centro: $${totCentro.toFixed(2)} (no cargados a tu cuenta)</div>
          </div>
        </div>
        <span class=&quot;text-xs font-bold text-amber-300 flex items-center gap-1&quot;>Ver <i class=&quot;fa-solid fa-arrow-right text-[10px]&quot;></i></span>
      `;
      container.appendChild(bannerMesa);
    }

    // Calcular totales PERSONALES de la silla
    var iva = subtotal * 0.16;
    var propina = subtotal * 0.10;
    var total = subtotal + iva + propina;
    var el = function(id) { return document.getElementById(id); };
    if (el('lblComandaLimpiaSubtotal')) el('lblComandaLimpiaSubtotal').textContent = '$' + subtotal.toFixed(2);
    if (el('lblComandaLimpiaIVA')) el('lblComandaLimpiaIVA').textContent = '$' + iva.toFixed(2);
    if (el('lblComandaLimpiaPropina')) el('lblComandaLimpiaPropina').textContent = '$' + propina.toFixed(2);
    if (el('lblComandaLimpiaTotal')) el('lblComandaLimpiaTotal').textContent = '$' + total.toFixed(2);

    // Habilitar/deshabilitar botón enviar a cocina
    var btn = document.getElementById('btnComandaLimpiaEnviar');
    var btnTxt = document.getElementById('btnComandaLimpiaEnviarTxt');
    if (btn) {
      if (pendientes > 0) {
        btn.disabled = false;
        btn.style.opacity = '1';
        if (btnTxt) btnTxt.textContent = 'Enviar a Cocina / Barra (' + pendientes + ' pendiente' + (pendientes > 1 ? 's' : '') + ')';
      } else if (itemsSilla.length > 0) {
        btn.disabled = true;
        btn.style.opacity = '0.65';
        if (btnTxt) btnTxt.innerHTML = '<i class=&quot;fa-solid fa-check-double&quot;></i> Todo enviado a Cocina';
      } else {
        btn.disabled = true;
        btn.style.opacity = '0.4';
        if (btnTxt) btnTxt.textContent = 'Enviar a Cocina / Barra';
      }
    }
  };

  // Renderiza la vista de COMANDA DE LA MESA (platillos al centro compartidos)

    var btn = document.getElementById('btnComandaMesaEnviar');

      } else if (itemsCentro.length > 0) {
        btn.disabled = true;
        btn.style.opacity = '0.65';
        if (btnTxt) btnTxt.innerHTML = '<i class=&quot;fa-solid fa-check-double&quot;></i> Todo al Centro enviado a Cocina';
      } else {
        btn.disabled = true;
        btn.style.opacity = '0.4';
        if (btnTxt) btnTxt.textContent = 'Enviar al Centro a Cocina';
      }

  // Enviar exclusivamente los pedidos al centro a cocina

          i.enviadoCocina = true;
          i.horaEnvioCocina = nowStr;
          pendientesCount++;
        }
      });
    }

    if (cuentas[keyCentro0] &amp;&amp; cuentas[keyCentro0].items) {
      cuentas[keyCentro0].items.forEach(i => {
        if (!i.enviadoCocina) {
          i.enviadoCocina = true;

  window.toggleAcompanante = function (sillaNum) {

      window.sillasAcompanantesSeleccionadas.push(sillaNum);

    window.renderAcompanantesMesa();
    window.recalcularTotalesCompletos();

  window.seleccionarTodosAcompanantes = function () {
    var cuentas = getStorageCuentas();
    var mesaId = window.simMesaId;
    var miSilla = window.simSillaNum;
    var all = [];
    for (var s = 1; s <= 4; s++) {
      if (s !== miSilla &amp;&amp; cuentas[mesaId + '-' + s] &amp;&amp; cuentas[mesaId + '-' + s].items &amp;&amp; cuentas[mesaId + '-' + s].items.length > 0) {
        all.push(s);
      }
    }
    window.sillasAcompanantesSeleccionadas = all;
    window.renderAcompanantesMesa();
    window.recalcularTotalesCompletos();
  };

  window.recalcularTotalesCompletos = function () {
    var cuentas = getStorageCuentas();
    var mesaId = window.simMesaId || 1;
    var miSilla = window.simSillaNum || 1;

    var subtotalNeto = 0;

    // 1. Mi Silla (Personal)
    var subtotalSilla = 0;
    var keySilla = mesaId + '-' + miSilla;
    if (cuentas[keySilla] &amp;&amp; cuentas[keySilla].items) {
      cuentas[keySilla].items.forEach(function (it) { subtotalSilla += it.precio * it.cantidad; });
    }
    var totalSilla = subtotalSilla * 1.16;

    // 2. Al Centro (Compartido de la Mesa)
    var subtotalCentro = 0;
    var keyCentro = mesaId + '-centro';
    var keyCentro0 = mesaId + '-0';
    var ctaCentro = cuentas[keyCentro] || cuentas[keyCentro0];
    if (ctaCentro &amp;&amp; ctaCentro.items) {
      ctaCentro.items.forEach(function (it) { subtotalCentro += it.precio * it.cantidad; });
    }
    var totalCentro = subtotalCentro * 1.16;

    // 3. Acompañantes seleccionados (si aplica)
    var subtotalAcompanantes = 0;
    (window.sillasAcompanantesSeleccionadas || []).forEach(function (s) {
      var k = mesaId + '-' + s;
      if (cuentas[k] &amp;&amp; cuentas[k].items) {
        cuentas[k].items.forEach(function (it) { subtotalAcompanantes += it.precio * it.cantidad; });
      }
    });

    var subtotalNeto = subtotalSilla + subtotalCentro + subtotalAcompanantes;
    var iva = subtotalNeto * 0.16;
    var propina = subtotalNeto * 0.10;
    var total = subtotalNeto + iva;

    var txtSubtotal = document.getElementById('txtSubtotal');
    var txtIVA = document.getElementById('txtIVA');
    var txtPropina = document.getElementById('txtPropina');
    var txtTotal = document.getElementById('txtTotal');
    var txtBtnPagar = document.getElementById('txtBtnPagarMonto');
    var lblSubtotalDetalle = document.getElementById('lblSubtotalDetalle');

    if (lblSubtotalDetalle) {
      if (window.sillasAcompanantesSeleccionadas.length > 0) {
        lblSubtotalDetalle.innerText = `Subtotal (Silla ${miSilla} + Centro + ${window.sillasAcompanantesSeleccionadas.length} Acompañantes):`;
      } else {
        lblSubtotalDetalle.innerText = `Subtotal (Silla ${miSilla} + Centro):`;
      }
    }

    if (txtSubtotal) txtSubtotal.innerText = `$${subtotalNeto.toFixed(2)}`;
    if (txtIVA) txtIVA.innerText = `$${iva.toFixed(2)}`;
    if (txtPropina) txtPropina.innerText = `$${propina.toFixed(2)}`;
    if (txtTotal) txtTotal.innerText = `$${total.toFixed(2)}`;
    if (txtBtnPagar) txtBtnPagar.innerText = `$${total.toFixed(2)}`;

    // Badges en el Hub: Comanda Personal vs Comanda de la Mesa
    var lblHubTotal = document.getElementById('lblHubTotalComanda');
    if (lblHubTotal) lblHubTotal.innerText = `$${totalSilla.toFixed(2)}`;

    var lblHubMesaCentro = document.getElementById('lblHubTotalMesaCentro');
    if (lblHubMesaCentro) lblHubMesaCentro.innerText = totalCentro > 0 ? `$${totalCentro.toFixed(2)}` : '$0.00';

    var lblCatBtnTotal = document.getElementById('lblCatBtnTotal');
    if (lblCatBtnTotal) lblCatBtnTotal.innerText = `$${totalSilla.toFixed(2)}`;

    // Actualizar Banner Sticky Superior de Comanda
    var itemsCount = 0;
    var pendientesCount = 0;
    if (cuentas[keySilla] &amp;&amp; cuentas[keySilla].items) {
      itemsCount += cuentas[keySilla].items.length;
      cuentas[keySilla].items.forEach(function(i) { if (!i.enviadoCocina) pendientesCount++; });
    }
    if (cuentas[keyCentro] &amp;&amp; cuentas[keyCentro].items) {
      itemsCount += cuentas[keyCentro].items.length;
      cuentas[keyCentro].items.forEach(function(i) { if (!i.enviadoCocina) pendientesCount++; });
    }

    var lblStickyTit = document.getElementById('lblStickyComandaTitulo');
    var lblStickySub = document.getElementById('lblStickyComandaSubtitulo');
    var lblStickyTot = document.getElementById('lblStickyComandaTotal');

    if (lblStickyTot) lblStickyTot.innerText = `$${total.toFixed(2)}`;
    if (lblStickyTit) {
      if (itemsCount === 0) {
        lblStickyTit.innerHTML = `Mi Comanda: <span class=&quot;text-slate-400 font-semibold&quot;>Sin pedidos aún</span>`;
      } else {
        lblStickyTit.innerHTML = `Mi Comanda: <b class=&quot;text-emerald-400&quot;>${itemsCount} producto${itemsCount > 1 ? 's' : ''}</b> ${pendientesCount > 0 ? `<span class=&quot;text-amber-400 text-[10px] font-bold&quot;>(${pendientesCount} pendiente${pendientesCount > 1 ? 's' : ''})</span>` : `<span class=&quot;text-sky-400 text-[10px] font-bold&quot;>✓ En Cocina</span>`}`;
      }
    }
    if (lblStickySub) {
      if (itemsCount === 0) {
        lblStickySub.innerText = `Mesa ${mesaId} • Silla ${miSilla} • Selecciona platillos para agregar a tu cuenta`;
      } else {
        lblStickySub.innerText = `Mesa ${mesaId} • Silla ${miSilla} • Total acumulado con IVA: $${total.toFixed(2)}`;
      }
    }
  };

  window.modoPagoCliente = 'solo_yo'; // 'solo_yo' | 'incluir_ninos' | 'toda_mesa'

  window.abrirModalCobroCliente = function (metodo) {
    const modal = document.getElementById('modalCobroCliente');
    if (modal) {
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }
    window.setModoPagoCliente(window.modoPagoCliente || 'solo_yo');
  };

  window.cerrarModalCobroCliente = function () {
    const modal = document.getElementById('modalCobroCliente');
    if (modal) {
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }
  };

  window.sillasSplitCentro = null;
  window.numComensalesSplitMesa = null;

  window.toggleSillaSplitCentro = function (silla) {
    if (!window.sillasSplitCentro) {
      window.sillasSplitCentro = [1, 2, 3, 4];
    }
    var sNum = parseInt(silla);
    var idx = window.sillasSplitCentro.indexOf(sNum);
    if (idx > -1) {
      if (window.sillasSplitCentro.length > 1) {
        window.sillasSplitCentro.splice(idx, 1);
      }
    } else {
      window.sillasSplitCentro.push(sNum);
      window.sillasSplitCentro.sort();
    }
    window.renderDetalleModalCobro();
  };

  window.seleccionarTodasSillasSplitCentro = function () {
    window.sillasSplitCentro = [1, 2, 3, 4];
    window.renderDetalleModalCobro();
  };

  window.cambiarNumSplitMesa = function (delta) {
    window.numComensalesSplitMesa = Math.max(1, Math.min(10, (window.numComensalesSplitMesa || 2) + delta));
    window.renderDetalleModalCobro();
  };

  window.setModoPagoCliente = function (modo) {
    window.modoPagoCliente = modo || 'solo_yo';
    const btnSoloYo = document.getElementById('btnModoSoloYo');
    const btnSplitCentro = document.getElementById('btnModoSplitCentro');
    const btnAbsorberCentro = document.getElementById('btnModoAbsorberCentro');
    const btnSplitToda = document.getElementById('btnModoSplitTodaMesa');
    const btnToda = document.getElementById('btnModoTodaMesa');

    const activeCls = 'bg-emerald-600/30 text-emerald-300 border-emerald-500/50 shadow-sm';
    const inactiveCls = 'bg-slate-800 text-slate-300 border-slate-700';

    [btnSoloYo, btnSplitCentro, btnAbsorberCentro, btnSplitToda, btnToda].forEach(b => {
      if (b) {
        var base = b === btnToda ? 'col-span-2 ' : '';
        b.className = base + 'p-2 rounded-lg font-bold border text-center transition cursor-pointer ' + inactiveCls;
      }
    });

    if (modo === 'solo_yo' &amp;&amp; btnSoloYo) btnSoloYo.className = 'p-2 rounded-lg font-bold border text-center transition cursor-pointer ' + activeCls;
    if (modo === 'split_centro' &amp;&amp; btnSplitCentro) btnSplitCentro.className = 'p-2 rounded-lg font-bold border text-center transition cursor-pointer ' + activeCls;
    if (modo === 'absorber_centro' &amp;&amp; btnAbsorberCentro) btnAbsorberCentro.className = 'p-2 rounded-lg font-bold border text-center transition cursor-pointer ' + activeCls;
    if (modo === 'split_toda_mesa' &amp;&amp; btnSplitToda) btnSplitToda.className = 'p-2 rounded-lg font-bold border text-center transition cursor-pointer ' + activeCls;
    if (modo === 'toda_mesa' &amp;&amp; btnToda) btnToda.className = 'col-span-2 p-2 rounded-lg font-bold border text-center transition cursor-pointer ' + activeCls;

    window.renderDetalleModalCobro();
  };

  window.renderDetalleModalCobro = function () {
    const container = document.getElementById('modalCobroDetalleTramos') || document.getElementById('modalItemsDesglose');
    const subtotalEl = document.getElementById('modalSubtotal');
    const ivaEl = document.getElementById('modalIVA');
    const propinaEl = document.getElementById('modalPropina');
    const totalEl = document.getElementById('modalTotal');

    if (!container) return;
    container.innerHTML = '';

    var cuentas = getStorageCuentas();
    var mesaId = window.simMesaId || 1;
    var miSilla = window.simSillaNum || 1;
    var modo = window.modoPagoCliente || 'solo_yo';

    // 1. Detectar comensales y sillas activas en la mesa
    var sillasActivas = [];
    for (var s = 1; s <= 4; s++) {
      var c = cuentas[mesaId + '-' + s];
      if (c &amp;&amp; (c.estado === 'ocupada' || (c.items &amp;&amp; c.items.length > 0))) {
        sillasActivas.push(s);
      }
    }
    if (sillasActivas.indexOf(miSilla) === -1) sillasActivas.push(miSilla);
    sillasActivas.sort();
    var numComensales = Math.max(1, sillasActivas.length);

    // 2. Consumos individuales de Mi Silla
    var keySilla = mesaId + '-' + miSilla;
    var ctaSilla = cuentas[keySilla] || { items: [] };
    var itemsSilla = ctaSilla.items || [];
    var subtotalSilla = 0;
    itemsSilla.forEach(function (it) { subtotalSilla += (it.precio || 0) * (it.cantidad || 1); });

    // 3. Consumos Al Centro de la Mesa
    var keyCentro = mesaId + '-centro';
    var keyCentro0 = mesaId + '-0';
    var ctaCentro = cuentas[keyCentro] || cuentas[keyCentro0] || { items: [] };
    var itemsCentro = ctaCentro.items || [];
    var subtotalCentro = 0;
    itemsCentro.forEach(function (it) { subtotalCentro += (it.precio || 0) * (it.cantidad || 1); });

    var totalNeto = 0;

    // RENDER: CASO 1 - SOLO MI SILLA
    if (modo === 'solo_yo') {
      totalNeto = subtotalSilla;

      var block = document.createElement('div');
      block.className = 'p-3 rounded-xl bg-slate-950/70 border border-emerald-500/30 mb-2';
      block.innerHTML = `
        <div class=&quot;flex justify-between items-center font-bold text-emerald-400 mb-1.5 pb-1 border-b border-slate-800&quot;>
          <span><i class=&quot;fa-solid fa-chair text-xs&quot;></i> Tu Silla ${miSilla} (Consumos Personales)</span>
          <span class=&quot;text-[10px] text-slate-500&quot;>QR: #PV-0${mesaId}${miSilla}</span>
        </div>
      `;
      if (itemsSilla.length === 0) {
        block.innerHTML += `<div class=&quot;text-slate-500 text-xs py-2 text-center&quot;>No tienes consumos individuales registrados.</div>`;
      } else {
        itemsSilla.forEach(function (it) {
          var m = it.precio * it.cantidad;
          block.innerHTML += `<div class=&quot;flex justify-between text-slate-300 py-0.5 text-xs&quot;><span>${it.cantidad}x ${it.nombre}</span><span class=&quot;font-bold text-emerald-400&quot;>$${m.toFixed(2)}</span></div>`;
        });
      }
      block.innerHTML += `
        <div class=&quot;flex justify-between text-slate-300 font-black pt-1.5 mt-1.5 border-t border-slate-800 text-xs&quot;>
          <span>Subtotal Mi Silla:</span><span class=&quot;text-emerald-400&quot;>$${subtotalSilla.toFixed(2)}</span>
        </div>
      `;
      container.appendChild(block);

      if (itemsCentro.length > 0) {
        var notaCentro = document.createElement('div');
        notaCentro.className = 'p-2.5 rounded-xl bg-amber-950/25 border border-amber-500/25 text-[11px] text-amber-300/80 flex items-center justify-between';
        notaCentro.innerHTML = `
          <span><i class=&quot;fa-solid fa-info-circle text-amber-400 mr-1&quot;></i> Platillos al centro ($${subtotalCentro.toFixed(2)}) <b>NO incluidos</b> en este cobro (permanecen en la mesa).</span>
        `;
        container.appendChild(notaCentro);
      }
    }

    // RENDER: CASO 2 - MI SILLA + DIVIDIR CENTRO ENTRE SILLAS ESPECÍFICAS
    else if (modo === 'split_centro') {
      if (!window.sillasSplitCentro) {
        window.sillasSplitCentro = sillasActivas.length > 1 ? [...sillasActivas] : [1, 2];
      }

      var numParticipantes = Math.max(1, window.sillasSplitCentro.length);
      var cuotaPorSilla = subtotalCentro / numParticipantes;
      var participaMiSilla = window.sillasSplitCentro.indexOf(miSilla) !== -1;
      var aportacionCentro = participaMiSilla ? cuotaPorSilla : 0;

      totalNeto = subtotalSilla + aportacionCentro;

      // Bloque 1: Alimentos de Mi Silla
      var block1 = document.createElement('div');
      block1.className = 'p-3 rounded-xl bg-slate-950/70 border border-emerald-500/30 mb-2';
      block1.innerHTML = `
        <div class=&quot;flex justify-between items-center font-bold text-emerald-400 mb-1.5 pb-1 border-b border-slate-800&quot;>
          <span><i class=&quot;fa-solid fa-chair text-xs&quot;></i> 1. Alimentos de Tu Silla (${miSilla})</span>
          <span class=&quot;text-xs font-black text-emerald-400&quot;>$${subtotalSilla.toFixed(2)}</span>
        </div>
      `;
      if (itemsSilla.length === 0) {
        block1.innerHTML += `<div class=&quot;text-slate-500 text-xs py-1 text-center&quot;>Sin consumos individuales registrados.</div>`;
      } else {
        itemsSilla.forEach(function (it) {
          var m = it.precio * it.cantidad;
          block1.innerHTML += `<div class=&quot;flex justify-between text-slate-300 py-0.5 text-xs&quot;><span>${it.cantidad}x ${it.nombre}</span><span>$${m.toFixed(2)}</span></div>`;
        });
      }
      container.appendChild(block1);

      // Bloque 2: Reparto de Platillos al Centro con selección de sillas
      var block2 = document.createElement('div');
      block2.className = 'p-3 rounded-xl bg-amber-950/30 border border-amber-500/40 mb-2';

      var chipsHtml = [1, 2, 3, 4].map(function(s) {
        var activo = window.sillasSplitCentro.indexOf(s) !== -1;
        var esMiSilla = (s === miSilla);
        var cls = activo
          ? 'bg-amber-500/20 text-amber-300 border-amber-500 font-bold shadow-sm'
          : 'bg-slate-900/60 text-slate-500 border-slate-700 hover:text-slate-300';
        return `<button type=&quot;button&quot; onclick=&quot;window.toggleSillaSplitCentro(${s})&quot; class=&quot;px-2.5 py-1 rounded-lg border text-[11px] transition cursor-pointer ${cls}&quot;>
          ${activo ? '✓ ' : ''}Silla ${s} ${esMiSilla ? '(Tú)' : ''}
        </button>`;
      }).join(' ');

      block2.innerHTML = `
        <div class=&quot;flex justify-between items-center font-bold text-amber-300 mb-1.5 pb-1 border-b border-amber-500/20&quot;>
          <span><i class=&quot;fa-solid fa-scale-balanced text-xs&quot;></i> 2. Reparto de Platillos al Centro</span>
          <span class=&quot;text-xs font-black text-amber-400&quot;>+$${aportacionCentro.toFixed(2)}</span>
        </div>
        <div class=&quot;flex items-center justify-between text-[11px] text-slate-300 mb-1.5&quot;>
          <span>¿Quiénes pagan el centro ($${subtotalCentro.toFixed(2)})?</span>
          <button type=&quot;button&quot; onclick=&quot;window.seleccionarTodasSillasSplitCentro()&quot; class=&quot;text-[10px] text-amber-400 underline hover:text-amber-300 cursor-pointer&quot;>Todas</button>
        </div>
        <div class=&quot;flex flex-wrap gap-1.5 mb-2&quot;>
          ${chipsHtml}
        </div>
        <div class=&quot;p-2 rounded-lg bg-amber-950/40 border border-amber-500/20 text-[11px] text-amber-200/90 leading-relaxed&quot;>
          <i class=&quot;fa-solid fa-calculator text-amber-400 mr-1&quot;></i>
          Total centro <b>$${subtotalCentro.toFixed(2)}</b> ÷ <b>${numParticipantes} silla(s)</b> = <b>$${cuotaPorSilla.toFixed(2)}</b> c/u.
          ${participaMiSilla ? `<span class=&quot;block mt-0.5 text-emerald-400 font-bold&quot;>✓ Tu Silla ${miSilla} aporta $${cuotaPorSilla.toFixed(2)}</span>` : `<span class=&quot;block mt-0.5 text-slate-400 italic&quot;>✗ Tu Silla ${miSilla} no participa (lo pagan las otras sillas).</span>`}
        </div>
      `;
      container.appendChild(block2);
    }

    // RENDER: CASO 3 - MI SILLA + TODO EL CENTRO (ABSORBER)
    else if (modo === 'absorber_centro') {
      totalNeto = subtotalSilla + subtotalCentro;

      // Bloque 1: Mi Silla
      var bSilla = document.createElement('div');
      bSilla.className = 'p-3 rounded-xl bg-slate-950/70 border border-emerald-500/30 mb-2';
      bSilla.innerHTML = `
        <div class=&quot;flex justify-between items-center font-bold text-emerald-400 mb-1 pb-1 border-b border-slate-800&quot;>
          <span><i class=&quot;fa-solid fa-chair text-xs&quot;></i> Tu Silla ${miSilla}</span>
          <span class=&quot;text-xs font-black text-emerald-400&quot;>$${subtotalSilla.toFixed(2)}</span>
        </div>
      `;
      itemsSilla.forEach(function (it) {
        var m = it.precio * it.cantidad;
        bSilla.innerHTML += `<div class=&quot;flex justify-between text-slate-300 py-0.5 text-xs&quot;><span>${it.cantidad}x ${it.nombre}</span><span>$${m.toFixed(2)}</span></div>`;
      });
      container.appendChild(bSilla);

      // Bloque 2: Todo el Centro
      var bCentro = document.createElement('div');
      bCentro.className = 'p-3 rounded-xl bg-amber-950/30 border border-amber-500/40 mb-2';
      bCentro.innerHTML = `
        <div class=&quot;flex justify-between items-center font-bold text-amber-300 mb-1 pb-1 border-b border-amber-500/20&quot;>
          <span><i class=&quot;fa-solid fa-bowl-food text-xs&quot;></i> 100% Platillos al Centro (Absorbidos por ti)</span>
          <span class=&quot;text-xs font-black text-amber-400&quot;>$${subtotalCentro.toFixed(2)}</span>
        </div>
      `;
      itemsCentro.forEach(function (it) {
        var m = it.precio * it.cantidad;
        bCentro.innerHTML += `<div class=&quot;flex justify-between text-slate-300 py-0.5 text-xs&quot;><span>${it.cantidad}x ${it.nombre}</span><span>$${m.toFixed(2)}</span></div>`;
      });
      container.appendChild(bCentro);
    }

    // RENDER: CASO 4 - DIVIDIR TODA LA MESA EN PARTES IGUALES (SPLIT GENERAL)
    else if (modo === 'split_toda_mesa') {
      var grandSubMesa = 0;
      for (var s = 1; s <= 4; s++) {
        var cAcc = cuentas[mesaId + '-' + s];
        if (cAcc &amp;&amp; cAcc.items) {
          cAcc.items.forEach(function (i) { grandSubMesa += i.precio * i.cantidad; });
        }
      }
      grandSubMesa += subtotalCentro;

      if (!window.numComensalesSplitMesa) {
        window.numComensalesSplitMesa = Math.max(2, numComensales);
      }
      var nPer = window.numComensalesSplitMesa;
      var cuotaEquitativa = grandSubMesa / nPer;
      totalNeto = cuotaEquitativa;

      var bSplit = document.createElement('div');
      bSplit.className = 'p-3 rounded-xl bg-slate-950/70 border border-emerald-500/30 mb-2';
      bSplit.innerHTML = `
        <div class=&quot;flex justify-between items-center font-bold text-emerald-400 mb-2 pb-1 border-b border-slate-800&quot;>
          <span><i class=&quot;fa-solid fa-users text-xs&quot;></i> Cuenta Total de la Mesa Dividida</span>
          <span class=&quot;text-xs font-black text-emerald-400&quot;>$${grandSubMesa.toFixed(2)}</span>

        <div class=&quot;flex items-center justify-between bg-slate-900/80 p-2.5 rounded-xl border border-slate-800 mb-2&quot;>
          <span class=&quot;text-xs text-slate-300 font-bold&quot;>Dividir equitativamente entre:</span>
          <div class=&quot;flex items-center gap-2&quot;>
            <button type=&quot;button&quot; onclick=&quot;window.cambiarNumSplitMesa(-1)&quot; class=&quot;w-7 h-7 rounded-lg bg-slate-800 hover:bg-slate-700 text-white font-black flex items-center justify-center border border-slate-700 cursor-pointer&quot;>-</button>
            <span class=&quot;text-xs font-black text-emerald-400 px-1&quot;>${nPer} personas</span>
            <button type=&quot;button&quot; onclick=&quot;window.cambiarNumSplitMesa(1)&quot; class=&quot;w-7 h-7 rounded-lg bg-slate-800 hover:bg-slate-700 text-white font-black flex items-center justify-center border border-slate-700 cursor-pointer&quot;>+</button>
          </div>
        </div>
        <div class=&quot;p-2 rounded-lg bg-emerald-950/30 border border-emerald-500/30 text-xs text-emerald-300 flex justify-between items-center&quot;>
          <span>Tu cuota equitativa a liquidar:</span>
          <span class=&quot;text-base font-black text-emerald-400&quot;>$${cuotaEquitativa.toFixed(2)}</span>
        </div>
      `;
      container.appendChild(bSplit);
    }

    // RENDER: CASO 5 - TODA LA MESA COMPLETA (100%)
    else if (modo === 'toda_mesa') {
      var grandSub = 0;
      for (var s = 1; s <= 4; s++) {
        var cKey = mesaId + '-' + s;
        var cAcc = cuentas[cKey];
        if (cAcc &amp;&amp; cAcc.items &amp;&amp; cAcc.items.length > 0) {
          var sSub = 0;
          cAcc.items.forEach(function (i) { sSub += i.precio * i.cantidad; });
          grandSub += sSub;

          var bRow = document.createElement('div');
          bRow.className = 'p-2.5 rounded-xl bg-slate-950/60 border border-slate-800 mb-1.5 text-xs';
          bRow.innerHTML = `
            <div class=&quot;flex justify-between font-bold text-emerald-400 mb-1&quot;>
              <span>Silla ${s} ${s === miSilla ? '(Tú)' : ''}</span><span>$${sSub.toFixed(2)}</span>
            </div>
          `;
          cAcc.items.forEach(function (it) {
            bRow.innerHTML += `<div class=&quot;flex justify-between text-slate-400 text-[11px]&quot;><span>${it.cantidad}x ${it.nombre}</span><span>$${(it.precio * it.cantidad).toFixed(2)}</span></div>`;
          });
          container.appendChild(bRow);
        }
      }

      if (itemsCentro.length > 0) {
        grandSub += subtotalCentro;
        var bCentRow = document.createElement('div');
        bCentRow.className = 'p-2.5 rounded-xl bg-amber-950/30 border border-amber-500/30 mb-1.5 text-xs';
        bCentRow.innerHTML = `
          <div class=&quot;flex justify-between font-bold text-amber-300 mb-1&quot;>
            <span>Al Centro (Mesa ${mesaId})</span><span>$${subtotalCentro.toFixed(2)}</span>
          </div>
        `;
        itemsCentro.forEach(function (it) {
          bCentRow.innerHTML += `<div class=&quot;flex justify-between text-slate-400 text-[11px]&quot;><span>${it.cantidad}x ${it.nombre}</span><span>$${(it.precio * it.cantidad).toFixed(2)}</span></div>`;
        });
        container.appendChild(bCentRow);
      }

      totalNeto = grandSub;
    }

    var iva = totalNeto * 0.16;
    var propina = totalNeto * 0.10;
    var granTotal = totalNeto + iva;

    if (subtotalEl) subtotalEl.innerText = `$${totalNeto.toFixed(2)}`;
    if (ivaEl) ivaEl.innerText = `$${iva.toFixed(2)}`;
    if (propinaEl) propinaEl.innerText = `$${propina.toFixed(2)}`;
    if (totalEl) totalEl.innerText = `$${granTotal.toFixed(2)}`;
  };

  window.ejecutarPagoFinal = function (metodo) {
    var cuentas = getStorageCuentas();
    var mesaId = window.simMesaId || 1;
    var miSilla = window.simSillaNum || 1;
    var modo = window.modoPagoCliente || 'solo_yo';

    var totalText = document.getElementById('modalTotal') ? document.getElementById('modalTotal').innerText : '$0.00';

    if (confirm(`¿Confirmar liquidación (${modo.toUpperCase()}) vía ${metodo.toUpperCase()} por ${totalText}?`)) {
      if (modo === 'solo_yo' || modo === 'split_centro' || modo === 'split_toda_mesa') {
        // Liquidar la cuenta de mi silla
        delete cuentas[mesaId + '-' + miSilla];
        try {
          if (window.anvilSyncCuenta) window.anvilSyncCuenta(mesaId, miSilla, [], 'libre');
        } catch(e) {}
      } else if (modo === 'absorber_centro') {
        // Liquidar mi silla y todo el centro
        delete cuentas[mesaId + '-' + miSilla];
        delete cuentas[mesaId + '-centro'];
        delete cuentas[mesaId + '-0'];
        try {
          if (window.anvilSyncCuenta) {
            window.anvilSyncCuenta(mesaId, miSilla, [], 'libre');
            window.anvilSyncCuenta(mesaId, 0, [], 'libre');
          }
        } catch(e) {}
      } else if (modo === 'toda_mesa') {
        // Liquidar todas las sillas y el centro
        for (var s = 1; s <= 4; s++) {
          delete cuentas[mesaId + '-' + s];
          try {
            if (window.anvilSyncCuenta) window.anvilSyncCuenta(mesaId, s, [], 'libre');
          } catch(e) {}
        }
        delete cuentas[mesaId + '-centro'];
        delete cuentas[mesaId + '-0'];
        try {
          if (window.anvilSyncCuenta) window.anvilSyncCuenta(mesaId, 0, [], 'libre');
        } catch(e) {}
      }

      saveStorageCuentas(cuentas);
      window.cerrarModalCobroCliente();
      window.sincronizarCuentaDesdeStorage();
      alert(`🎉 ¡Pago de ${totalText} procesado con éxito vía ${metodo.toUpperCase()}! Gracias por tu visita a La Terraza V&amp;S.`);
    }

    }

    // Normalizar extras para asegurar que el precio sea numérico
    extrasList = (extrasList || []).map(function(ex) {

  window.confirmarAgregarPlatilloPersonalizado = function() {
    const state = window.modalPersonalizacionState;
    if (!state.prod) return;

    const prod = state.prod;
    const cuentas = getStorageCuentas();
    const mesaId = window.simMesaId || 1;
    const dest = window.destinoPedido || 'mi_silla';
    let key = '';
    let comensalNom = '';
    let qrId = '';
    let esCentro = false;
    let sillaNum = window.simSillaNum;

    if (dest === 'centro') {
      key = mesaId + '-centro';
      comensalNom = `Mesa ${mesaId} (Al Centro / Compartido)`;
      qrId = `MESA-0${mesaId}`;
      esCentro = true;
      sillaNum = 0;
    } else if (dest === 'mi_silla' || dest === window.simSillaNum) {
      key = mesaId + '-' + window.simSillaNum;
      comensalNom = `Comensal Silla ${window.simSillaNum}`;
      qrId = `PV-0${mesaId}${window.simSillaNum}`;
      sillaNum = window.simSillaNum;
    } else {
      sillaNum = parseInt(dest);
      key = mesaId + '-' + sillaNum;
      comensalNom = `Comensal Silla ${sillaNum}`;
      qrId = `PV-0${mesaId}${sillaNum}`;
    }

    if (!cuentas[key]) {
      cuentas[key] = {
        id: Date.now(),
        mesaId: mesaId,
        sillaNum: sillaNum,
        esCentro: esCentro,
        qrId: qrId,
        comensalNombre: comensalNom,
        items: [],
        estado: 'ocupada',
        creadoPor: 'cliente_qr',
        horaApertura: (new Date()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      };
    }

    // Armar detalle de personalización en notas
    const partesNotas = [];
    if (state.termino) partesNotas.push(state.termino);
    if (state.preferencias &amp;&amp; state.preferencias.length > 0) partesNotas.push(state.preferencias.join(', '));
    if (state.extras &amp;&amp; state.extras.length > 0) partesNotas.push(state.extras.map(e => e.nombre).join(', '));
    const notasLibres = (document.getElementById('txtModalNotasEspeciales').value || '').trim();
    if (notasLibres) partesNotas.push(`Nota: ${notasLibres}`);

    const notasFinales = partesNotas.join(' • ');
    const precioFinalUnit = Number(prod.precio_unitario) + state.extraPrecioTotal;

    const items = cuentas[key].items || [];
    items.push({
      id: Date.now(),
      productoId: prod.id,
      nombre: prod.nombre,
      notas: notasFinales,
      precio: precioFinalUnit,
      cantidad: state.cantidad,
      mesaId: mesaId,
      sillaNum: sillaNum,
      esCentro: esCentro,
      enviadoCocina: false,
      hora: (new Date()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
    });

    cuentas[key].items = items;
    cuentas[key].estado = 'ocupada';

    saveStorageCuentas(cuentas);
    window.sincronizarCuentaDesdeStorage();
    window.cerrarModalRecetaCliente();

    // Sincronizar inmediatamente con el servidor de Anvil
    try {
      if (window.anvilSyncCuenta) {
        window.anvilSyncCuenta(mesaId, sillaNum, JSON.stringify(cuentas[key].items), 'ocupada');
      }
    } catch(e) {
      console.error('Error sincronizando con Anvil:', e);

  };

  window.detectarParametrosQrUrl = function() {
    try {
      var params = new URLSearchParams(window.location.search);
      var hash = window.location.hash || '';

      if (hash.includes('?')) {
        var hashQuery = hash.substring(hash.indexOf('?') + 1);
        var hashParams = new URLSearchParams(hashQuery);
        hashParams.forEach(function(val, key) {
          params.set(key, val);
        });
      } else if (hash.startsWith('#PV-') || hash.startsWith('#MESA-')) {
        params.set('qr', hash.replace('#', ''));
      }

      var mesaParam = params.get('mesa');
      var sillaParam = params.get('silla');
      var qrParam = params.get('qr');

      if (qrParam &amp;&amp; (!mesaParam || !sillaParam)) {
