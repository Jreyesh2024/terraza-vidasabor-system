        if (raw) return JSON.parse(raw);
      } catch(e) {}
      return {};
    }

    function saveStorageCuentas(cuentas) {
      try {
        localStorage.setItem('palapa_cuentas_v1', JSON.stringify(cuentas));
      } catch(e) {}
    }

    window.cambiarSimulacionQr = function(keyStr) {
      var parts = keyStr.split('-');
      window.simMesaId = parseInt(parts[0]);
      window.simSillaNum = parseInt(parts[1]);

      // Si es Mesa 2 Silla 1 (Papá), sugerir niños seleccionados (3 y 4)
      if (window.simMesaId === 2 &amp;&amp; window.simSillaNum === 1) {
        window.sillasAcompanantesSeleccionadas = [3, 4];
      } else {
        window.sillasAcompanantesSeleccionadas = [];
      }

      window.sincronizarCuentaDesdeStorage();
    };

    window.sincronizarCuentaDesdeStorage = function() {
      var cuentas = getStorageCuentas();
      var key = window.simMesaId + '-' + window.simSillaNum;
      var cuentaActual = cuentas[key];

      var qrId = (cuentaActual &amp;&amp; cuentaActual.qrId) ? cuentaActual.qrId : ('PV-0' + window.simMesaId + window.simSillaNum);
      var comensalNom = (cuentaActual &amp;&amp; cuentaActual.comensalNombre) ? cuentaActual.comensalNombre : ('Comensal Silla ' + window.simSillaNum);

      var lblQr = document.getElementById('lblQrActivo');
      var lblUbicacion = document.getElementById('lblUbicacionActiva');
      var txtTitulo = document.getElementById('txtTituloComanda');
      var txtSub = document.getElementById('txtSubComanda');

      if (lblQr) lblQr.innerText = qrId;
      if (lblUbicacion) lblUbicacion.innerText = `Mesa ${window.simMesaId} • Silla ${window.simSillaNum} (${comensalNom})`;
      if (txtTitulo) txtTitulo.innerText = `Mi Comanda (Silla ${window.simSillaNum})`;
      if (txtSub) txtSub.innerText = `Mesa ${window.simMesaId} • Portavasos #${qrId}`;

      window.renderCarrito();
      window.renderAcompanantesMesa();
    };

    window.renderCarrito = function () {
      const container = document.getElementById('cartItemsList');
      if (!container) return;
      container.innerHTML = '';

      var cuentas = getStorageCuentas();
      var key = window.simMesaId + '-' + window.simSillaNum;
      var cuentaActual = cuentas[key] || { items: [] };
      var items = cuentaActual.items || [];

      if (items.length === 0) {
        container.innerHTML = `<div class=&quot;text-center py-6 text-slate-500 text-xs&quot;>No hay consumos registrados en tu silla.</div>`;
      } else {
        items.forEach((item, idx) => {
          const itemSubtotal = item.precio * item.cantidad;
          const row = document.createElement('div');
          row.className = 'flex justify-between items-center bg-slate-900/80 p-2.5 rounded-xl border border-slate-800 text-xs';
          row.innerHTML = `
            <div>
              <span class=&quot;font-bold text-white&quot;>${item.nombre} x${item.cantidad}</span>
              <span class=&quot;block text-[10px] text-slate-400&quot;>${item.notas ? item.notas + ' • ' : ''}$${Number(item.precio).toFixed(2)} c/u</span>
            </div>
            <span class=&quot;font-black text-emerald-400&quot;>$${itemSubtotal.toFixed(2)}</span>
          `;
          container.appendChild(row);
        });
      }

      window.recalcularTotalesCompletos();
    };

    window.renderAcompanantesMesa = function() {
      const container = document.getElementById('listaAcompanantesMesa');
      if (!container) return;
      container.innerHTML = '';

      var cuentas = getStorageCuentas();
      var mesaId = window.simMesaId;
      var miSilla = window.simSillaNum;

      var otrasSillas = [];
      for (var s = 1; s <= 10; s++) {
        if (s !== miSilla) {
          var k = mesaId + '-' + s;
          var c = cuentas[k];
          if (c &amp;&amp; c.items &amp;&amp; c.items.length > 0) {
            var tot = 0;
            c.items.forEach(function(i) { tot += i.precio * i.cantidad; });
            otrasSillas.push({ sillaNum: s, cuenta: c, total: tot });
          }
        }
      }

      if (otrasSillas.length === 0) {
        container.innerHTML = '<div class=&quot;text-slate-500 text-[11px] py-1 italic&quot;>No hay otros comensales con cuenta en esta mesa.</div>';
        return;
      }

      otrasSillas.forEach(obj => {
        var s = obj.sillaNum;
        var isChecked = window.sillasAcompanantesSeleccionadas.indexOf(s) !== -1;
        var row = document.createElement('label');
        row.className = `flex items-center justify-between p-2 rounded-xl border cursor-pointer transition select-none ${isChecked ? 'bg-emerald-950/40 border-emerald-500/50' : 'bg-slate-900/60 border-slate-800 hover:border-slate-700'}`;
        row.innerHTML = `
          <div class=&quot;flex items-center gap-2&quot;>
            <input type=&quot;checkbox&quot; value=&quot;${s}&quot; ${isChecked ? 'checked' : ''} onchange=&quot;window.toggleAcompanante(${s})&quot; class=&quot;accent-emerald-500 rounded&quot;>
            <div>
              <span class=&quot;font-bold text-slate-100 block&quot;>Silla ${s} <span class=&quot;text-slate-400 font-normal&quot;>(${obj.cuenta.comensalNombre || 'Comensal'})</span></span>
              <span class=&quot;text-[10px] text-slate-400&quot;>${obj.cuenta.items.length} consumos</span>
            </div>
          </div>
          <span class=&quot;font-bold text-amber-400&quot;>$${obj.total.toFixed(2)}</span>
        `;
        container.appendChild(row);
      });
    };

    window.toggleAcompanante = function(sillaNum) {
      var idx = window.sillasAcompanantesSeleccionadas.indexOf(sillaNum);
      if (idx === -1) {
        window.sillasAcompanantesSeleccionadas.push(sillaNum);
      } else {
        window.sillasAcompanantesSeleccionadas.splice(idx, 1);
      }
      window.renderAcompanantesMesa();
      window.recalcularTotalesCompletos();
    };

    window.seleccionarTodosAcompanantes = function() {
      var cuentas = getStorageCuentas();
      var mesaId = window.simMesaId;
      var miSilla = window.simSillaNum;
      window.sillasAcompanantesSeleccionadas = [];
      for (var s = 1; s <= 10; s++) {
        if (s !== miSilla &amp;&amp; cuentas[mesaId + '-' + s]) {
          window.sillasAcompanantesSeleccionadas.push(s);
        }
      }
      window.renderAcompanantesMesa();
      window.recalcularTotalesCompletos();
    };

    window.recalcularTotalesCompletos = function() {
      var cuentas = getStorageCuentas();
      var mesaId = window.simMesaId;
      var miSilla = window.simSillaNum;

      var subtotalPropio = 0;
      var cPropia = cuentas[mesaId + '-' + miSilla];
      if (cPropia &amp;&amp; cPropia.items) {
        cPropia.items.forEach(function(i) { subtotalPropio += (i.precio * i.cantidad); });
      }

      var subtotalAcompanantes = 0;
      window.sillasAcompanantesSeleccionadas.forEach(function(sNum) {
        var cAcomp = cuentas[mesaId + '-' + sNum];
        if (cAcomp &amp;&amp; cAcomp.items) {
          cAcomp.items.forEach(function(i) { subtotalAcompanantes += (i.precio * i.cantidad); });
        }
      });

      var subtotalNeto = subtotalPropio + subtotalAcompanantes;
      var iva = subtotalNeto * 0.16;
      var propina = subtotalNeto * 0.10;
      var total = subtotalNeto + iva;

      var txtSubtotal = document.getElementById('txtSubtotal');
      var txtIVA = document.getElementById('txtIVA');
      var txtPropina = document.getElementById('txtPropina');
      var txtTotal = document.getElementById('txtTotal');
      var txtBtnPagar = document.getElementById('txtBtnPagarMonto');
      var lblSubtotalDetalle = document.getElementById('lblSubtotalDetalle');

      if (lblSubtotalDetalle) {
        if (window.sillasAcompanantesSeleccionadas.length > 0) {
          lblSubtotalDetalle.innerText = `Subtotal (Silla ${miSilla} + ${window.sillasAcompanantesSeleccionadas.length} Acompañantes):`;
        } else {
          lblSubtotalDetalle.innerText = `Subtotal (Solo Silla ${miSilla}):`;
        }
      }

      if (txtSubtotal) txtSubtotal.innerText = `$${subtotalNeto.toFixed(2)}`;
      if (txtIVA) txtIVA.innerText = `$${iva.toFixed(2)}`;
      if (txtPropina) txtPropina.innerText = `$${propina.toFixed(2)}`;
      if (txtTotal) txtTotal.innerText = `$${total.toFixed(2)}`;
      if (txtBtnPagar) txtBtnPagar.innerText = `$${total.toFixed(2)}`;
    };

    window.agregarAlCarrito = function (prod) {
      var cuentas = getStorageCuentas();
      var key = window.simMesaId + '-' + window.simSillaNum;
      if (!cuentas[key]) {
        cuentas[key] = {
          estado: 'ocupada',
          qrId: 'PV-0' + window.simMesaId + window.simSillaNum,
          comensalNombre: 'Comensal Silla ' + window.simSillaNum,
          items: [],
          historialUbicaciones: [{ mesaId: window.simMesaId, sillaNum: window.simSillaNum, hora: (new Date()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) }]
        };
      }

      var items = cuentas[key].items;
      var existing = items.find(i => i.id === prod.id);
      if (existing) {
        existing.cantidad += 1;
      } else {
        items.push({
          id: prod.id,
          nombre: prod.nombre,
          precio: prod.precio_unitario,
          cantidad: 1,
          mesaId: window.simMesaId,
          sillaNum: window.simSillaNum,
          hora: (new Date()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        });
      }

      saveStorageCuentas(cuentas);
      window.sincronizarCuentaDesdeStorage();
    };

    window.modoPagoCliente = 'incluir_ninos'; // 'solo_yo' | 'incluir_ninos' | 'toda_mesa'

    window.abrirModalCobroCliente = function(metodo) {
      const modal = document.getElementById('modalCobroCliente');
      if (!modal) return;
      window.renderModalCobroDetalle();
      modal.classList.remove('hidden');
      modal.style.display = 'flex';
    };

    window.cerrarModalCobroCliente = function() {
      const modal = document.getElementById('modalCobroCliente');
      if (modal) {
        modal.classList.add('hidden');
        modal.style.display = 'none';
      }
    };

    window.setModoPagoCliente = function(modo) {
      window.modoPagoCliente = modo;
      var btnSolo = document.getElementById('btnModoSoloYo');
      var btnNinos = document.getElementById('btnModoNinos');
      var btnToda = document.getElementById('btnModoTodaMesa');

      [btnSolo, btnNinos, btnToda].forEach(b => {
        if (b) {
          b.className = 'p-2 rounded-lg font-bold border text-center transition bg-slate-800 text-slate-300 border-slate-700 cursor-pointer';
        }
      });

      if (modo === 'solo_yo' &amp;&amp; btnSolo) {
        btnSolo.className = 'p-2 rounded-lg font-bold border text-center transition bg-emerald-600/30 text-emerald-300 border-emerald-500/50 cursor-pointer';
      } else if (modo === 'incluir_ninos' &amp;&amp; btnNinos) {
        btnNinos.className = 'p-2 rounded-lg font-bold border text-center transition bg-emerald-600/30 text-emerald-300 border-emerald-500/50 cursor-pointer';
      } else if (modo === 'toda_mesa' &amp;&amp; btnToda) {
        btnToda.className = 'p-2 rounded-lg font-bold border text-center transition bg-emerald-600/30 text-emerald-300 border-emerald-500/50 cursor-pointer';
      }

      window.renderModalCobroDetalle();
    };

    window.renderModalCobroDetalle = function() {
      var cuentas = getStorageCuentas();
      var mesaId = window.simMesaId;
      var miSilla = window.simSillaNum;
      var container = document.getElementById('modalCobroDetalleTramos');
      var subtotalEl = document.getElementById('modalSubtotal');
      var ivaEl = document.getElementById('modalIVA');
      var propinaEl = document.getElementById('modalPropina');
      var totalEl = document.getElementById('modalTotal');
      var subtituloEl = document.getElementById('modalCobroSubtitulo');

      if (!container) return;
      container.innerHTML = '';

      var sillasAIncluir = [];
      if (window.modoPagoCliente === 'solo_yo') {
        sillasAIncluir = [miSilla];
      } else if (window.modoPagoCliente === 'incluir_ninos') {
        sillasAIncluir = [miSilla].concat(window.sillasAcompanantesSeleccionadas);
      } else if (window.modoPagoCliente === 'toda_mesa') {
        for (var s = 1; s <= 10; s++) {
          if (cuentas[mesaId + '-' + s]) {
            sillasAIncluir.push(s);
          }
        }
      }

      // Eliminar duplicados
      sillasAIncluir = sillasAIncluir.filter((v, i, a) => a.indexOf(v) === i).sort();

      if (subtituloEl) {
        subtituloEl.innerText = `Mesa ${mesaId} • ${sillasAIncluir.length} Cuenta${sillasAIncluir.length > 1 ? 's' : ''} Seleccionada${sillasAIncluir.length > 1 ? 's' : ''}`;
      }

      var totalNeto = 0;

      sillasAIncluir.forEach(sNum => {
        var c = cuentas[mesaId + '-' + sNum];
        if (!c || !c.items || c.items.length === 0) return;

        var subSilla = 0;
        var block = document.createElement('div');
        block.className = 'p-2.5 rounded-xl bg-slate-950/60 border border-slate-800/80 mb-2';

        var h = document.createElement('div');
        h.className = 'flex justify-between items-center font-bold text-emerald-400 mb-1';
        h.innerHTML = `<span>Silla ${sNum} ${c.comensalNombre ? '• ' + c.comensalNombre : ''}</span><span class=&quot;text-[10px] text-slate-500&quot;>QR: #${c.qrId || 'PV-0'+mesaId+sNum}</span>`;
        block.appendChild(h);

        c.items.forEach(it => {
          var itTotal = it.precio * it.cantidad;
          subSilla += itTotal;
          totalNeto += itTotal;
          var row = document.createElement('div');
          row.className = 'flex justify-between text-slate-300 py-0.5';
          row.innerHTML = `<span>${it.cantidad}x ${it.nombre}</span><span>$${itTotal.toFixed(2)}</span>`;
          block.appendChild(row);
        });

        var subRow = document.createElement('div');
        subRow.className = 'flex justify-between text-slate-400 font-bold pt-1 mt-1 border-t border-slate-900 text-[11px]';
        subRow.innerHTML = `<span>Subtotal Silla ${sNum}:</span><span class=&quot;text-amber-400&quot;>$${subSilla.toFixed(2)}</span>`;
        block.appendChild(subRow);

        container.appendChild(block);
      });

      var iva = totalNeto * 0.16;
      var propina = totalNeto * 0.10;
      var granTotal = totalNeto + iva;

      if (subtotalEl) subtotalEl.innerText = `$${totalNeto.toFixed(2)}`;
      if (ivaEl) ivaEl.innerText = `$${iva.toFixed(2)}`;
      if (propinaEl) propinaEl.innerText = `$${propina.toFixed(2)}`;
      if (totalEl) totalEl.innerText = `$${granTotal.toFixed(2)}`;
    };

    window.ejecutarPagoFinal = function(metodo) {
      var cuentas = getStorageCuentas();
      var mesaId = window.simMesaId;
      var miSilla = window.simSillaNum;

      var sillasAIncluir = [];
      if (window.modoPagoCliente === 'solo_yo') {
        sillasAIncluir = [miSilla];
      } else if (window.modoPagoCliente === 'incluir_ninos') {
        sillasAIncluir = [miSilla].concat(window.sillasAcompanantesSeleccionadas);
      } else if (window.modoPagoCliente === 'toda_mesa') {
        for (var s = 1; s <= 10; s++) {
          if (cuentas[mesaId + '-' + s]) {
            sillasAIncluir.push(s);
          }
        }
      }

      sillasAIncluir = sillasAIncluir.filter((v, i, a) => a.indexOf(v) === i);
      var totalText = document.getElementById('modalTotal') ? document.getElementById('modalTotal').innerText : '$0.00';
      var sillasStr = sillasAIncluir.map(function(s) { return 'Silla ' + s; }).join(', ');

      if (confirm(`¿Confirmar liquidación vía ${metodo.toUpperCase()} para Mesa ${mesaId} (${sillasStr}) por ${totalText}?`)) {
        sillasAIncluir.forEach(function(sNum) {
          delete cuentas[mesaId + '-' + sNum];
        });
        saveStorageCuentas(cuentas);
        window.cerrarModalCobroCliente();
        alert(`🎉 ¡Pago completado con éxito vía ${metodo.toUpperCase()}!\nSe han liberado las cuentas de Mesa ${mesaId} (${sillasStr}).`);
        window.sincronizarCuentaDesdeStorage();
      }
    };

    window.cargarDatosMenu = function (productos, categorias) {
      if (productos &amp;&amp; productos.length > 0) window.vsMenuData = productos;
      if (categorias &amp;&amp; categorias.length > 0) window.vsCategoriasData = categorias;
      window.renderCategoriasChips(window.vsCategoriasData);
      window.renderProductos();
      window.sincronizarCuentaDesdeStorage();
    };

    window.renderCategoriasChips = function (categorias) {
      const container = document.getElementById('categoriesChips');
      if (!container) return;
      container.innerHTML = `<button onclick=&quot;window.seleccionarCategoria('Todos')&quot; class=&quot;cat-chip ${window.categoriaActual === 'Todos' ? 'active bg-emerald-500 text-white' : 'bg-slate-800/80 text-slate-400'} px-4 py-2 text-xs font-bold rounded-xl whitespace-nowrap transition&quot;>Todos</button>`;

      categorias.forEach(cat => {
        const btn = document.createElement('button');
        const isActive = window.categoriaActual === cat.nombre;
        btn.className = `cat-chip ${isActive ? 'active bg-emerald-500 text-white shadow-md shadow-emerald-500/20' : 'bg-slate-800/80 text-slate-400 hover:text-white'} px-4 py-2 text-xs font-bold rounded-xl whitespace-nowrap transition`;
        btn.innerText = `${cat.icono || '🍽️'} ${cat.nombre}`;
        btn.onclick = () => window.seleccionarCategoria(cat.nombre);
        container.appendChild(btn);
      });
    };

    window.seleccionarCategoria = function (catNombre) {
      window.categoriaActual = catNombre;
      const chips = document.querySelectorAll('.cat-chip');
      chips.forEach(c => c.classList.remove('active', 'bg-emerald-500', 'text-white'));
      window.renderProductos();
    };

    window.filtrarProductos = function () {
      window.renderProductos();
    };

    window.renderProductos = function () {
      const container = document.getElementById('productsGridContainer');
      if (!container) return;
      const searchInput = document.getElementById('searchInput');
      const searchVal = searchInput ? (searchInput.value || '').toLowerCase() : '';
      container.innerHTML = '';

      const list = window.vsMenuData || [];
      const filtrados = list.filter(p => {
        const matchCat = window.categoriaActual === 'Todos' || p.categoria_nombre === window.categoriaActual;
        const matchSearch = p.nombre.toLowerCase().includes(searchVal) || (p.descripcion &amp;&amp; p.descripcion.toLowerCase().includes(searchVal));
        return matchCat &amp;&amp; matchSearch;
      });

      if (filtrados.length === 0) {
        container.innerHTML = `<div class=&quot;text-center py-12 text-slate-500 text-sm col-span-2&quot;>No se encontraron platillos o bebidas disponibles</div>`;
        return;
      }

      filtrados.forEach(prod => {
        const card = document.createElement('div');
        card.className = 'glass-card p-4 rounded-2xl flex justify-between items-center hover:border-emerald-500/50 transition cursor-pointer group';
        card.onclick = () => window.agregarAlCarrito(prod);

        card.innerHTML = `
          <div class=&quot;flex items-center gap-3&quot;>
            <div class=&quot;w-12 h-12 rounded-xl bg-slate-800 flex items-center justify-center text-2xl group-hover:scale-110 transition&quot;>
              ${prod.icono || '🍲'}
            </div>
            <div>
              <h3 class=&quot;text-sm font-bold text-white group-hover:text-emerald-400 transition&quot;>${prod.nombre}</h3>
              <p class=&quot;text-xs text-slate-400 line-clamp-1&quot;>${prod.descripcion || ''}</p>
            </div>
          </div>
          <div class=&quot;text-right&quot;>
            <span class=&quot;text-sm font-black text-emerald-400 block&quot;>$${Number(prod.precio_unitario).toFixed(2)}</span>
            <span class=&quot;text-[10px] text-slate-500 font-semibold uppercase&quot;>${prod.estacion_preparacion || 'cocina'}</span>
          </div>
        `;
        container.appendChild(card);
      });
    };

    window.navMenu = function (modulo) {
      if (window.anvilAppNav) {
        window.anvilAppNav(modulo);
      } else {
        alert(`Navegación a módulo: ${modulo}`);
      }
    };

    function initImmediate() {
      window.cargarDatosMenu(window.vsMenuData, window.vsCategoriasData);
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initImmediate);
    } else {
      initImmediate();
    }
    setTimeout(initImmediate, 10);
    setTimeout(initImmediate, 100);
  </script>"></anvil-form>
