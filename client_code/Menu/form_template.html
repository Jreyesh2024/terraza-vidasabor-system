<anvil-form container="HtmlTemplate" prop:html="<link rel=&quot;stylesheet&quot; href=&quot;https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css&quot;>
<link rel=&quot;stylesheet&quot; href=&quot;https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css&quot;>
<style>
  body, html { background-color: #090d16 !important; color: #f8fafc !important; }
  .glass-card { background: rgba(22, 30, 46, 0.85) !important; border: 1px solid rgba(255, 255, 255, 0.12) !important; }
</style>




<!-- TAILWIND CSS CDN INJECTION &amp; FONTS -->
<script src=&quot;https://cdn.tailwindcss.com&quot;></script>
<link rel=&quot;preconnect&quot; href=&quot;https://fonts.googleapis.com&quot;>
<link rel=&quot;preconnect&quot; href=&quot;https://fonts.gstatic.com&quot; crossorigin>
<link href=&quot;https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&amp;display=swap&quot; rel=&quot;stylesheet&quot;>
<link rel=&quot;stylesheet&quot; href=&quot;https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css&quot;>

<style>
  body, .anvil-container {
    font-family: 'Inter', sans-serif;
    background-color: #090d16;
    color: #f8fafc;
  }
  .glass-card {
    background: rgba(22, 30, 46, 0.75);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.1);
  }
  .glass-nav {
    background: rgba(15, 23, 42, 0.85);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
  }
  .brand-glow {
    box-shadow: 0 0 25px rgba(16, 185, 129, 0.3);
  }
</style>

<div class=&quot;min-h-screen bg-[#090d16] text-slate-100 flex flex-col font-sans&quot;>

  <!-- HEADER BAR / BRANDING V&amp;S -->
  <header class=&quot;glass-nav sticky top-0 z-50 px-6 py-4 flex items-center justify-between&quot;>
    <div class=&quot;flex items-center gap-3&quot;>
      <div class=&quot;w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-500 to-teal-700 flex items-center justify-center font-black text-xl text-white shadow-lg brand-glow&quot;>
        V&amp;S
      </div>
      <div>
        <h1 class=&quot;text-lg font-bold tracking-tight text-white&quot;>La Terraza de Vida &amp; Sabor</h1>
        <p class=&quot;text-xs text-slate-400 font-medium&quot;>Menú Digital &amp; Comandas en Mesa</p>
      </div>
    </div>

    <!-- BOTONES DE NAVEGACIÓN Y MÓDULOS DEL SISTEMA -->
    <div class=&quot;flex flex-wrap items-center gap-2&quot;>
      <button onclick=&quot;window.navMenu &amp;&amp; window.navMenu('menu')&quot; class=&quot;px-3 py-1.5 text-xs font-bold rounded-xl bg-emerald-600/30 border border-emerald-500/50 text-emerald-300 transition flex items-center gap-1.5&quot;>
        <i class=&quot;fa-solid fa-mobile-screen-button text-emerald-400&quot;></i> 📱 Cliente QR
      </button>
      <button onclick=&quot;window.navMenu &amp;&amp; window.navMenu('pos_mesero')&quot; class=&quot;px-3 py-1.5 text-xs font-bold rounded-xl glass-card text-amber-300 border-amber-500/30 hover:bg-amber-500/10 transition flex items-center gap-1.5&quot;>
        <i class=&quot;fa-solid fa-chair text-amber-400&quot;></i> 📲 POS Croquis
      </button>
      <button onclick=&quot;window.navMenu &amp;&amp; window.navMenu('monitor_cocina')&quot; class=&quot;px-3 py-1.5 text-xs font-bold rounded-xl glass-card text-sky-300 border-sky-500/30 hover:bg-sky-500/10 transition flex items-center gap-1.5&quot;>
        <i class=&quot;fa-solid fa-fire text-amber-400&quot;></i> 👨‍🍳 Cocina KDS
      </button>
      <button onclick=&quot;window.navMenu &amp;&amp; window.navMenu('monitor_fiscal')&quot; class=&quot;px-3 py-1.5 text-xs font-bold rounded-xl glass-card text-slate-300 border-slate-700 hover:bg-slate-800 transition flex items-center gap-1.5&quot;>
        <i class=&quot;fa-solid fa-chart-pie text-sky-400&quot;></i> 🧾 Fiscal
      </button>
      <button onclick=&quot;window.navMenu &amp;&amp; window.navMenu('clientes_lealtad')&quot; class=&quot;px-3 py-1.5 text-xs font-bold rounded-xl glass-card text-purple-300 border-purple-500/30 hover:bg-purple-500/10 transition flex items-center gap-1.5&quot;>
        <i class=&quot;fa-solid fa-award text-purple-400&quot;></i> 💳 Rewards
      </button>
    </div>
  </header>

  <!-- CONTENIDO PRINCIPAL DEL MENÚ DIGITAL -->
  <main class=&quot;flex-1 max-w-7xl w-full mx-auto p-6 grid grid-cols-1 lg:grid-cols-3 gap-6&quot;>

    <!-- SECCIÓN IZQUIERDA: CATÁLOGO Y PRODUCTOS -->
    <section class=&quot;lg:col-span-2 flex flex-col gap-6&quot;>

      <!-- BUSCADOR &amp; BARRA DE CATEGORÍAS -->
      <div class=&quot;flex flex-col sm:flex-row gap-4 justify-between items-center&quot;>
        <div class=&quot;relative w-full sm:w-80&quot;>
          <i class=&quot;fa-solid fa-magnifying-glass absolute left-3.5 top-3.5 text-slate-500 text-sm&quot;></i>
          <input type=&quot;text&quot; id=&quot;searchInput&quot; placeholder=&quot;Buscar platillos o bebidas...&quot; oninput=&quot;window.filtrarProductos()&quot; class=&quot;w-full pl-10 pr-4 py-2.5 bg-slate-900/80 border border-slate-700/80 rounded-xl text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-emerald-500 transition&quot;>
        </div>

        <!-- CHIPS DE CATEGORÍAS -->
        <div class=&quot;flex gap-2 overflow-x-auto w-full sm:w-auto pb-1&quot; id=&quot;categoriesChips&quot;>
          <button onclick=&quot;window.seleccionarCategoria('Todos')&quot; class=&quot;cat-chip active px-4 py-2 text-xs font-bold rounded-xl bg-emerald-500 text-white shadow-md shadow-emerald-500/20 whitespace-nowrap transition&quot;>
            Todos
          </button>
        </div>
      </div>

      <!-- GRID DE TARJETAS DE PLATILLOS -->
      <div class=&quot;grid grid-cols-1 md:grid-cols-2 gap-4&quot; id=&quot;productsGridContainer&quot;>
        <div class=&quot;text-center py-12 text-slate-500 col-span-2&quot;>
          <i class=&quot;fa-solid fa-spinner animate-spin text-2xl text-emerald-500 mb-2&quot;></i>
          <p>Cargando menú de La Terraza V&amp;S...</p>
        </div>
      </div>

    </section>

    <!-- SECCIÓN DERECHA: SIDEBAR DE COMANDA Y COBRO -->
    <aside class=&quot;glass-card rounded-2xl p-6 flex flex-col justify-between h-full border border-slate-800 shadow-2xl&quot;>
      <div>
        <div class=&quot;flex justify-between items-center pb-4 border-b border-slate-800 mb-4&quot;>
          <div>
            <h2 class=&quot;text-base font-bold text-white flex items-center gap-2&quot;>
              <i class=&quot;fa-solid fa-utensils text-emerald-400&quot;></i> Comanda Activa
            </h2>
            <p class=&quot;text-xs text-slate-400&quot;>Detalle de consumos en mesa</p>
          </div>
          <span class=&quot;px-2.5 py-1 text-[10px] font-black rounded-lg bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 uppercase&quot;>
            Abierta
          </span>
        </div>

        <!-- LISTA DE ITEMS REGISTRADOS -->
        <div class=&quot;space-y-3 max-h-80 overflow-y-auto pr-1&quot; id=&quot;cartItemsList&quot;>
          <div class=&quot;text-center py-8 text-slate-500 text-xs&quot;>
            No hay consumos agregados a esta comanda.
          </div>
        </div>
      </div>

      <!-- TOTALES Y ACCIONES DE COBRO -->
      <div class=&quot;pt-4 border-t border-slate-800 mt-6 space-y-4&quot;>
        <div class=&quot;space-y-2 text-xs&quot;>
          <div class=&quot;flex justify-between text-slate-400&quot;>
            <span>Subtotal:</span>
            <span class=&quot;font-semibold text-slate-200&quot; id=&quot;txtSubtotal&quot;>$0.00</span>
          </div>
          <div class=&quot;flex justify-between text-slate-400&quot;>
            <span>IVA (16% Desglosado):</span>
            <span class=&quot;font-semibold text-slate-200&quot; id=&quot;txtIVA&quot;>$0.00</span>
          </div>
          <div class=&quot;flex justify-between text-slate-400&quot;>
            <span>Propina Sugerida (10%):</span>
            <span class=&quot;font-semibold text-slate-200&quot; id=&quot;txtPropina&quot;>$0.00</span>
          </div>
          <div class=&quot;flex justify-between text-base font-black text-white pt-2 border-t border-slate-800&quot;>
            <span>Total Mesa:</span>
            <span class=&quot;text-emerald-400&quot; id=&quot;txtTotal&quot;>$0.00</span>
          </div>
        </div>

        <!-- BOTONES DE COBRO MULTICANAL -->
        <div class=&quot;grid grid-cols-2 gap-2&quot;>
          <button onclick=&quot;window.abrirModalCobro('santander')&quot; class=&quot;py-3 px-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-100 text-xs font-bold border border-slate-700 transition flex items-center justify-center gap-1.5&quot;>
            <i class=&quot;fa-solid fa-credit-card text-sky-400&quot;></i> Santander
          </button>
          <button onclick=&quot;window.abrirModalCobro('efectivo')&quot; class=&quot;py-3 px-3 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold shadow-lg shadow-emerald-600/30 transition flex items-center justify-center gap-1.5&quot;>
            <i class=&quot;fa-solid fa-money-bill-wave&quot;></i> Cobrar / Ticket
          </button>
        </div>
      </div>

    </aside>

  </main>

</div>

<script>
  window.vsMenuData = [
    {id: 1, categoria_nombre: &quot;Barra de Café &amp; Infusiones&quot;, nombre: &quot;Café Capuchino Especial V&amp;S&quot;, descripcion: &quot;Espresso doble con leche cremada artesanal y toque de canela&quot;, precio_unitario: 68.00, estacion_preparacion: &quot;barra_cafe&quot;, icono: &quot;☕&quot;},
    {id: 2, categoria_nombre: &quot;Barra de Café &amp; Infusiones&quot;, nombre: &quot;Espresso Italiano Robusto&quot;, descripcion: &quot;Grano seleccionado 100% arábica tostado de la casa&quot;, precio_unitario: 48.00, estacion_preparacion: &quot;barra_cafe&quot;, icono: &quot;☕&quot;},
    {id: 3, categoria_nombre: &quot;Barra de Café &amp; Infusiones&quot;, nombre: &quot;Latte Machiatto Vainilla Bourbon&quot;, descripcion: &quot;Espresso con leche de almendra y jarabe natural de vainilla bourbon&quot;, precio_unitario: 75.00, estacion_preparacion: &quot;barra_cafe&quot;, icono: &quot;🥛&quot;},
    {id: 4, categoria_nombre: &quot;Desayunos &amp; Brunch Gourmet&quot;, nombre: &quot;Chilaquiles Verdes con Pollo y Queso Gouda&quot;, descripcion: &quot;Totopos artesanos en salsa de tomatillo con pollo deshebrado y gouda&quot;, precio_unitario: 148.00, estacion_preparacion: &quot;cocina&quot;, icono: &quot;🥘&quot;},
    {id: 5, categoria_nombre: &quot;Desayunos &amp; Brunch Gourmet&quot;, nombre: &quot;Omelette Supremo La Terraza&quot;, descripcion: &quot;3 huevos orgánicos rellenos de portobello, espinacas baby y queso asadero&quot;, precio_unitario: 155.00, estacion_preparacion: &quot;cocina&quot;, icono: &quot;🍳&quot;},
    {id: 6, categoria_nombre: &quot;Desayunos &amp; Brunch Gourmet&quot;, nombre: &quot;Molletes de Masa Madre con Chorizo&quot;, descripcion: &quot;Pan artesano de masa madre con frijol negro, gouda y chorizo&quot;, precio_unitario: 125.00, estacion_preparacion: &quot;cocina&quot;, icono: &quot;🥖&quot;},
    {id: 7, categoria_nombre: &quot;Especialidades Fuertes&quot;, nombre: &quot;Rib Eye Grill V&amp;S (350g)&quot;, descripcion: &quot;Corte de alta calidad a las brasas servido con papas gajo y espárragos&quot;, precio_unitario: 385.00, estacion_preparacion: &quot;cocina&quot;, icono: &quot;🥩&quot;},
    {id: 8, categoria_nombre: &quot;Especialidades Fuertes&quot;, nombre: &quot;Pasta Fettuccine con Camarones al Trufado&quot;, descripcion: &quot;Pasta fresca hecha en casa con camarones u-15 y crema suave de trufa&quot;, precio_unitario: 265.00, estacion_preparacion: &quot;cocina&quot;, icono: &quot;🍝&quot;},
    {id: 9, categoria_nombre: &quot;Repostería &amp; Postres de Autor&quot;, nombre: &quot;Pastel Supremo de Chocolate Valrhona&quot;, descripcion: &quot;Rebanada caliente de pastel de chocolate amargo con helado de vainilla&quot;, precio_unitario: 105.00, estacion_preparacion: &quot;reposteria&quot;, icono: &quot;🍰&quot;},
    {id: 10, categoria_nombre: &quot;Bebidas &amp; Coctelería de Autor&quot;, nombre: &quot;Limonada Botánica de Hierbabuena &amp; Jengibre&quot;, descripcion: &quot;Agua mineral infucionada con jengibre fresco, limón eufrata y hierbabuena&quot;, precio_unitario: 60.00, estacion_preparacion: &quot;barra_cafe&quot;, icono: &quot;🍋&quot;}
  ];

  window.vsCategoriasData = [
    {id: 1, nombre: &quot;Barra de Café &amp; Infusiones&quot;, icono: &quot;☕&quot;},
    {id: 2, nombre: &quot;Desayunos &amp; Brunch Gourmet&quot;, icono: &quot;🍳&quot;},
    {id: 3, nombre: &quot;Entradas &amp; Tapas de la Terraza&quot;, icono: &quot;🥗&quot;},
    {id: 4, nombre: &quot;Especialidades Fuertes&quot;, icono: &quot;🥩&quot;},
    {id: 5, nombre: &quot;Repostería &amp; Postres de Autor&quot;, icono: &quot;🍰&quot;},
    {id: 6, nombre: &quot;Bebidas &amp; Coctelería de Autor&quot;, icono: &quot;🍹&quot;}
  ];

  window.vsCartItems = [];
  window.categoriaActual = &quot;Todos&quot;;

  window.cargarDatosMenu = function(productos, categorias) {
    if (productos &amp;&amp; productos.length > 0) window.vsMenuData = productos;
    if (categorias &amp;&amp; categorias.length > 0) window.vsCategoriasData = categorias;
    window.renderCategoriasChips(window.vsCategoriasData);
    window.renderProductos();
  };

  window.renderCategoriasChips = function(categorias) {
    const container = document.getElementById('categoriesChips');
    if (!container) return;
    container.innerHTML = `<button onclick=&quot;window.seleccionarCategoria('Todos')&quot; class=&quot;cat-chip ${window.categoriaActual === 'Todos' ? 'active bg-emerald-500 text-white' : 'bg-slate-800/80 text-slate-400'} px-4 py-2 text-xs font-bold rounded-xl whitespace-nowrap transition&quot;>Todos</button>`;

    categorias.forEach(cat => {
      const btn = document.createElement('button');
      const isActive = window.categoriaActual === cat.nombre;
      btn.className = `cat-chip ${isActive ? 'active bg-emerald-500 text-white shadow-md shadow-emerald-500/20' : 'bg-slate-800/80 text-slate-400 hover:text-white'} px-4 py-2 text-xs font-bold rounded-xl whitespace-nowrap transition`;
      btn.innerText = `${cat.icono || '🍽️'} ${cat.nombre}`;
      btn.onclick = () => window.seleccionarCategoria(cat.nombre);
      container.appendChild(btn);
    });
  };

  window.seleccionarCategoria = function(catNombre) {
    window.categoriaActual = catNombre;
    const chips = document.querySelectorAll('.cat-chip');
    chips.forEach(c => c.classList.remove('active', 'bg-emerald-500', 'text-white'));
    window.renderProductos();
  };

  window.filtrarProductos = function() {
    window.renderProductos();
  };

  window.renderProductos = function() {
    const container = document.getElementById('productsGridContainer');
    if (!container) return;
    const searchInput = document.getElementById('searchInput');
    const searchVal = searchInput ? (searchInput.value || '').toLowerCase() : '';
    container.innerHTML = '';

    const list = window.vsMenuData || [];
    const filtrados = list.filter(p => {
      const matchCat = window.categoriaActual === 'Todos' || p.categoria_nombre === window.categoriaActual;
      const matchSearch = p.nombre.toLowerCase().includes(searchVal) || (p.descripcion &amp;&amp; p.descripcion.toLowerCase().includes(searchVal));
      return matchCat &amp;&amp; matchSearch;
    });

    if (filtrados.length === 0) {
      container.innerHTML = `<div class=&quot;text-center py-12 text-slate-500 text-sm col-span-2&quot;>No se encontraron platillos o bebidas disponibles</div>`;
      return;
    }

    filtrados.forEach(prod => {
      const card = document.createElement('div');
      card.className = 'glass-card p-4 rounded-2xl flex justify-between items-center hover:border-emerald-500/50 transition cursor-pointer group';
      card.onclick = () => window.agregarAlCarrito(prod);

      card.innerHTML = `
          <div class=&quot;flex items-center gap-3&quot;>
            <div class=&quot;w-12 h-12 rounded-xl bg-slate-800 flex items-center justify-center text-2xl group-hover:scale-110 transition&quot;>
              ${prod.icono || '🍲'}
            </div>
            <div>
              <h3 class=&quot;text-sm font-bold text-white group-hover:text-emerald-400 transition&quot;>${prod.nombre}</h3>
              <p class=&quot;text-xs text-slate-400 line-clamp-1&quot;>${prod.descripcion || ''}</p>
            </div>
          </div>
          <div class=&quot;text-right&quot;>
            <span class=&quot;text-sm font-black text-emerald-400 block&quot;>$${Number(prod.precio_unitario).toFixed(2)}</span>
            <span class=&quot;text-[10px] text-slate-500 font-semibold uppercase&quot;>${prod.estacion_preparacion || 'cocina'}</span>
          </div>
        `;
      container.appendChild(card);
    });
  };

  window.agregarAlCarrito = function(prod) {
    const index = window.vsCartItems.findIndex(i => i.id === prod.id);
    if (index >= 0) {
      window.vsCartItems[index].cantidad += 1;
    } else {
      window.vsCartItems.push({ ...prod, cantidad: 1 });
    }
    window.renderCarrito();
  };

  window.renderCarrito = function() {
    const container = document.getElementById('cartItemsList');
    if (!container) return;
    container.innerHTML = '';

    let subtotal = 0;

    if (window.vsCartItems.length === 0) {
      container.innerHTML = `<div class=&quot;text-center py-8 text-slate-500 text-xs&quot;>No hay consumos agregados a esta comanda.</div>`;
    } else {
      window.vsCartItems.forEach((item, idx) => {
        const itemSubtotal = item.precio_unitario * item.cantidad;
        subtotal += itemSubtotal;

        const row = document.createElement('div');
        row.className = 'flex justify-between items-center bg-slate-900/60 p-2.5 rounded-xl border border-slate-800/80 text-xs';
        row.innerHTML = `
            <div>
              <span class=&quot;font-bold text-white&quot;>${item.nombre} x${item.cantidad}</span>
              <span class=&quot;block text-[10px] text-slate-400&quot;>$${Number(item.precio_unitario).toFixed(2)} c/u</span>
            </div>
            <div class=&quot;flex items-center gap-2&quot;>
              <span class=&quot;font-black text-slate-200&quot;>$${itemSubtotal.toFixed(2)}</span>
              <button onclick=&quot;window.quitarDelCarrito(${idx})&quot; class=&quot;text-red-400 hover:text-red-300 text-xs ml-1&quot;><i class=&quot;fa-solid fa-trash&quot;></i></button>
            </div>
          `;
        container.appendChild(row);
      });
    }

    const iva = subtotal * 0.16;
    const propina = subtotal * 0.10;
    const total = subtotal + propina;

    const txtSubtotal = document.getElementById('txtSubtotal');
    const txtIVA = document.getElementById('txtIVA');
    const txtPropina = document.getElementById('txtPropina');
    const txtTotal = document.getElementById('txtTotal');

    if (txtSubtotal) txtSubtotal.innerText = `$${subtotal.toFixed(2)}`;
    if (txtIVA) txtIVA.innerText = `$${iva.toFixed(2)}`;
    if (txtPropina) txtPropina.innerText = `$${propina.toFixed(2)}`;
    if (txtTotal) txtTotal.innerText = `$${total.toFixed(2)}`;
  };

  window.quitarDelCarrito = function(index) {
    window.vsCartItems.splice(index, 1);
    window.renderCarrito();
  };

  window.navMenu = function(modulo) {
    if (window.anvilAppNav) {
      window.anvilAppNav(modulo);
    } else {
      alert(`Navegación a módulo: ${modulo}`);
    }
  };

  window.abrirModalCobro = function(metodo) {
    if (window.vsCartItems.length === 0) {
      alert('Agregue consumos antes de proceder al cobro');
      return;
    }
    if (window.anvilProcesarCobro) {
      window.anvilProcesarCobro(metodo, window.vsCartItems);
    } else {
      alert(`Procesando pago vía ${metodo.toUpperCase()} para La Terraza V&amp;S...`);
    }
  };

  function initImmediate() {
    window.cargarDatosMenu(window.vsMenuData, window.vsCategoriasData);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initImmediate);
  } else {
    initImmediate();
  }
  setTimeout(initImmediate, 10);
  setTimeout(initImmediate, 100);
</script>"></anvil-form>
