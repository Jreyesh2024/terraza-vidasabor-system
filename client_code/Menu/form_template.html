      return {};

      var cuentas = getStorageCuentas();
      var key = window.simMesaId + '-' + window.simSillaNum;
      var cuenta = cuentas[key];
      var total = 0;
      if (cuenta &amp;&amp; cuenta.items) {
        cuenta.items.forEach(function(i) { total += (i.precio * i.cantidad); });
      }
      alert(`🧾 Cuenta Solicitada:\nMesa ${window.simMesaId} • Silla ${window.simSillaNum}\nTotal a Liquidar: $${total.toFixed(2)} MXN\n\nEl mesero acudirá con la cuenta y opciones de pago.`);

    window.renderSillasMesaBar = function () {
      var container = document.getElementById('chipsSillasMesa');
      if (!container) return;
      container.innerHTML = '';

      var mesaId = window.simMesaId || 1;
      var miSilla = window.simSillaNum || 1;
      var cuentas = getStorageCuentas();

      for (var s = 1; s <= 4; s++) {
        var isMe = (s === miSilla);
        var key = mesaId + '-' + s;
        var c = cuentas[key];
        var hasItems = c &amp;&amp; c.items &amp;&amp; c.items.length > 0;

        var btn = document.createElement('button');
        btn.type = 'button';
        btn.onclick = (function(sNum) {
          return function() {
            window.cambiarSimulacionQr(mesaId + '-' + sNum);
          };
        })(s);

        if (isMe) {
          btn.className = 'px-3 py-1.5 text-xs font-black rounded-xl bg-emerald-500 text-slate-950 border border-emerald-400 flex items-center gap-1.5 shadow-md shadow-emerald-500/20 cursor-pointer';
          btn.innerHTML = `<i class=&quot;fa-solid fa-user-check text-[11px]&quot;></i> Silla ${s} (Tú)`;
        } else {
          btn.className = 'px-2.5 py-1.5 text-xs font-semibold rounded-xl bg-slate-800 text-slate-300 hover:bg-slate-700 hover:text-white border border-slate-700 flex items-center gap-1.5 transition cursor-pointer';
          btn.innerHTML = `Silla ${s}${hasItems ? ' <span class=&quot;text-[10px] bg-emerald-950 text-emerald-300 px-1.5 py-0.5 rounded-full border border-emerald-500/40&quot;>🍽️</span>' : ''}`;

    window.cambiarSimulacionQr = function (keyStr) {
      var parts = keyStr.split('-');
      window.simMesaId = parseInt(parts[0]);
      window.simSillaNum = parseInt(parts[1]);

      // Si es Mesa 2 Silla 1 (Papá), sugerir niños seleccionados (3 y 4)
      if (window.simMesaId === 2 &amp;&amp; window.simSillaNum === 1) {
        window.sillasAcompanantesSeleccionadas = [3, 4];
      } else {
        window.sillasAcompanantesSeleccionadas = [];
      }

      window.sincronizarCuentaDesdeStorage();
    };

    window.sincronizarCuentaDesdeStorage = function () {
      var cuentas = getStorageCuentas();
      var key = window.simMesaId + '-' + window.simSillaNum;
      var qrId = 'PV-0' + window.simMesaId + window.simSillaNum;

      // Asegurar que la silla esté marcada automáticamente como OCUPADA / ACTIVA
      if (!cuentas[key]) {
        cuentas[key] = {
          id: Date.now(),
          mesaId: window.simMesaId,
          sillaNum: window.simSillaNum,
          qrId: qrId,
          comensalNombre: 'Comensal Silla ' + window.simSillaNum,
          items: [],
          estado: 'ocupada',
          creadoPor: 'cliente_qr',
          horaApertura: (new Date()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        };
        saveStorageCuentas(cuentas);
      } else {
        cuentas[key].estado = 'ocupada';
        if (!cuentas[key].qrId) cuentas[key].qrId = qrId;
        saveStorageCuentas(cuentas);
      }

      var cuentaActual = cuentas[key];
      var comensalNom = (cuentaActual &amp;&amp; cuentaActual.comensalNombre) ? cuentaActual.comensalNombre : ('Comensal Silla ' + window.simSillaNum);

    window.renderCarrito = function () {
      const container = document.getElementById('cartItemsList');
      if (!container) return;
      container.innerHTML = '';

      var cuentas = getStorageCuentas();
      var key = window.simMesaId + '-' + window.simSillaNum;
      var cuentaActual = cuentas[key] || { items: [] };
      var items = cuentaActual.items || [];

      var pendientesCount = 0;

      if (items.length === 0) {
        container.innerHTML = `<div class=&quot;text-center py-6 text-slate-500 text-xs&quot;>No hay consumos registrados en tu silla.</div>`;
      } else {
        items.forEach((item, idx) => {
          const itemSubtotal = item.precio * item.cantidad;
          if (!item.enviadoCocina) pendientesCount++;

          const row = document.createElement('div');
          row.className = 'flex justify-between items-center bg-slate-900/80 p-2.5 rounded-xl border border-slate-800 text-xs';
          row.innerHTML = `
            <div>
              <div class=&quot;flex items-center gap-1.5&quot;>
                <span class=&quot;font-bold text-white&quot;>${item.nombre} x${item.cantidad}</span>
              </div>
              <div class=&quot;flex items-center gap-2 mt-1&quot;>
                <span class=&quot;text-[10px] text-slate-400&quot;>${item.notas ? item.notas + ' • ' : ''}$${Number(item.precio).toFixed(2)} c/u</span>
                ${item.enviadoCocina
                  ? `<span class=&quot;bg-emerald-950/60 text-emerald-300 border border-emerald-500/40 text-[9px] font-bold px-1.5 py-0.5 rounded flex items-center gap-1&quot;><i class=&quot;fa-solid fa-fire text-emerald-400&quot;></i> En Cocina (${item.horaEnvioCocina || item.hora || ''})</span>`
                  : `<span class=&quot;bg-amber-950/60 text-amber-300 border border-amber-500/40 text-[9px] font-bold px-1.5 py-0.5 rounded flex items-center gap-1&quot;><i class=&quot;fa-solid fa-clock text-amber-400&quot;></i> Pendiente</span>`}
              </div>
            </div>
            <span class=&quot;font-black text-emerald-400&quot;>$${itemSubtotal.toFixed(2)}</span>
          `;
          container.appendChild(row);
        });
      }

      const btnSendCocina = document.getElementById('btnClienteEnviarCocina');
      const btnSendCocinaTxt = document.getElementById('btnClienteEnviarCocinaTxt');
      if (btnSendCocina &amp;&amp; btnSendCocinaTxt) {
        if (pendientesCount > 0) {
          btnSendCocina.disabled = false;
          btnSendCocina.style.opacity = '1';
          btnSendCocina.style.cursor = 'pointer';
          btnSendCocinaTxt.innerHTML = `<b>Enviar a Cocina / Barra</b> (${pendientesCount} pendiente${pendientesCount > 1 ? 's' : ''})`;
        } else if (items.length > 0) {
          btnSendCocina.disabled = true;
          btnSendCocina.style.opacity = '0.65';
          btnSendCocina.style.cursor = 'default';
          btnSendCocinaTxt.innerHTML = `<i class=&quot;fa-solid fa-check-double&quot;></i> Todo enviado a Cocina`;
        } else {
          btnSendCocina.disabled = true;
          btnSendCocina.style.opacity = '0.4';
          btnSendCocina.style.cursor = 'not-allowed';
          btnSendCocinaTxt.innerHTML = `Enviar a Cocina / Barra`;
        }
      }

      window.recalcularTotalesCompletos();
    };

    window.enviarPedidoClienteCocina = function () {
      var cuentas = getStorageCuentas();
      var key = window.simMesaId + '-' + window.simSillaNum;
      var cuenta = cuentas[key];
      if (!cuenta || !cuenta.items || cuenta.items.length === 0) {
        alert('Agrega al menos un producto a tu comanda antes de enviar a cocina.');
        return;
      }

      var pendientes = cuenta.items.filter(i => !i.enviadoCocina);
      if (pendientes.length === 0) {
        alert('Todos tus productos ya fueron enviados a Cocina / Barra de Café.');
        return;
      }

      var nowStr = (new Date()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      pendientes.forEach(i => {
        i.enviadoCocina = true;
        i.horaEnvioCocina = nowStr;
      });

      saveStorageCuentas(cuentas);
      window.renderCarrito();
      alert(`🚀 ¡${pendientes.length} producto(s) enviados a Cocina / Barra de Café (${nowStr})! La preparación ha iniciado.`);
    };

    window.renderAcompanantesMesa = function () {
      const container = document.getElementById('listaAcompanantesMesa');
      if (!container) return;
      container.innerHTML = '';

      var otrasSillas = [];
      for (var s = 1; s <= 10; s++) {
        if (s !== miSilla) {
          var k = mesaId + '-' + s;
          var c = cuentas[k];

        container.innerHTML = '<div class=&quot;text-slate-500 text-[11px] py-1 italic&quot;>No hay otros comensales con cuenta en esta mesa.</div>';

        var isChecked = window.sillasAcompanantesSeleccionadas.indexOf(s) !== -1;
        var row = document.createElement('label');
        row.className = `flex items-center justify-between p-2 rounded-xl border cursor-pointer transition select-none ${isChecked ? 'bg-emerald-950/40 border-emerald-500/50' : 'bg-slate-900/60 border-slate-800 hover:border-slate-700'}`;
        row.innerHTML = `
          <div class=&quot;flex items-center gap-2&quot;>
            <input type=&quot;checkbox&quot; value=&quot;${s}&quot; ${isChecked ? 'checked' : ''} onchange=&quot;window.toggleAcompanante(${s})&quot; class=&quot;accent-emerald-500 rounded&quot;>
            <div>
              <span class=&quot;font-bold text-slate-100 block&quot;>Silla ${s} <span class=&quot;text-slate-400 font-normal&quot;>(${obj.cuenta.comensalNombre || 'Comensal'})</span></span>
              <span class=&quot;text-[10px] text-slate-400&quot;>${obj.cuenta.items.length} consumos</span>
            </div>
          </div>
          <span class=&quot;font-bold text-amber-400&quot;>$${obj.total.toFixed(2)}</span>
        `;
        container.appendChild(row);
      });
    };

    window.toggleAcompanante = function (sillaNum) {
      var idx = window.sillasAcompanantesSeleccionadas.indexOf(sillaNum);
      if (idx === -1) {
        window.sillasAcompanantesSeleccionadas.push(sillaNum);
      } else {
        window.sillasAcompanantesSeleccionadas.splice(idx, 1);
      }
      window.renderAcompanantesMesa();
      window.recalcularTotalesCompletos();
    };

    window.seleccionarTodosAcompanantes = function () {
      var cuentas = getStorageCuentas();
      var mesaId = window.simMesaId;
      var miSilla = window.simSillaNum;
      window.sillasAcompanantesSeleccionadas = [];
      for (var s = 1; s <= 10; s++) {
        if (s !== miSilla &amp;&amp; cuentas[mesaId + '-' + s]) {
          window.sillasAcompanantesSeleccionadas.push(s);
        }
      }
      window.renderAcompanantesMesa();
      window.recalcularTotalesCompletos();
    };

    window.recalcularTotalesCompletos = function () {
      var cuentas = getStorageCuentas();
      var mesaId = window.simMesaId;
      var miSilla = window.simSillaNum;

      var subtotalPropio = 0;
      var cPropia = cuentas[mesaId + '-' + miSilla];
      if (cPropia &amp;&amp; cPropia.items) {
        cPropia.items.forEach(function (i) { subtotalPropio += (i.precio * i.cantidad); });
      }

      var subtotalAcompanantes = 0;
      window.sillasAcompanantesSeleccionadas.forEach(function (sNum) {
        var cAcomp = cuentas[mesaId + '-' + sNum];
        if (cAcomp &amp;&amp; cAcomp.items) {
          cAcomp.items.forEach(function (i) { subtotalAcompanantes += (i.precio * i.cantidad); });
        }
      });

      var subtotalNeto = subtotalPropio + subtotalAcompanantes;
      var iva = subtotalNeto * 0.16;
      var propina = subtotalNeto * 0.10;
      var total = subtotalNeto + iva;

      var txtSubtotal = document.getElementById('txtSubtotal');
      var txtIVA = document.getElementById('txtIVA');
      var txtPropina = document.getElementById('txtPropina');
      var txtTotal = document.getElementById('txtTotal');
      var txtBtnPagar = document.getElementById('txtBtnPagarMonto');
      var lblSubtotalDetalle = document.getElementById('lblSubtotalDetalle');

      if (lblSubtotalDetalle) {
        if (window.sillasAcompanantesSeleccionadas.length > 0) {
          lblSubtotalDetalle.innerText = `Subtotal (Silla ${miSilla} + ${window.sillasAcompanantesSeleccionadas.length} Acompañantes):`;
        } else {
          lblSubtotalDetalle.innerText = `Subtotal (Solo Silla ${miSilla}):`;
        }
      }

      if (txtSubtotal) txtSubtotal.innerText = `$${subtotalNeto.toFixed(2)}`;
      if (txtIVA) txtIVA.innerText = `$${iva.toFixed(2)}`;
      if (txtPropina) txtPropina.innerText = `$${propina.toFixed(2)}`;
      if (txtTotal) txtTotal.innerText = `$${total.toFixed(2)}`;
      if (txtBtnPagar) txtBtnPagar.innerText = `$${total.toFixed(2)}`;
    };

    window.agregarAlCarrito = function (prod) {
      var cuentas = getStorageCuentas();
      var key = window.simMesaId + '-' + window.simSillaNum;
      if (!cuentas[key]) {
        cuentas[key] = {
          estado: 'ocupada',
          qrId: 'PV-0' + window.simMesaId + window.simSillaNum,
          comensalNombre: 'Comensal Silla ' + window.simSillaNum,
          items: [],
          historialUbicaciones: [{ mesaId: window.simMesaId, sillaNum: window.simSillaNum, hora: (new Date()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) }]
        };
      }

      var items = cuentas[key].items;
      var existing = items.find(i => i.id === prod.id);
      if (existing) {
        existing.cantidad += 1;
      } else {
        items.push({
          id: prod.id,
          nombre: prod.nombre,
          precio: prod.precio_unitario,
          cantidad: 1,
          mesaId: window.simMesaId,
          sillaNum: window.simSillaNum,
          hora: (new Date()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        });
      }

      saveStorageCuentas(cuentas);
      window.sincronizarCuentaDesdeStorage();
    };

    window.modoPagoCliente = 'incluir_ninos'; // 'solo_yo' | 'incluir_ninos' | 'toda_mesa'

    window.abrirModalCobroCliente = function (metodo) {
      const modal = document.getElementById('modalCobroCliente');
      if (!modal) return;
      window.renderModalCobroDetalle();
      modal.classList.remove('hidden');
      modal.style.display = 'flex';
    };

    window.cerrarModalCobroCliente = function () {
      const modal = document.getElementById('modalCobroCliente');
      if (modal) {
        modal.classList.add('hidden');
        modal.style.display = 'none';
      }
    };

    window.setModoPagoCliente = function (modo) {
      window.modoPagoCliente = modo;
      var btnSolo = document.getElementById('btnModoSoloYo');
      var btnNinos = document.getElementById('btnModoNinos');
      var btnToda = document.getElementById('btnModoTodaMesa');

      [btnSolo, btnNinos, btnToda].forEach(b => {
        if (b) {
          b.className = 'p-2 rounded-lg font-bold border text-center transition bg-slate-800 text-slate-300 border-slate-700 cursor-pointer';
        }
      });

      if (modo === 'solo_yo' &amp;&amp; btnSolo) {
        btnSolo.className = 'p-2 rounded-lg font-bold border text-center transition bg-emerald-600/30 text-emerald-300 border-emerald-500/50 cursor-pointer';
      } else if (modo === 'incluir_ninos' &amp;&amp; btnNinos) {
        btnNinos.className = 'p-2 rounded-lg font-bold border text-center transition bg-emerald-600/30 text-emerald-300 border-emerald-500/50 cursor-pointer';
      } else if (modo === 'toda_mesa' &amp;&amp; btnToda) {
        btnToda.className = 'p-2 rounded-lg font-bold border text-center transition bg-emerald-600/30 text-emerald-300 border-emerald-500/50 cursor-pointer';
      }

      window.renderModalCobroDetalle();
    };

    window.renderModalCobroDetalle = function () {
      var cuentas = getStorageCuentas();
      var mesaId = window.simMesaId;
      var miSilla = window.simSillaNum;
      var container = document.getElementById('modalCobroDetalleTramos');
      var subtotalEl = document.getElementById('modalSubtotal');
      var ivaEl = document.getElementById('modalIVA');
      var propinaEl = document.getElementById('modalPropina');
      var totalEl = document.getElementById('modalTotal');
      var subtituloEl = document.getElementById('modalCobroSubtitulo');

      if (!container) return;
      container.innerHTML = '';

      var sillasAIncluir = [];
      if (window.modoPagoCliente === 'solo_yo') {
        sillasAIncluir = [miSilla];
      } else if (window.modoPagoCliente === 'incluir_ninos') {
        sillasAIncluir = [miSilla].concat(window.sillasAcompanantesSeleccionadas);
      } else if (window.modoPagoCliente === 'toda_mesa') {
        for (var s = 1; s <= 10; s++) {
          if (cuentas[mesaId + '-' + s]) {
            sillasAIncluir.push(s);
          }
        }
      }

      // Eliminar duplicados
      sillasAIncluir = sillasAIncluir.filter((v, i, a) => a.indexOf(v) === i).sort();

      if (subtituloEl) {
        subtituloEl.innerText = `Mesa ${mesaId} • ${sillasAIncluir.length} Cuenta${sillasAIncluir.length > 1 ? 's' : ''} Seleccionada${sillasAIncluir.length > 1 ? 's' : ''}`;
      }

      var totalNeto = 0;

      sillasAIncluir.forEach(sNum => {
        var c = cuentas[mesaId + '-' + sNum];
        if (!c || !c.items || c.items.length === 0) return;

        var subSilla = 0;
        var block = document.createElement('div');
        block.className = 'p-2.5 rounded-xl bg-slate-950/60 border border-slate-800/80 mb-2';

        var h = document.createElement('div');
        h.className = 'flex justify-between items-center font-bold text-emerald-400 mb-1';
        h.innerHTML = `<span>Silla ${sNum} ${c.comensalNombre ? '• ' + c.comensalNombre : ''}</span><span class=&quot;text-[10px] text-slate-500&quot;>QR: #${c.qrId || 'PV-0' + mesaId + sNum}</span>`;
        block.appendChild(h);

        c.items.forEach(it => {
          var itTotal = it.precio * it.cantidad;
          subSilla += itTotal;
          totalNeto += itTotal;
          var row = document.createElement('div');
          row.className = 'flex justify-between text-slate-300 py-0.5';
          row.innerHTML = `<span>${it.cantidad}x ${it.nombre}</span><span>$${itTotal.toFixed(2)}</span>`;
          block.appendChild(row);
        });

        var subRow = document.createElement('div');
        subRow.className = 'flex justify-between text-slate-400 font-bold pt-1 mt-1 border-t border-slate-900 text-[11px]';
        subRow.innerHTML = `<span>Subtotal Silla ${sNum}:</span><span class=&quot;text-amber-400&quot;>$${subSilla.toFixed(2)}</span>`;
        block.appendChild(subRow);

        container.appendChild(block);
      });

      var iva = totalNeto * 0.16;
      var propina = totalNeto * 0.10;
      var granTotal = totalNeto + iva;

      if (subtotalEl) subtotalEl.innerText = `$${totalNeto.toFixed(2)}`;
      if (ivaEl) ivaEl.innerText = `$${iva.toFixed(2)}`;
      if (propinaEl) propinaEl.innerText = `$${propina.toFixed(2)}`;
      if (totalEl) totalEl.innerText = `$${granTotal.toFixed(2)}`;
    };

    window.ejecutarPagoFinal = function (metodo) {
      var cuentas = getStorageCuentas();
      var mesaId = window.simMesaId;
      var miSilla = window.simSillaNum;

      var sillasAIncluir = [];
      if (window.modoPagoCliente === 'solo_yo') {
        sillasAIncluir = [miSilla];
      } else if (window.modoPagoCliente === 'incluir_ninos') {
        sillasAIncluir = [miSilla].concat(window.sillasAcompanantesSeleccionadas);
      } else if (window.modoPagoCliente === 'toda_mesa') {
        for (var s = 1; s <= 10; s++) {
          if (cuentas[mesaId + '-' + s]) {
            sillasAIncluir.push(s);
          }
        }
      }

      sillasAIncluir = sillasAIncluir.filter((v, i, a) => a.indexOf(v) === i);
      var totalText = document.getElementById('modalTotal') ? document.getElementById('modalTotal').innerText : '$0.00';
      var sillasStr = sillasAIncluir.map(function (s) { return 'Silla ' + s; }).join(', ');

      if (confirm(`¿Confirmar liquidación vía ${metodo.toUpperCase()} para Mesa ${mesaId} (${sillasStr}) por ${totalText}?`)) {
        sillasAIncluir.forEach(function (sNum) {
          delete cuentas[mesaId + '-' + sNum];
        });
        saveStorageCuentas(cuentas);
        window.cerrarModalCobroCliente();
        alert(`🎉 ¡Pago completado con éxito vía ${metodo.toUpperCase()}!\nSe han liberado las cuentas de Mesa ${mesaId} (${sillasStr}).`);
        window.sincronizarCuentaDesdeStorage();
      }
    };

    window.cargarDatosMenu = function (productos, categorias) {
      if (productos &amp;&amp; productos.length > 0) window.vsMenuData = productos;
      if (categorias &amp;&amp; categorias.length > 0) window.vsCategoriasData = categorias;
      window.renderCategoriasChips(window.vsCategoriasData);
      window.renderProductos();
      window.sincronizarCuentaDesdeStorage();
    };

    window.renderCategoriasChips = function (categorias) {
      const container = document.getElementById('categoriesChips');
      if (!container) return;
      container.innerHTML = '';

      categorias.forEach(cat => {
        const btn = document.createElement('button');
        const isActive = window.categoriaActual === cat.nombre;
        btn.className = `cat-chip ${isActive ? 'active bg-emerald-500 text-white shadow-md shadow-emerald-500/20' : 'bg-slate-800/80 text-slate-400 hover:text-white'} px-4 py-2 text-xs font-bold rounded-xl whitespace-nowrap transition`;
        btn.innerText = `${cat.icono || '🍽️'} ${cat.nombre}`;
        btn.onclick = () => window.seleccionarCategoria(cat.nombre);
        container.appendChild(btn);
      });
    };

    window.seleccionarCategoria = function (catNombre) {
      window.categoriaActual = catNombre;
      window.renderCategoriasChips(window.vsCategoriasData);
      window.renderProductos();
    };

    window.filtrarProductos = function () {
      window.renderProductos();
    };

    window.renderProductos = function () {
      const container = document.getElementById('productsGridContainer');
      if (!container) return;
      container.innerHTML = '';

      const catActual = window.categoriaActual;
      const query = document.getElementById('searchInput') ? document.getElementById('searchInput').value.toLowerCase().trim() : '';

      const filtrados = (window.vsMenuData || []).filter(prod => {
        const matchCat = (!catActual || catActual === 'Todos' || prod.categoria_nombre === catActual);
        const matchText = prod.nombre.toLowerCase().includes(query) || (prod.descripcion &amp;&amp; prod.descripcion.toLowerCase().includes(query));
        return matchCat &amp;&amp; matchText;
      });

      if (filtrados.length === 0) {
        container.innerHTML = `<div class=&quot;text-center py-12 text-slate-500 text-sm col-span-2&quot;>No se encontraron platillos o bebidas disponibles</div>`;
        return;
      }

      filtrados.forEach(prod => {
        const card = document.createElement('div');
        card.className = 'glass-card p-4 rounded-2xl flex flex-col justify-between hover:border-emerald-500/50 transition gap-3';

        card.innerHTML = `
          <div class=&quot;flex items-start gap-3 cursor-pointer&quot; onclick=&quot;window.abrirModalRecetaCliente(${prod.id});&quot;>
            <div class=&quot;w-12 h-12 rounded-xl bg-slate-800/90 border border-slate-700 flex items-center justify-center text-2xl flex-shrink-0&quot;>
              ${prod.icono || '🍲'}
            </div>
            <div class=&quot;flex-1 min-w-0&quot;>
              <div class=&quot;flex justify-between items-start&quot;>
                <h3 class=&quot;text-sm font-bold text-white tracking-tight truncate&quot;>${prod.nombre}</h3>
                <span class=&quot;text-sm font-black text-emerald-400 ml-2&quot;>$${Number(prod.precio_unitario).toFixed(2)}</span>
              </div>
              <p class=&quot;text-[11px] text-slate-400 mt-1 line-clamp-2&quot;>${prod.descripcion || ''}</p>
              <div class=&quot;flex items-center gap-2 mt-2&quot;>
                <span class=&quot;text-[10px] text-sky-400 font-bold bg-sky-500/10 px-2 py-0.5 rounded-md border border-sky-500/20&quot;>⏱️ ${prod.tiempo || '8–10 min'}</span>
                <span class=&quot;text-[10px] text-slate-400 font-semibold&quot;>${prod.porciones || '1 persona'}</span>
              </div>
            </div>
          </div>
          <div class=&quot;flex items-center justify-between gap-2 pt-2 border-t border-slate-800/80&quot;>
            <button onclick=&quot;window.abrirModalRecetaCliente(${prod.id});&quot; class=&quot;py-1.5 px-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-sky-400 border border-slate-700 text-xs font-bold transition flex items-center gap-1 cursor-pointer&quot;>
              <i class=&quot;fa-solid fa-book-open&quot;></i> Receta
            </button>
            <button onclick=&quot;window.agregarAlCarritoDirecto(${prod.id})&quot; class=&quot;flex-1 py-1.5 px-3 rounded-xl bg-emerald-600/30 hover:bg-emerald-500/40 text-emerald-300 border border-emerald-500/30 text-xs font-bold transition flex items-center justify-center gap-1.5 cursor-pointer&quot;>
              <i class=&quot;fa-solid fa-plus text-emerald-400&quot;></i> Agregar a mi Silla
            </button>
          </div>
        `;
        container.appendChild(card);
      });
    };

    window.abrirModalRecetaCliente = function(prodId) {
      const prod = (window.vsMenuData || []).find(p => p.id === prodId);
      if (!prod) return;

      document.getElementById('cliRecetaIcono').innerText = prod.icono || '🍳';
      document.getElementById('cliRecetaCategoria').innerText = prod.categoria_nombre || 'Desayuno';
      document.getElementById('cliRecetaTitulo').innerText = prod.nombre;
      document.getElementById('cliRecetaTiempo').innerText = prod.tiempo || '8–10 min';
      document.getElementById('cliRecetaPorcion').innerText = prod.porciones || '1 persona';
      document.getElementById('cliRecetaPrecio').innerText = `$${Number(prod.precio_unitario).toFixed(2)}`;

      const listIng = document.getElementById('cliRecetaIngredientesList');
      if (listIng) {
        listIng.innerHTML = '';
        (prod.ingredientes || ['Ingredientes frescos según receta']).forEach(ing => {
          const li = document.createElement('li');
          li.innerText = ing;
          listIng.appendChild(li);
        });
      }

      const listPasos = document.getElementById('cliRecetaPasosList');
      if (listPasos) {
        listPasos.innerHTML = '';
        (prod.pasos || ['Preparar al momento siguiendo receta']).forEach(paso => {
          const li = document.createElement('li');
          li.innerText = paso;
          listPasos.appendChild(li);
        });
      }

      const boxAdic = document.getElementById('boxCliRecetaAdicionales');
      const listAdic = document.getElementById('cliRecetaAdicionalesList');
      if (boxAdic &amp;&amp; listAdic) {
        if (prod.adicionales &amp;&amp; prod.adicionales.length > 0) {
          boxAdic.style.display = 'block';
          listAdic.innerHTML = '';
          prod.adicionales.forEach(adic => {
            const chip = document.createElement('span');
            chip.style.cssText = 'background: #020617; border: 1px solid #0284c7; color: #7dd3fc; font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 6px;';
            chip.innerText = `+ ${adic}`;
            listAdic.appendChild(chip);
          });
        } else {
          boxAdic.style.display = 'none';

      }

      const modal = document.getElementById('modalRecetaClienteBackdrop');
      if (modal) {
        modal.style.display = 'flex';

    };

    window.cerrarModalRecetaCliente = function() {
      const modal = document.getElementById('modalRecetaClienteBackdrop');
      if (modal) {
        modal.style.display = 'none';
      }
    };

    window.navMenu = function (modulo) {
      if (window.anvilAppNav) {
        window.anvilAppNav(modulo);
      } else {
        alert(`Navegación a módulo: ${modulo}`);
      }
    };

    window.detectarParametrosQrUrl = function() {
      try {
        var params = new URLSearchParams(window.location.search);
        var hash = window.location.hash || '';

        if (hash.includes('?')) {
          var hashQuery = hash.substring(hash.indexOf('?') + 1);
          var hashParams = new URLSearchParams(hashQuery);
          hashParams.forEach(function(val, key) {
            params.set(key, val);
          });
        } else if (hash.startsWith('#PV-') || hash.startsWith('#MESA-')) {
          params.set('qr', hash.replace('#', ''));
        }

        var mesaParam = params.get('mesa');
        var sillaParam = params.get('silla');
        var qrParam = params.get('qr');

        if (qrParam &amp;&amp; (!mesaParam || !sillaParam)) {
          var match = qrParam.match(/PV-0?(\d)(\d)/i);
          if (match) {
            mesaParam = match[1];
            sillaParam = match[2];
          }
        }

        if (mesaParam &amp;&amp; sillaParam) {
          var m = parseInt(mesaParam);
          var s = parseInt(sillaParam);
          if (!isNaN(m) &amp;&amp; !isNaN(s)) {
            window.simMesaId = m;
            window.simSillaNum = s;
            var sel = document.getElementById('selSimularQr');
            if (sel) {
              sel.value = m + '-' + s;
            }
            if (window.cambiarSimulacionQr) {
              window.cambiarSimulacionQr(m + '-' + s);
            }
          }
        }
      } catch (e) {
        console.error('Error detectando QR de la URL:', e);
      }
    };

    function initImmediate() {
      window.cargarDatosMenu(window.vsMenuData, window.vsCategoriasData);
      window.detectarParametrosQrUrl();
      window.sincronizarCuentaDesdeStorage();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initImmediate);
    } else {
      initImmediate();
    }
    setTimeout(initImmediate, 10);
    setTimeout(initImmediate, 100);
  </script>
